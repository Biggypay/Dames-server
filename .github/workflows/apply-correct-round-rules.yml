name: Apply corrected round rules

on:
  push:
    branches:
      - fix/correct-round-rules
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: correct-round-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/correct-round-rules
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply corrected rules
        run: node scripts/apply-correct-round-rules.cjs
      - name: Check browser scripts
        run: node tests/test_html_syntax.js
      - name: Verify round contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "P.get('manches')||'6'" public/ttt_ai.html
          grep -q "regularRounds:6" public/quoridor_ai.html
          grep -q "regularRounds:6" public/gomoku_ai.html
          ! grep -q "roundsProgress" public/echecs_ai.html
          ! grep -q "roundsProgress" public/echecs_multi.html
          ! grep -q "roundsProgress" public/dames_ai.html
          ! grep -q "finishEchecsRound" server.js
      - name: Commit actual game files
        shell: bash
        run: |
          set -euo pipefail
          git add public/ttt_ai.html public/quoridor_ai.html public/gomoku_ai.html
          git config user.name "Biggy"
          git config user.email "ritchysandersdossous@gmail.com"
          if ! git diff --cached --quiet; then
            git commit -m "fix(games): keep chess and checkers single while AI series use six rounds"
            git push origin HEAD:fix/correct-round-rules
          fi
