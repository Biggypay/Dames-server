name: Verify Gomoku six-round bake-in

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-gomoku:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        shell: bash
        run: |
          sudo mkdir -p /opt/pw-browsers
          sudo chown -R "$USER":"$USER" /opt/pw-browsers
          PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers npx playwright-core install --with-deps chromium
          for d in /opt/pw-browsers/chromium-*; do
            if [ -x "$d/chrome-linux64/chrome" ] && [ ! -e "$d/chrome-linux" ]; then
              ln -s chrome-linux64 "$d/chrome-linux"
            fi
          done

      - name: Test Gomoku series logic
        run: node tests/test_gomoku_series_logic.js

      - name: Test HTML syntax
        run: node tests/test_html_syntax.js

      - name: Test Gomoku sockets
        run: node tests/test_gomoku.js

      - name: Test Gomoku in real browsers
        env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        run: node tests/test_gomoku_browser.js
