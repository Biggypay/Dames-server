name: Bootstrap real hotseat generation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate feature branch and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/real-engine-hotseat-all-games
          git checkout -B feat/real-engine-hotseat-all-games origin/feat/real-engine-hotseat-all-games
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/tmp-real-engine-hotseat.yml').read_text()
          start=src.index("          python3 - <<'PY'\n")+len("          python3 - <<'PY'\n")
          end=src.index("\n          PY\n",start)
          lines=[]
          for line in src[start:end].splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/generate_hotseat.py').write_text('\n'.join(lines)+'\n')
          PY
          python3 /tmp/generate_hotseat.py
          rm -f .github/workflows/tmp-real-engine-hotseat.yml .hotseat-trigger
          git config user.name "Biggy"
          git config user.email "ritchysandersdossous@gmail.com"
          git add -A
          git commit -m "Ajoute les vrais moteurs de jeu au mode ami offline"
          git push origin HEAD:feat/real-engine-hotseat-all-games

          git checkout main
          git pull --ff-only origin main
          git rm .github/workflows/bootstrap-real-hotseat.yml
          git commit -m "chore: retire le bootstrap hotseat temporaire"
          git push origin main
