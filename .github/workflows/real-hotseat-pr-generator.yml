name: Real hotseat PR generator

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'feat/real-engine-hotseat-all-games'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/real-engine-hotseat-all-games
          fetch-depth: 0
      - name: Generate real hotseat pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/tmp-real-engine-hotseat.yml').read_text()
          start=src.index("          python3 - <<'PY'\n")+len("          python3 - <<'PY'\n")
          end=src.index("\n          PY\n",start)
          lines=[]
          for line in src[start:end].splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          gen='\n'.join(lines)+'\n'
          fixed=[]
          for line in gen.splitlines():
              if "e=regex1(e,r\"updUI\\(\\); stopTimer" in line and "'chess finish turn'" in line:
                  line="e=regex1(e,r\"  updUI\\(\\); stopTimer\\(\\);\\n  if\\(S\\.t === 1\\)\\{\\n    startTimer\\(false, Date\\.now\\(\\)\\);\\n    setTimeout\\(aiTurn, 650\\);\\n  \\} else \\{\\n    startTimer\\(true, Date\\.now\\(\\)\\);\\n  \\}\",\"  updUI(); stopTimer();\\n  startTimer(S.t===MY_PLAYER,Date.now());\",'chess finish turn')"
              fixed.append(line)
          Path('/tmp/generate_hotseat.py').write_text('\n'.join(fixed)+'\n')
          PY
          python3 /tmp/generate_hotseat.py
          rm -f .github/workflows/tmp-real-engine-hotseat.yml .hotseat-trigger .pr-trigger
          git config user.name "Biggy"
          git config user.email "ritchysandersdossous@gmail.com"
          git add -A
          git commit -m "Ajoute les vrais moteurs de jeu au mode ami offline"
          git push origin HEAD:feat/real-engine-hotseat-all-games
