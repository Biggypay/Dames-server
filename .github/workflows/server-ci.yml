name: Server CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Sans navigateur, tests/test_gomoku_browser.js et
      # tests/test_gomoku_ai_browser.js s'annoncent « ignorés » et ne verifient
      # rien. C'est ce silence qui a laissé passer une ReferenceError bloquant
      # le mode IA du Gomoku des la deuxieme manche. PLAYWRIGHT_BROWSERS_PATH
      # est partage par l'installation et par la detection cote test.
      - name: Install Chromium for the browser tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
        run: npx playwright-core install --with-deps chromium

      - name: Run full test suite
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
        run: npm test
