name: Server CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # La suite complète prend 13 à 14,6 min (octobre 2026) : 15 min ne
    # laissaient plus de marge pour un fichier de test de plus.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # La version exacte de Render (.node-version) : 24.22.1 corrige les
          # failles du 21 octobre 2026 (TLS, Brotli, DNS) et retire les
          # certificats eMudhra compromis du magasin de Node.
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Sans navigateur, tests/test_gomoku_browser.js et
      # tests/test_gomoku_ai_browser.js s'annoncent « ignorés » et ne verifient
      # rien. C'est ce silence qui a laissé passer une ReferenceError bloquant
      # le mode IA du Gomoku des la deuxieme manche. PLAYWRIGHT_BROWSERS_PATH
      # est partage par l'installation et par la detection cote test.
      - name: Install Chromium for the browser tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
        run: npx playwright-core install --with-deps chromium

      - name: Run full test suite
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
        run: npm test
