name: Temporary Dames hotseat generator

on:
  push:
    branches:
      - tmp/dames-local-generation

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/dames-local-generation
          fetch-depth: 0

      - name: Generate exact Dames hotseat variant
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          src_path = Path('public/dames_ai.html')
          dst_path = Path('public/dames_local.html')
          server_path = Path('server.js')

          original = src_path.read_text(encoding='utf-8')
          html = original

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          html = replace_once(
              html,
              '<title>Dames 3D — Entraînement IA | Mindspille</title>',
              '<title>Dames 3D — Jouer avec un ami | Mindspille</title>',
              'title',
          )
          html = replace_once(
              html,
              '<div class="profile-name" id="name-human">Vous</div>',
              '<div class="profile-name" id="name-human">Joueur 1</div>',
              'player 1 header label',
          )
          html = replace_once(
              html,
              '<span class="manche-lbl">Entraînement · IA</span>',
              '<span class="manche-lbl">Jouer avec un ami</span>',
              'mode header label',
          )
          html = replace_once(
              html,
              '<div class="profile-name" id="name-ai">Adv</div>',
              '<div class="profile-name" id="name-ai">Joueur 2</div>',
              'player 2 header label',
          )

          old_mode = """// ── MODE ENTRAÎNEMENT vs IA (aucun argent, aucun réseau) ──\n// L'humain est TOUJOURS Blanc (joue en premier), l'IA est Rouge.\nvar DIFFICULTY = (P.get('difficulty') || P.get('level') || 'expert').toLowerCase();\nif(DIFFICULTY === 'max' || DIFFICULTY === 'extreme') DIFFICULTY = 'expert';\nif(['easy','medium','hard','expert'].indexOf(DIFFICULTY) < 0) DIFFICULTY = 'expert';\nvar AI_DEBUG = !!P.get('debug');\n\nvar ROOM_ID = 'solo-ia';"""
          new_mode = """// ── MODE HOTSEAT LOCAL (aucun argent, aucun réseau) ──\nvar HOTSEAT = true;\nvar AI_DEBUG = !!P.get('debug');\nvar DIFFICULTY = 'expert';\n\nvar ROOM_ID = 'local-hotseat';"""
          html = replace_once(html, old_mode, new_mode, 'URL params hotseat mode')

          html = replace_once(
              html,
              "var MY_NAME = P.get('name') || P.get('username') || 'Vous';\nvar OP_NAME = 'IA';",
              "var MY_NAME = P.get('name') || P.get('p1Name') || 'Joueur 1';\nvar OP_NAME = P.get('p2Name') || 'Joueur 2';",
              'local player names',
          )

          html = replace_once(
              html,
              'if(currentPlayer !== MY_PLAYER) return;',
              'if(!HOTSEAT && currentPlayer !== MY_PLAYER) return;',
              'hotseat input guard',
          )

          old_turn = """      currentPlayer = nextPlayer;\n      showLastMoveOrigin(originRow, originCol);\n      updUI(); stopTimer();\n      // ── C'est au tour de l'IA (Rouge) ──\n      isProcessing = true;                 // empêche l'humain de jouer pendant la réflexion\n      startTimer(false, Date.now());       // timer visuel côté IA\n      setTimeout(aiTurn, 650);"""
          new_turn = """      currentPlayer = nextPlayer;\n      showLastMoveOrigin(originRow, originCol);\n      updUI(); stopTimer();\n      isProcessing = true;\n      startTimer(currentPlayer === MY_PLAYER, Date.now());\n      var nextTheta = currentPlayer === 0 ? 0 : Math.PI;\n      animCamTo(camD, 0.72, nextTheta, 650, function(){\n        isProcessing = false;\n        updateForcedHint();\n      });"""
          html = replace_once(html, old_turn, new_turn, 'local turn handoff')

          html = replace_once(
              html,
              "var msg = { type:'mindspille', source:'dames-ai', event:'practice_over', game:'dames', result:outcome, reason:reason||'normal', difficulty:DIFFICULTY };",
              "var msg = { type:'mindspille', source:'dames-local', event:'local_over', game:'dames', result:outcome, reason:reason||'normal' };",
              'local result message',
          )

          # Replace only the result presentation inside handleGameEnd. The game rules,
          # board state and result dispatch remain untouched.
          result_pattern = re.compile(
              r"  var humanWon = \(winner === MY_PLAYER\);\n"
              r"  var colorStr = MY_PLAYER === 0 \? 'blancs' : 'rouges';\n"
              r"  var winnerEmoji = humanWon \? \(MY_PLAYER===0\?'⚪':'🔴'\) : \(MY_PLAYER===0\?'🔴':'⚪'\);\n"
              r"  var title = humanWon \? 'Vous avez gagné cette partie !' : 'Vous avez perdu cette partie\.';\n"
              r"  var sub;\n"
              r"  if\(reason === 'forfeit'\) sub = humanWon \? 'L\\'adversaire a abandonné\.' : 'Vous avez abandonné la partie\.';\n"
              r"  else if\(reason === 'draw'\) \{ title = 'Match Nul'; sub = '50 coups joués sans prise\.'; winnerEmoji = '🤝'; \}\n"
              r"  else sub = humanWon \? \('Félicitations ! Victoire avec les pions '\+colorStr\+'\.\\\n'\+wc\+' pions restants contre '\+rc\+'\.'\) : \(OP_NAME\+' remporte la partie\.\\\n'\+wc\+' pions restants contre '\+rc\+'\.'\);\n"
              r"  \n"
              r"  if\(humanWon\) createConfetti\(\);\n"
              r"  showToast\(winnerEmoji, title, sub, 4000, function\(\)\{ sendResult\(humanWon\?'win':\(reason==='draw'\?'draw':'loss'\), reason\|\|'normal'\); var rb=document\.getElementById\('replay-btn'\); if\(rb\) rb\.classList\.add\('show'\); \}\);"
          )
          result_replacement = """  var isDraw = (reason === 'draw' || winner < 0);\n  var winnerName = winner === 0 ? MY_NAME : OP_NAME;\n  var winnerEmoji = isDraw ? '🤝' : (winner === 0 ? '⚪' : '🔴');\n  var title = isDraw ? 'Match Nul' : (winnerName + ' gagne la partie !');\n  var sub;\n  if(isDraw) sub = '50 coups joués sans prise.';\n  else if(reason === 'forfeit') sub = winnerName + ' gagne par abandon.';\n  else sub = winnerName + ' remporte la partie.\\n' + wc + ' pions blancs restants contre ' + rc + ' pions rouges.';\n\n  if(!isDraw) createConfetti();\n  showToast(winnerEmoji, title, sub, 4000, function(){ sendResult(isDraw?'draw':(winner===MY_PLAYER?'win':'loss'), reason||'normal'); var rb=document.getElementById('replay-btn'); if(rb) rb.classList.add('show'); });"""
          html, n = result_pattern.subn(result_replacement, html, count=1)
          if n != 1:
              raise SystemExit(f'end-game local wording: expected exactly 1 block, found {n}')

          start_pattern = re.compile(
              r"  var diffLbl = DIFFICULTY==='easy' \? 'Facile' : DIFFICULTY==='medium' \? 'Moyen' : DIFFICULTY==='expert' \? 'Expert' : 'Difficile';\n"
              r"  showToast\('🎲','Entraînement', 'Vous commencez \(Blancs\)\\\nIA : niveau '\+diffLbl, 2400, function\(\)\{\n"
              r"    gameReady = true; updUI\(\); startTimer\(true, Date\.now\(\)\);\n"
              r"  \}\);"
          )
          start_replacement = """  showToast('🎲','Jouer avec un ami', MY_NAME+' commence (Blancs)', 2400, function(){\n    gameReady = true; updUI(); startTimer(true, Date.now());\n  });"""
          html, n = start_pattern.subn(start_replacement, html, count=1)
          if n != 1:
              raise SystemExit(f'start toast: expected exactly 1 block, found {n}')

          dst_path.write_text(html, encoding='utf-8', newline='')

          server = server_path.read_text(encoding='utf-8')
          ai_route = "app.get(['/dames-ai', '/dames_ai.html', '/dames-solo', '/dames-entrainement', '/dames-practice', '/dames-ia'], serveSmart(['dames_ai.html', 'dames-ai.html']));"
          local_route = "app.get(['/dames-local', '/dames_local.html', '/dames-ami', '/dames-hotseat'], serveSmart(['dames_local.html', 'dames-local.html']));"
          if local_route in server:
              raise SystemExit('server route already exists unexpectedly')
          server = replace_once(server, ai_route, ai_route + '\n' + local_route, 'server local route')
          server_path.write_text(server, encoding='utf-8', newline='')

          # Syntax checks requested by the task.
          subprocess.run(['node', '--check', 'server.js'], check=True)
          scripts = re.findall(r'<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>', html, flags=re.I)
          checked = 0
          for idx, script in enumerate(scripts):
              if not script.strip():
                  continue
              p = Path(tempfile.gettempdir()) / f'dames-local-inline-{idx}.js'
              p.write_text(script, encoding='utf-8')
              subprocess.run(['node', '--check', str(p)], check=True)
              checked += 1
          if checked == 0:
              raise SystemExit('no inline script found to validate')
          print(f'OK: server.js syntax; {checked} inline script(s) syntax')

          # Contract checks: source AI file remains byte-for-byte untouched and only
          # requested Dames hotseat markers are present in the new copy.
          assert src_path.read_text(encoding='utf-8') == original
          for marker in [
              'var HOTSEAT = true;',
              "var ROOM_ID = 'local-hotseat';",
              "source:'dames-local'",
              "event:'local_over'",
              "Jouer avec un ami",
              'if(!HOTSEAT && currentPlayer !== MY_PLAYER) return;',
          ]:
              assert marker in html, marker
          PY

      - name: Commit generated files only
        shell: bash
        run: |
          rm .github/workflows/tmp-dames-local-generation.yml
          git config user.name "Biggy"
          git config user.email "ritchysandersdossous@gmail.com"
          git add public/dames_local.html server.js .github/workflows/tmp-dames-local-generation.yml
          git diff --cached --name-status
          git commit -m "Ajoute mode hotseat Dames (jouer avec un ami, moteur 3D)"
          git push origin HEAD:tmp/dames-local-generation
