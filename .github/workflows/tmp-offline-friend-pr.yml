name: Temporary offline friend PR generator

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'feat/offline-friend-all-games'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Generate and validate offline friend modes
        run: python3 scripts/tmp_offline_friend_all_games.py
      - name: Commit final changes and remove temporary helpers
        shell: bash
        run: |
          rm -f .github/workflows/tmp-offline-friend-all-games.yml
          rm -f .github/workflows/tmp-offline-friend-pr.yml
          rm -f scripts/tmp_offline_friend_all_games.py
          git config user.name "Biggy"
          git config user.email "ritchysandersdossous@gmail.com"
          git add public/dames_local.html server.js .github/workflows/tmp-offline-friend-all-games.yml .github/workflows/tmp-offline-friend-pr.yml scripts/tmp_offline_friend_all_games.py
          echo 'Final staged paths:'
          git diff --cached --name-status
          git commit -m "Ajoute modes ami offline pour tous les jeux"
          git push origin HEAD:${{ github.head_ref }}
