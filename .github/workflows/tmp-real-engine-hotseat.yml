          p=rep(p,"var MY_NAME        = P.get('name') || P.get('username') || 'Vous';\nvar OP_NAME        = 'IA';","var HOTSEAT=true;\nvar MY_NAME=P.get('name')||P.get('p1Name')||'Joueur 1';\nvar OP_NAME=P.get('p2Name')||'Joueur 2';",'pen names')
          p=p.replace("var myChoice      = null;","var myChoice=null;\nvar localChooser=1;")
          # replace showZones and selectZone together up to checkBothReady
          p=regex1(p,r"function showZones\(\) \{.*?\n\}\n\nfunction hideZones\(\).*?\n\}\n\nfunction selectZone\(idx\) \{.*?\n\}\n\nfunction checkBothReady",'''function renderLocalZones(which){
  var layer=document.getElementById('spots-layer');layer.innerHTML='';layer.style.pointerEvents='all';
  var p1Shooter=isMyShooter(currentRound),chooserShooter=which===1?p1Shooter:!p1Shooter;
  var icon=chooserShooter?'⚽':'🧤';
  SPOTS.forEach(function(sp,i){var btn=document.createElement('button');btn.className='zone-btn';var ring=document.createElement('div');ring.className='zone-ring';var ico=document.createElement('span');ico.className='zone-icon';ico.textContent=icon;ring.appendChild(ico);btn.appendChild(ring);btn.style.left=sp.x+'px';btn.style.top=sp.y+'px';btn.addEventListener('click',function(){selectZone(i);});layer.appendChild(btn);});
  if(chooserShooter)showBallCenter();else hideBallCenter();
  var sb=document.getElementById('status-bar');sb.className='show';sb.textContent=(which===1?MY_NAME:OP_NAME)+(chooserShooter?' : choisissez la zone de tir':' : choisissez la zone de parade');
  document.getElementById('profile-me').className=which===1?'profile active choosing':'profile';
  document.getElementById('profile-op').className=which===2?'profile active choosing':'profile';render();
}
function showZones(){localChooser=1;myChoice=null;aiChoice=null;myLocked=false;opLocked=false;renderLocalZones(1);startTimer(Date.now());}
function hideZones(){var layer=document.getElementById('spots-layer');layer.innerHTML='';layer.style.pointerEvents='none';}
function selectZone(idx){
  if(phase!=='choosing')return;
  if(localChooser===1){
    myChoice=idx;myLocked=true;localChooser=2;
    hideZones();
    var sb=document.getElementById('status-bar');sb.className='show';sb.textContent='Passez au '+OP_NAME;sb.style.color='#fbbf24';
    setTimeout(function(){renderLocalZones(2);},450);return;
  }
  aiChoice=idx;opLocked=true;hideZones();checkBothReady();
}

function checkBothReady''','penalty zones')
          p=p.replace("myChoice = null; myLocked = false; opLocked = false;","myChoice=null;aiChoice=null;localChooser=1;myLocked=false;opLocked=false;")
