    return;
  }
  opponentChoice=choice;playerLocked=true;opLocked=true;
  aiEmojiEl.textContent='🔒';aiLabelEl.textContent='Choix enregistré';aiCard.classList.remove('waiting');aiCard.classList.add('hidden-choice','ai-active');
  choiceBtns.forEach(function(btn){btn.classList.add('disabled');});
  startRevealCountdown();
}

/* ══════════════════════════════════════════
   REVEAL COUNTDOWN''','rps choose')
          c=rep(c,"playerChoice   = null;\n  opponentChoice = null;\n  roundInProgress = true;","playerChoice=null;opponentChoice=null;localChoosingPlayer=1;playerLocked=false;opLocked=false;roundInProgress=true;",'rps round state')
          c=c.replace("// Timer visuel local + l'IA fait son choix après un court délai (réflexion)\n  startTimer(Date.now());\n  scheduleAiChoice();","// Hotseat : Joueur 1 choisit, puis on passe l'appareil au Joueur 2.\n  startTimer(Date.now());\n  statusEl.className='status visible';statusEl.textContent=MY_NAME+' choisit';")
          c=c.replace("if (result === 'win')       msg = myC && opC ? '🎉 Victoire ! ' + emojis[myC] + ' bat ' + emojis[opC] : '🎉 Victoire !';\n  else if (result === 'lose') msg = myC && opC ? '💀 Défaite... ' + emojis[opC] + ' bat ' + emojis[myC] : '💀 Défaite...';","if(result==='win')msg='🎉 '+MY_NAME+' gagne ! '+emojis[myC]+' bat '+emojis[opC];\n  else if(result==='lose')msg='🎉 '+OP_NAME+' gagne ! '+emojis[opC]+' bat '+emojis[myC];")
          c=c.replace("source:'chifoumi-ai'","source:'chifoumi-local'").replace("event:'practice_over'","event:'local_over'")
          (PUB/'chifoumi_local.html').write_text(c,encoding='utf-8')

