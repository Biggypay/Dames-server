            "app.get(['/chifoumi-local', '/chifoumi-ami'], localFriendRoute('rock_paper_scissors'));":"app.get(['/chifoumi-local','/chifoumi-ami'], serveSmart(['chifoumi_local.html']));",
            "app.get(['/penalty-local', '/penalty-ami'], localFriendRoute('penalty_shootout'));":"app.get(['/penalty-local','/penalty-ami'], serveSmart(['penalty_local.html'], true));",
            "app.get(['/echecs-local', '/chess-local', '/echecs-ami', '/chess-ami'], localFriendRoute('chess'));":"app.get(['/echecs-local','/chess-local','/echecs-ami','/chess-ami'], serveSmart(['echecs_local.html']));",
            "app.get(['/gomoku-local', '/morpion5-local', '/gomoku-ami', '/morpion5-ami'], localFriendRoute('gomoku'));":"app.get(['/gomoku-local','/morpion5-local','/gomoku-ami','/morpion5-ami'], serveSmart(['gomoku_local.html']));",
          }
          for a,b in route_map.items(): s=rep(s,a,b,'server route '+a.split("'")[1])
          sp.write_text(s,encoding='utf-8')

          # Syntax and contract checks.
          subprocess.run(['node','--check','server.js'],check=True)
          made=['ttt_local.html','quoridor_local.html','echecs_local.html','gomoku_local.html','chifoumi_local.html','penalty_local.html','dames_local.html']
          for name in made:
              html=(PUB/name).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,flags=re.I)
              checked=0
              for i,js in enumerate(scripts):
                  if not js.strip(): continue
                  tmp=Path(tempfile.gettempdir())/f'{name}-{i}.js';tmp.write_text(js,encoding='utf-8')
                  subprocess.run(['node','--check',str(tmp)],check=True);checked+=1
              if not checked: raise SystemExit('no inline JS in '+name)
              print('OK',name,checked)
          for path in ['/ttt-local','/quoridor-local','/chifoumi-local','/penalty-local','/echecs-local','/gomoku-local','/dames-local']:
              if path not in s: raise SystemExit('missing route '+path)
          if "localFriendRoute('tictactoe')" in s or "localFriendRoute('quoridor')" in s: raise SystemExit('generic 2D routes still active')
          print('OK real-engine hotseat pages')
          PY

      - name: Commit generated game pages
        shell: bash
        run: |
          rm -f .github/workflows/tmp-real-engine-hotseat.yml
          git config user.name "Biggy"
          git config user.email "ritchysandersdossous@gmail.com"
          git add public/ttt_local.html public/quoridor_local.html public/echecs_local.html public/gomoku_local.html public/chifoumi_local.html public/penalty_local.html server.js .github/workflows/tmp-real-engine-hotseat.yml
          git commit -m "Ajoute les vrais moteurs de jeu au mode ami offline"
          git push origin HEAD:feat/real-engine-hotseat-all-games
