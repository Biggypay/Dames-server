          route_map={
            "app.get(['/ttt-local', '/tictactoe-local', '/ttt-ami', '/tictactoe-ami'], localFriendRoute('tictactoe'));":"app.get(['/ttt-local','/tictactoe-local','/ttt-ami','/tictactoe-ami'], serveSmart(['ttt_local.html']));",
