<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Dames — Entraînement IA | Mindspille</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap');
:root{
  --bg1:#0d1017; --bg2:#141826; --card:#171b28; --card2:#1e2434;
  --pink:#ec4899; --pink2:#f472b6; --pink-soft:rgba(236,72,153,.15);
  --line:rgba(255,255,255,.08); --txt:#f4f5f8; --muted:rgba(255,255,255,.5);
  --sq-dark:#4a3d5c; --sq-light:#d9c7a8;
  --gold:#fbbf24; --good:#34d399; --bad:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;color:var(--txt);
  background:radial-gradient(1200px 600px at 50% -10%,#1b2033 0%,var(--bg1) 60%);
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px);overflow-x:hidden
}
.app{width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px;flex:1}

/* ── Header ── */
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.iconbtn{width:38px;height:38px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--line);border-radius:50%;color:var(--txt);cursor:pointer;transition:.15s}
.iconbtn:active{transform:scale(.92);background:var(--card2)}
.title{flex:1;text-align:center}
.title h1{font-family:'Cinzel',serif;font-size:17px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;gap:7px}
.badge-free{display:inline-block;margin-top:3px;font-size:10px;font-weight:600;letter-spacing:.6px;color:var(--good);
  background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.35);border-radius:99px;padding:2px 10px}

/* ── Players bar ── */
.players{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.pl{display:flex;align-items:center;gap:9px;min-width:0}
.pl.me{flex-direction:row}
.pl.ai{flex-direction:row-reverse;text-align:right}
.disc{width:34px;height:34px;border-radius:50%;flex:0 0 auto;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.disc.w{background:radial-gradient(circle at 35% 30%,#ffffff,#d7d2c4 70%,#b8b2a0);border:2px solid #efe9d8}
.disc.r{background:radial-gradient(circle at 35% 30%,#f0665a,#d1362b 65%,#9c2018);border:2px solid #f08a80}
.pl .info{min-width:0}
.pl .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.pl .cnt{font-size:11px;color:var(--muted)}
.vs{font-family:'Cinzel',serif;font-size:12px;color:var(--muted);flex:0 0 auto}
.pl.turn .disc{box-shadow:0 0 0 3px var(--pink-soft),0 0 14px rgba(236,72,153,.5)}
.pl .nm.act{color:var(--pink2)}

/* ── Status line ── */
.status{text-align:center;font-size:13px;font-weight:500;color:var(--muted);min-height:20px;display:flex;align-items:center;justify-content:center;gap:8px}
.status b{color:var(--txt)}
.dotpulse{width:7px;height:7px;border-radius:50%;background:var(--pink);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}

/* ── Board ── */
.board-wrap{position:relative;width:100%;aspect-ratio:1;border-radius:16px;overflow:hidden;
  border:1px solid rgba(255,255,255,.1);box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 0 0 6px rgba(0,0,0,.25);
  background:var(--card)}
.board{position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr)}
.cell{position:relative;display:flex;align-items:center;justify-content:center}
.cell.light{background:var(--sq-light)}
.cell.dark{background:var(--sq-dark)}
.cell.dark.playable{cursor:pointer}
.cell.lastmove::before{content:'';position:absolute;inset:0;background:rgba(251,191,36,.28)}
.cell.sel::after{content:'';position:absolute;inset:8%;border:2.5px solid var(--pink2);border-radius:22%;box-shadow:0 0 12px rgba(236,72,153,.7)}
.dot{position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(236,72,153,.55);box-shadow:0 0 10px rgba(236,72,153,.5);pointer-events:none;z-index:3}
.dot.cap{width:64%;height:64%;background:transparent;border:3px solid rgba(248,113,113,.85);box-shadow:0 0 12px rgba(248,113,113,.55)}
.piece{position:absolute;width:78%;height:78%;border-radius:50%;z-index:2;
  display:flex;align-items:center;justify-content:center;transition:transform .12s;will-change:transform}
.piece.w{background:radial-gradient(circle at 34% 28%,#ffffff,#e5e0d2 62%,#c3bda9);
  border:2px solid #f3eddc;box-shadow:0 3px 7px rgba(0,0,0,.45),inset 0 3px 6px rgba(255,255,255,.85)}
.piece.r{background:radial-gradient(circle at 34% 28%,#f4746a,#d5382c 60%,#a01f16);
  border:2px solid #f59389;box-shadow:0 3px 7px rgba(0,0,0,.45),inset 0 3px 6px rgba(255,180,170,.55)}
.piece.king::after{content:'♛';font-size:min(4.2vw,20px);color:var(--gold);text-shadow:0 1px 2px rgba(0,0,0,.6)}
.piece.movable{cursor:pointer}
.piece.movable::before{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid rgba(236,72,153,.6)}
.piece.pop{animation:pop .18s}
@keyframes pop{0%{transform:scale(.5)}100%{transform:scale(1)}}

/* ── Controls ── */
.controls{display:flex;flex-direction:column;gap:10px}
.difficulty{display:flex;gap:8px}
.diff{flex:1;padding:9px 4px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s;text-align:center}
.diff:active{transform:scale(.97)}
.diff.on{color:#fff;background:linear-gradient(135deg,var(--pink),var(--pink2));border-color:transparent;box-shadow:0 6px 18px rgba(236,72,153,.35)}
.actions{display:flex;gap:8px}
.btn{flex:1;padding:12px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--txt);
  font-size:14px;font-weight:600;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:7px}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--pink),var(--pink2));border-color:transparent;box-shadow:0 8px 22px rgba(236,72,153,.35)}
.hintline{text-align:center;font-size:11px;color:rgba(255,255,255,.35)}

/* ── Modal ── */
.overlay{position:fixed;inset:0;background:rgba(6,8,14,.72);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
.overlay.show{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:340px;background:linear-gradient(160deg,var(--card2),var(--card));
  border:1px solid var(--line);border-radius:22px;padding:28px 24px;text-align:center;box-shadow:0 25px 70px rgba(0,0,0,.6)}
.modal .emo{font-size:56px;margin-bottom:6px}
.modal h2{font-family:'Cinzel',serif;font-size:24px;margin-bottom:6px}
.modal h2.win{color:var(--good)}.modal h2.lose{color:var(--bad)}.modal h2.draw{color:var(--gold)}
.modal p{color:var(--muted);font-size:13px;margin-bottom:20px}
.modal .btn.primary{width:100%}
.forced{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:6;
  background:rgba(248,113,113,.2);border:1.5px solid rgba(248,113,113,.7);color:#fecaca;
  font-size:11px;font-weight:700;padding:6px 14px;border-radius:99px;display:none;white-space:nowrap;backdrop-filter:blur(6px)}
.forced.show{display:block;animation:pulse2 1s infinite}
@keyframes pulse2{0%,100%{opacity:.85}50%{opacity:1}}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="iconbtn" id="backBtn" aria-label="Retour">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="title">
      <h1>♛ Dames</h1>
      <span class="badge-free">ENTRAÎNEMENT · GRATUIT</span>
    </div>
    <button class="iconbtn" id="restartTop" aria-label="Recommencer">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 3v5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <div class="players">
    <div class="pl me turn" id="pl-me">
      <div class="disc w"></div>
      <div class="info"><div class="nm act" id="nm-me">Vous</div><div class="cnt"><span id="cnt-me">20</span> pions</div></div>
    </div>
    <div class="vs">VS</div>
    <div class="pl ai" id="pl-ai">
      <div class="disc r"></div>
      <div class="info"><div class="nm" id="nm-ai">IA · Moyen</div><div class="cnt"><span id="cnt-ai">20</span> pions</div></div>
    </div>
  </div>

  <div class="status" id="status"><b>À vous de jouer</b></div>

  <div class="board-wrap">
    <div class="forced" id="forced">⚡ Prise obligatoire</div>
    <div class="board" id="board"></div>
  </div>

  <div class="controls">
    <div class="difficulty" id="diffRow">
      <button class="diff" data-d="easy">😊 Facile</button>
      <button class="diff on" data-d="medium">🎯 Moyen</button>
      <button class="diff" data-d="hard">🔥 Difficile</button>
    </div>
    <div class="actions">
      <button class="btn" id="undoBtn">↶ Annuler</button>
      <button class="btn primary" id="newBtn">Nouvelle partie</button>
    </div>
    <div class="hintline">Touche un de tes pions blancs, puis la case de destination.</div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="emo" id="m-emo">🏆</div>
    <h2 id="m-title" class="win">Victoire !</h2>
    <p id="m-sub">Bien joué, tu progresses.</p>
    <button class="btn primary" id="m-again">Rejouer</button>
  </div>
</div>

<script>
(function(){
'use strict';

/* ══════════════════════════════════════════════════════════
   MOTEUR DE DAMES 10x10 — règles internationales
   (porté à l'identique du server.js Mindspille pour un
    entraînement 100% fidèle au vrai jeu multijoueur)
══════════════════════════════════════════════════════════ */
var EMPTY=0, WHITE=1, BLACK=2, WKING=3, BKING=4;
var isKing =function(p){return p===WKING||p===BKING;};
var isWhite=function(p){return p===WHITE||p===WKING;};
var isBlack=function(p){return p===BLACK||p===BKING;};
var isOwn  =function(p,pl){return pl==='white'?isWhite(p):isBlack(p);};
var isEnemy=function(p,pl){return pl==='white'?isBlack(p):isWhite(p);};
var inB    =function(r,c){return r>=0&&r<10&&c>=0&&c<10;};
var copyB  =function(b){return b.map(function(r){return r.slice();});};

function initialBoard(){
  var b=[];for(var i=0;i<10;i++){b.push(new Array(10).fill(EMPTY));}
  for(var r=0;r<4;r++)for(var c=0;c<10;c++)if((r+c)%2===1)b[r][c]=BLACK;
  for(var r2=6;r2<10;r2++)for(var c2=0;c2<10;c2++)if((r2+c2)%2===1)b[r2][c2]=WHITE;
  return b;
}
var DIRS=[[-1,-1],[-1,1],[1,-1],[1,1]];

function getSimpleMoves(r,c,b){
  var piece=b[r][c],moves=[];
  if(!isKing(piece)){
    var dirs=isWhite(piece)?[[-1,-1],[-1,1]]:[[1,-1],[1,1]];
    for(var i=0;i<dirs.length;i++){var nr=r+dirs[i][0],nc=c+dirs[i][1];
      if(inB(nr,nc)&&b[nr][nc]===EMPTY)moves.push({to:[nr,nc],capturedPieces:[]});}
  }else{
    for(var d=0;d<4;d++){var nr2=r+DIRS[d][0],nc2=c+DIRS[d][1];
      while(inB(nr2,nc2)&&b[nr2][nc2]===EMPTY){moves.push({to:[nr2,nc2],capturedPieces:[]});nr2+=DIRS[d][0];nc2+=DIRS[d][1];}}
  }
  return moves;
}

function getCaptures(r,c,b,player,already){
  already=already||[];
  var piece=b[r][c],results=[];
  if(!isKing(piece)){
    for(var d=0;d<4;d++){
      var dr=DIRS[d][0],dc=DIRS[d][1];
      var mr=r+dr,mc=c+dc,lr=r+2*dr,lc=c+2*dc;
      if(!inB(lr,lc)||!isEnemy(b[mr][mc],player)||b[lr][lc]!==EMPTY)continue;
      var key=mr+','+mc; if(already.indexOf(key)>=0)continue;
      var nb=copyB(b),cp=b[mr][mc]; nb[lr][lc]=piece;nb[r][c]=EMPTY;nb[mr][mc]=EMPTY;
      var f=getCaptures(lr,lc,nb,player,already.concat([key]));
      if(f.length){for(var i=0;i<f.length;i++)results.push({to:f[i].to,capturedPieces:[{r:mr,c:mc,piece:cp}].concat(f[i].capturedPieces)});}
      else results.push({to:[lr,lc],capturedPieces:[{r:mr,c:mc,piece:cp}]});
    }
  }else{
    for(var d2=0;d2<4;d2++){
      var dr2=DIRS[d2][0],dc2=DIRS[d2][1];
      var nr=r+dr2,nc=c+dc2;
      while(inB(nr,nc)&&b[nr][nc]===EMPTY){nr+=dr2;nc+=dc2;}
      if(!inB(nr,nc)||!isEnemy(b[nr][nc],player))continue;
      var key2=nr+','+nc; if(already.indexOf(key2)>=0)continue;
      var ep=b[nr][nc],lr2=nr+dr2,lc2=nc+dc2;
      while(inB(lr2,lc2)&&b[lr2][lc2]===EMPTY){
        var nb2=copyB(b);nb2[lr2][lc2]=piece;nb2[r][c]=EMPTY;nb2[nr][nc]=EMPTY;
        var f2=getCaptures(lr2,lc2,nb2,player,already.concat([key2]));
        if(f2.length){for(var j=0;j<f2.length;j++)results.push({to:f2[j].to,capturedPieces:[{r:nr,c:nc,piece:ep}].concat(f2[j].capturedPieces)});}
        else results.push({to:[lr2,lc2],capturedPieces:[{r:nr,c:nc,piece:ep}]});
        lr2+=dr2;lc2+=dc2;
      }
    }
  }
  return results;
}

function getAllCaptures(player,b){
  var all=[];
  for(var r=0;r<10;r++)for(var c=0;c<10;c++)
    if(isOwn(b[r][c],player)){var caps=getCaptures(r,c,b,player);
      for(var i=0;i<caps.length;i++)all.push({from:[r,c],to:caps[i].to,capturedPieces:caps[i].capturedPieces});}
  return all;
}

/* Liste des coups légaux avec règle de capture maximale obligatoire */
function legalMoves(player,b){
  var caps=getAllCaptures(player,b);
  if(caps.length){
    var max=0;for(var i=0;i<caps.length;i++)if(caps[i].capturedPieces.length>max)max=caps[i].capturedPieces.length;
    return caps.filter(function(m){return m.capturedPieces.length===max;})
      .map(function(m){return {from:m.from,to:m.to,captures:m.capturedPieces,isCapture:true};});
  }
  var moves=[];
  for(var r=0;r<10;r++)for(var c=0;c<10;c++)
    if(isOwn(b[r][c],player)){var sm=getSimpleMoves(r,c,b);
      for(var k=0;k<sm.length;k++)moves.push({from:[r,c],to:sm[k].to,captures:[],isCapture:false});}
  return moves;
}

function applyChosen(b,move){
  var nb=copyB(b),piece=nb[move.from[0]][move.from[1]];
  nb[move.from[0]][move.from[1]]=EMPTY;
  for(var i=0;i<move.captures.length;i++)nb[move.captures[i].r][move.captures[i].c]=EMPTY;
  var np=piece;
  if(piece===WHITE&&move.to[0]===0)np=WKING;
  if(piece===BLACK&&move.to[0]===9)np=BKING;
  nb[move.to[0]][move.to[1]]=np;
  return nb;
}

/* ══════════════════════════════════════════════════════════
   IA — negamax + élagage alpha-bêta
══════════════════════════════════════════════════════════ */
function evalAbs(b){ // >0 favorise Blanc (humain), <0 favorise Rouge (IA)
  var s=0;
  for(var r=0;r<10;r++)for(var c=0;c<10;c++){
    var p=b[r][c];if(!p)continue;
    var center=(c>=3&&c<=6&&r>=3&&r<=6)?1:0;
    if(p===WHITE)      s+= 100 + (9-r)*1.4 + center;
    else if(p===WKING) s+= 300 + center;
    else if(p===BLACK) s-= 100 + r*1.4 + center;
    else if(p===BKING) s-= 300 + center;
  }
  return s;
}
function opp(pl){return pl==='white'?'black':'white';}

function negamax(b,player,depth,alpha,beta){
  var moves=legalMoves(player,b);
  if(moves.length===0) return -100000-depth; // ce joueur est bloqué => perd
  if(depth===0){var e=evalAbs(b);return player==='white'?e:-e;}
  moves.sort(function(a,c){return c.captures.length-a.captures.length;});
  var best=-Infinity;
  for(var i=0;i<moves.length;i++){
    var nb=applyChosen(b,moves[i]);
    var sc=-negamax(nb,opp(player),depth-1,-beta,-alpha);
    if(sc>best)best=sc;
    if(best>alpha)alpha=best;
    if(alpha>=beta)break;
  }
  return best;
}

function aiChoose(b){
  var moves=legalMoves('black',b);
  if(!moves.length)return null;
  if(moves.length===1)return moves[0];
  if(DIFF==='easy'&&Math.random()<0.4)return moves[(Math.random()*moves.length)|0];
  var depth=DIFF==='easy'?1:(DIFF==='medium'?3:5);
  moves.sort(function(a,c){return c.captures.length-a.captures.length;});
  var best=null,bestScore=-Infinity,alpha=-Infinity;
  for(var i=0;i<moves.length;i++){
    var nb=applyChosen(b,moves[i]);
    var sc=-negamax(nb,'white',depth-1,-Infinity,-alpha);
    if(sc>bestScore||(sc===bestScore&&Math.random()<0.35)){bestScore=sc;best=moves[i];}
    if(bestScore>alpha)alpha=bestScore;
  }
  return best;
}

/* ══════════════════════════════════════════════════════════
   ÉTAT DE JEU + UI
══════════════════════════════════════════════════════════ */
var Q=new URLSearchParams(location.search);
var DIFF=(Q.get('difficulty')||Q.get('level')||'medium').toLowerCase();
if(['easy','medium','hard'].indexOf(DIFF)<0)DIFF='medium';
var MY_NAME=Q.get('name')||Q.get('username')||'Vous';

var board=[], selected=null, myMoves=[], busy=false, over=false, idle=0;
var history=[]; // pour "Annuler"
var lastMove=null;
var DIFF_LABEL={easy:'Facile',medium:'Moyen',hard:'Difficile'};

var $=function(id){return document.getElementById(id);};
var boardEl=$('board');

function newGame(){
  board=initialBoard(); selected=null; myMoves=[]; busy=false; over=false; idle=0;
  history=[]; lastMove=null;
  $('overlay').classList.remove('show');
  $('nm-me').textContent=MY_NAME;
  $('nm-ai').textContent='IA · '+DIFF_LABEL[DIFF];
  setStatus('<b>À vous de jouer</b>');
  setTurn('me');
  render();
}

function setStatus(html){$('status').innerHTML=html;}
function setTurn(who){
  $('pl-me').classList.toggle('turn',who==='me');
  $('pl-ai').classList.toggle('turn',who==='ai');
  $('nm-me').classList.toggle('act',who==='me');
  $('nm-ai').classList.toggle('act',who==='ai');
}

function counts(){
  var w=0,r=0;
  for(var i=0;i<10;i++)for(var j=0;j<10;j++){var p=board[i][j];if(isWhite(p))w++;else if(isBlack(p))r++;}
  return {w:w,r:r};
}

function render(){
  boardEl.innerHTML='';
  var capSquares={}; // destinations de capture pour le pion sélectionné
  var moveSquares={};
  if(selected){
    for(var m=0;m<myMoves.length;m++){
      var mv=myMoves[m];
      if(mv.from[0]===selected[0]&&mv.from[1]===selected[1]){
        moveSquares[mv.to[0]+','+mv.to[1]]=mv.isCapture?'cap':'move';
      }
    }
  }
  // pions autorisés à jouer (règle capture max)
  var movablePieces={};
  if(!busy&&!over){for(var mm=0;mm<myMoves.length;mm++){movablePieces[myMoves[mm].from[0]+','+myMoves[mm].from[1]]=1;}}

  for(var r=0;r<10;r++){
    for(var c=0;c<10;c++){
      var cell=document.createElement('div');
      var dark=(r+c)%2===1;
      cell.className='cell '+(dark?'dark playable':'light');
      cell.dataset.r=r; cell.dataset.c=c;
      if(lastMove&&((lastMove.from[0]===r&&lastMove.from[1]===c)||(lastMove.to[0]===r&&lastMove.to[1]===c)))
        cell.classList.add('lastmove');
      if(selected&&selected[0]===r&&selected[1]===c)cell.classList.add('sel');

      var key=r+','+c;
      if(moveSquares[key]){
        var dot=document.createElement('div');
        dot.className='dot'+(moveSquares[key]==='cap'?' cap':'');
        cell.appendChild(dot);
      }
      var p=board[r][c];
      if(p){
        var pc=document.createElement('div');
        pc.className='piece '+(isWhite(p)?'w':'r')+(isKing(p)?' king':'');
        if(isWhite(p)&&movablePieces[key])pc.classList.add('movable');
        cell.appendChild(pc);
      }
      boardEl.appendChild(cell);
    }
  }
  var cc=counts();
  $('cnt-me').textContent=cc.w; $('cnt-ai').textContent=cc.r;
}

/* ── Interaction ── */
boardEl.addEventListener('click',function(e){
  if(busy||over)return;
  var cell=e.target.closest('.cell'); if(!cell)return;
  var r=+cell.dataset.r, c=+cell.dataset.c;

  // clic sur une destination valide du pion sélectionné ?
  if(selected){
    var chosen=null;
    for(var i=0;i<myMoves.length;i++){
      var mv=myMoves[i];
      if(mv.from[0]===selected[0]&&mv.from[1]===selected[1]&&mv.to[0]===r&&mv.to[1]===c){chosen=mv;break;}
    }
    if(chosen){ playMove(chosen); return; }
  }
  // sélectionner un de ses pions (s'il est autorisé à jouer)
  if(isWhite(board[r][c])){
    var canPlay=myMoves.some(function(m){return m.from[0]===r&&m.from[1]===c;});
    if(canPlay){ selected=[r,c]; render(); }
    else{
      selected=null; render();
      // avertir si prise obligatoire ailleurs
      if(myMoves.length&&myMoves[0].isCapture) flashForced();
    }
    return;
  }
  selected=null; render();
});

function flashForced(){
  var f=$('forced'); f.classList.add('show');
  clearTimeout(flashForced._t);
  flashForced._t=setTimeout(function(){f.classList.remove('show');},1600);
}

function playMove(move){
  history.push(copyB(board));
  var wasCapture=move.captures.length>0;
  var promoted=(board[move.from[0]][move.from[1]]===WHITE&&move.to[0]===0);
  board=applyChosen(board,move);
  lastMove={from:move.from,to:move.to};
  selected=null; myMoves=[];
  idle=(wasCapture||promoted)?0:idle+1;
  render();
  // fin ?
  if(checkEnd('me'))return;
  // tour de l'IA
  busy=true; setTurn('ai');
  setStatus('<span class="dotpulse"></span> <b>IA</b> réfléchit…');
  setTimeout(aiTurn, 480);
}

function aiTurn(){
  if(over)return;
  var move=aiChoose(board);
  if(!move){ endGame('win','L\'IA est bloquée. Tu gagnes !'); return; }
  history.push(copyB(board));
  var wasCapture=move.captures.length>0;
  var promoted=(board[move.from[0]][move.from[1]]===BLACK&&move.to[0]===9);
  board=applyChosen(board,move);
  lastMove={from:move.from,to:move.to};
  idle=(wasCapture||promoted)?0:idle+1;
  render();
  if(checkEnd('ai'))return;
  busy=false; selected=null;
  myMoves=legalMoves('white',board);
  setTurn('me');
  if(myMoves.length&&myMoves[0].isCapture){ setStatus('<b>À vous</b> — prise obligatoire ⚡'); flashForced(); }
  else setStatus('<b>À vous de jouer</b>');
  render();
}

function checkEnd(justPlayed){
  var cc=counts();
  if(cc.r===0){ endGame('win','Tu as capturé tous les pions adverses !'); return true; }
  if(cc.w===0){ endGame('lose','L\'IA a capturé tous tes pions.'); return true; }
  // le joueur suivant a-t-il un coup ?
  var nextPlayer=(justPlayed==='me')?'black':'white';
  var nm=legalMoves(nextPlayer,board);
  if(nm.length===0){
    if(nextPlayer==='black') endGame('win','L\'IA ne peut plus bouger. Victoire !');
    else endGame('lose','Tu ne peux plus bouger.');
    return true;
  }
  if(idle>=50){ endGame('draw','25 coups sans prise : match nul.'); return true; }
  return false;
}

function endGame(result,sub){
  over=true; busy=false; selected=null; render();
  setTurn(null);
  var emo=result==='win'?'🏆':result==='lose'?'😔':'🤝';
  var title=result==='win'?'Victoire !':result==='lose'?'Défaite':'Match nul';
  $('m-emo').textContent=emo;
  var t=$('m-title'); t.textContent=title; t.className=result;
  $('m-sub').textContent=sub||'';
  setStatus('<b>'+title+'</b>');
  setTimeout(function(){$('overlay').classList.add('show');},450);
  // informer l'app hôte (Lovable) — mode entraînement, aucun argent
  try{ (window.parent||window).postMessage({type:'mindspille',source:'dames-ai',event:'practice_over',result:result,difficulty:DIFF},'*'); }catch(e){}
}

function undo(){
  if(busy||over||history.length===0)return;
  // annuler le dernier coup IA + le mien (revenir à mon tour précédent)
  if(history.length>=2){ history.pop(); board=history.pop(); }
  else { board=history.pop(); }
  over=false; selected=null; lastMove=null;
  myMoves=legalMoves('white',board);
  setTurn('me'); setStatus('<b>À vous de jouer</b>');
  render();
}

/* ── Boutons ── */
$('diffRow').addEventListener('click',function(e){
  var b=e.target.closest('.diff'); if(!b)return;
  DIFF=b.dataset.d;
  Array.prototype.forEach.call(this.children,function(x){x.classList.toggle('on',x===b);});
  $('nm-ai').textContent='IA · '+DIFF_LABEL[DIFF];
  newGame();
});
$('newBtn').addEventListener('click',newGame);
$('restartTop').addEventListener('click',newGame);
$('m-again').addEventListener('click',newGame);
$('undoBtn').addEventListener('click',undo);
$('backBtn').addEventListener('click',function(){
  try{ (window.parent||window).postMessage({type:'mindspille',source:'dames-ai',event:'back'},'*'); }catch(e){}
  if(history.length&&window.history.length>1)window.history.back();
});

// init sélecteur de difficulté depuis l'URL
Array.prototype.forEach.call($('diffRow').children,function(x){x.classList.toggle('on',x.dataset.d===DIFF);});

// pré-calcul des coups au démarrage
newGame();
myMoves=legalMoves('white',board);
render();
})();
</script>
</body>
