<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Dames 3D Pro - International Multijoueur | Nano Banana</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#1e1b4b 0%,#312e81 50%,#1e1b4b 100%);width:100vw;height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* Barre du haut 100% transparente */
#top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:15px 14px 8px;background:transparent;z-index:20;gap:8px}

.profile{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:72px; opacity:0.5; transition:opacity 0.3s}
.profile.active{opacity:1}
.profile-timer-wrap{position:relative;width:58px;height:58px; transition: filter 0.3s;}

/* Filtre drop-shadow pour mobile */
.profile.active.human-active .profile-timer-wrap { filter: drop-shadow(0 0 10px rgba(255,255,255,0.6)); }
.profile.active.ai-active .profile-timer-wrap { filter: drop-shadow(0 0 10px rgba(231,76,60,0.6)); }

.profile-timer-wrap svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.timer-track{fill:none;stroke:rgba(255,255,255,0.08);stroke-width:4}
.timer-arc{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:163.4;stroke-dashoffset:163.4;transition:stroke 0.3s}
.profile-avatar{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:50%; -webkit-border-radius:50%; background-clip:padding-box; background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.12);transition:border-color 0.3s, background 0.3s}
.profile.active .profile-avatar{border-color:rgba(255,255,255,0.5);background:rgba(255,255,255,0.10)}

.av-white{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#f5f5f5 0%,#ffffff 50%,#e0e0e0 100%);border:3px solid #c0c0c0;box-shadow:0 2px 8px rgba(255,255,255,0.4),inset 0 2px 4px rgba(255,255,255,0.8);position:relative}
.av-white::after{content:'';position:absolute;top:20%;left:20%;width:35%;height:20%;border-radius:50%;background:rgba(255,255,255,0.9);transform:rotate(-45deg)}
.av-red{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#c0392b 0%,#e74c3c 50%,#a93226 100%);border:3px solid #922b21;box-shadow:0 2px 8px rgba(231,76,60,0.4),inset 0 2px 4px rgba(255,150,150,0.3);position:relative}
.av-red::after{content:'';position:absolute;top:20%;left:20%;width:35%;height:20%;border-radius:50%;background:rgba(255,200,200,0.4);transform:rotate(-45deg)}
.av-king::before{content:'♔';position:absolute;top:50%;left:50%;transform:translate(-50%,-55%);font-size:14px;color:#fbbf24;text-shadow:0 1px 2px rgba(0,0,0,0.5)}
/* La vraie photo du joueur remplace la pastille blanche ou rouge. */
.profile-photo{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
/* La couronne ne peut plus etre dessinee DANS le pion : elle devient une
   pastille posee sur le bord de la photo, pour ne pas masquer le visage. */
.king-badge{position:absolute;right:1px;bottom:1px;width:15px;height:15px;border-radius:50%;background:rgba(15,12,41,0.92);border:1px solid rgba(251,191,36,0.7);color:#fbbf24;font-size:10px;line-height:13px;text-align:center;pointer-events:none;z-index:2}
/* Vue depouillee : la barre de decision et l'aide au geste disparaissent. */
body.chrome-hidden #bot,body.chrome-hidden #hint{display:none!important}
.profile-name{font-family:'Cinzel',serif;font-size:9px;letter-spacing:1.5px;color:rgba(255,255,255,0.45);text-transform:uppercase;transition:color 0.3s;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile.active .profile-name{color:rgba(255,255,255,0.9)}
.top-center{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.timer-urgent .timer-arc{animation:urgentPulse 0.5s infinite alternate}
@keyframes urgentPulse{from{opacity:1}to{opacity:0.4}}

/* BADGE MISE */
.bet-badge{font-size:9px;background:rgba(251,191,36,0.15);border:1px solid rgba(251,191,36,0.4);border-radius:99px;padding:2px 8px;color:#fbbf24;font-weight:600;letter-spacing:0.5px;margin-top:2px}
.spectator-badge{display:none;align-items:center;gap:5px;font-size:9px;background:rgba(56,189,248,0.14);border:1px solid rgba(125,211,252,0.42);border-radius:99px;padding:3px 9px;color:#bae6fd;font-weight:700;letter-spacing:1px;margin-top:2px;text-transform:uppercase}
.spectator-badge.show{display:inline-flex}
.spectator-badge-dot{width:6px;height:6px;border-radius:50%;background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.15);animation:urgentPulse 1s infinite alternate}
body.spectator #force-jump-hint{display:none!important}

.btns{display:flex;gap:7px}
.btn{background:rgba(255,255,255,0.10);color:#fff;border:1px solid rgba(255,255,255,0.28);border-radius:99px;padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.btn:active{background:rgba(255,255,255,0.25);transform:scale(0.95)}
.btn.active-cam{background:rgba(251,191,36,0.25);border-color:rgba(251,191,36,0.7);color:#fbbf24}
.btn-topview{display:flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;border-radius:50%;flex-shrink:0;color:rgba(255,255,255,0.7);transition:all .2s}
.btn-topview.active-top{background:rgba(251,191,36,0.2);border-color:rgba(251,191,36,0.7);color:#fbbf24;box-shadow:0 0 12px rgba(251,191,36,0.3)}
#wrap{flex:1 1 auto;position:relative;overflow:hidden;touch-action:none}

#loading{position:absolute;inset:0;background:linear-gradient(135deg,#1e1b4b 0%,#312e81 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .6s}
.spin{width:52px;height:52px;border:4px solid rgba(255,255,255,.08);border-top-color:#fbbf24;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#loading p{color:rgba(255,255,255,.55);margin-top:16px;font-size:11px;letter-spacing:4px;font-family:'Cinzel',serif;text-align:center;padding:0 16px}

#toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(135deg,rgba(30,27,75,.97),rgba(49,46,129,.97));border:1.5px solid rgba(251,191,36,.6);border-radius:20px;padding:28px 32px;text-align:center;pointer-events:none;z-index:140;display:none;box-shadow:0 15px 50px rgba(0,0,0,.6);min-width:220px}
#toast-emoji{font-size:48px;margin-bottom:10px;display:flex;align-items:center;justify-content:center}
.sym-white-wrap{position:relative;width:72px;height:72px}
.sym-white{width:66px;height:66px;border-radius:50%;background:linear-gradient(135deg,#f5f5f5 0%,#ffffff 50%,#e0e0e0 100%);border:4px solid #c0c0c0;box-shadow:0 4px 20px rgba(255,255,255,0.5),inset 0 4px 8px rgba(255,255,255,0.9);position:absolute;top:3px;left:3px}
.sym-white::after{content:'';position:absolute;top:18%;left:18%;width:35%;height:18%;border-radius:50%;background:rgba(255,255,255,0.95);transform:rotate(-45deg)}
.sym-red-wrap{position:relative;width:72px;height:72px}
.sym-red{width:66px;height:66px;border-radius:50%;background:linear-gradient(135deg,#c0392b 0%,#e74c3c 50%,#a93226 100%);border:4px solid #922b21;box-shadow:0 4px 20px rgba(231,76,60,0.5),inset 0 4px 8px rgba(255,150,150,0.4);position:absolute;top:3px;left:3px}
.sym-red::after{content:'';position:absolute;top:18%;left:18%;width:35%;height:18%;border-radius:50%;background:rgba(255,200,200,0.5);transform:rotate(-45deg)}
#toast-title{font-family:'Cinzel',serif;color:#fbbf24;font-size:22px;font-weight:700;margin-bottom:6px}
#toast-sub{font-size:12px;color:rgba(255,255,255,.6);letter-spacing:1px;white-space:pre-line}

#confetti-canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:55}
#force-jump-hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(220,40,20,0.22);border:1.5px solid rgba(255,90,60,0.8);border-radius:99px;padding:8px 20px;font-size:12px;color:#ff6060;font-weight:700;display:none;z-index:25;backdrop-filter:blur(8px);box-shadow:0 0 18px rgba(255,60,30,0.3)}
#force-jump-hint.show{display:block;animation:pulse-hint 1s infinite}
@keyframes pulse-hint{0%,100%{opacity:0.85;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.05)}}

#reconn-bar{position:absolute;top:0;left:0;right:0;z-index:150;background:rgba(120,20,20,0.92);color:#fff;font-family:'Cinzel',serif;font-size:11px;letter-spacing:1.5px;text-align:center;padding:8px;display:none}
#reconn-bar.show{display:block}
#forfeit-bar{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);background:rgba(30,27,75,0.95);border:1px solid rgba(251,191,36,0.5);border-radius:99px;padding:8px 20px;font-family:'Cinzel',serif;font-size:12px;color:#fbbf24;display:none;z-index:25;backdrop-filter:blur(8px)}
#forfeit-bar.show{display:block}
/* Le compte a rebours du tour ne concerne QUE les deux joueurs : eux seuls
   peuvent agir dessus. Cote spectateur il ne servait a rien et masquait le
   plateau — d'autant que l'anneau du chronometre autour de chaque photo
   donne deja la meme information, sans rien recouvrir. */
body.chrome-hidden #forfeit-bar,body.spectator #forfeit-bar{display:none!important}
#hint{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:10px;color:rgba(255,255,255,.45);white-space:nowrap;pointer-events:none;z-index:5}

#bot{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:rgba(255,255,255,0.08);backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,0.15);z-index:20}
.score-row{display:flex;gap:8px;align-items:center}
.snum{font-family:'Cinzel',serif;font-size:20px;font-weight:700}
.sw{color:#ffffff}.sr{color:#f87171}.ssep{color:rgba(255,255,255,.3);font-size:13px}
.manche-lbl{font-size:9px;color:rgba(255,255,255,.35);letter-spacing:1px}
.captured-row{display:flex;flex-wrap:wrap;align-items:center;gap:2px;justify-content:center;min-height:14px;max-width:80px}
.cap-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.cap-dot-white{background:radial-gradient(circle at 35% 35%,#f0ecdc,#b8b0a0);border:1px solid rgba(255,255,255,0.4)}
.cap-dot-red{background:radial-gradient(circle at 35% 35%,#e04030,#881818);border:1px solid rgba(255,100,80,0.4)}
.cap-count{font-family:'Cinzel',serif;font-size:9px;font-weight:700;color:rgba(255,255,255,0.7);margin-left:2px}
</style>
</head>
<body>
<div id="top">
  <div class="profile" id="profile-human">
    <div class="profile-timer-wrap">
      <svg viewBox="0 0 58 58"><circle class="timer-track" cx="29" cy="29" r="26"/><circle class="timer-arc" id="timer-arc-human" cx="29" cy="29" r="26" stroke="#ffffff"/></svg>
      <div class="profile-avatar" id="avatar-human"><div class="av-white"></div></div>
    </div>
    <div class="profile-name" id="name-human">Vous</div>
    <div class="captured-row" id="cap-human"></div>
  </div>
  <div class="top-center">
    <div class="score-row"><span class="snum sw" id="score-w">20</span><span class="ssep">vs</span><span class="snum sr" id="score-r">20</span></div>
    <span class="manche-lbl">Dames Multijoueur</span>
    <div class="bet-badge" id="betBadge" style="display:none;"></div>
  </div>
  <div class="profile" id="profile-ai">
    <div class="profile-timer-wrap">
      <svg viewBox="0 0 58 58"><circle class="timer-track" cx="29" cy="29" r="26"/><circle class="timer-arc" id="timer-arc-ai" cx="29" cy="29" r="26" stroke="#e74c3c"/></svg>
      <div class="profile-avatar" id="avatar-ai"><div class="av-red"></div></div>
    </div>
    <div class="profile-name" id="name-ai">Adv</div>
    <div class="captured-row" id="cap-ai"></div>
  </div>
</div>

<div id="wrap">
  <div id="loading"><div class="spin"></div><p>CONNEXION AU MATCH...</p></div>
  <canvas id="confetti-canvas"></canvas>
  <div id="reconn-bar">📡 RECONNEXION EN COURS…</div>
  <div id="forfeit-bar"></div>
  <div id="force-jump-hint">⚡ Prise obligatoire !</div>
  <div id="hint">👌 Pince = zoom · Glisse = tourner · Tap = jouer</div>
  <div id="toast"><div id="toast-emoji"></div><div id="toast-title"></div><div id="toast-sub"></div></div>
</div>

<div id="bot">
  <div style="display:flex;gap:7px;flex-shrink:0">
    <button class="btn btn-topview" id="btn-topview" title="Changer vue">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.4" fill="none"/><line x1="7" y1="2" x2="7" y2="16" stroke="currentColor" stroke-width="1.1"/><line x1="11" y1="2" x2="11" y2="16" stroke="currentColor" stroke-width="1.1"/><line x1="2" y1="7" x2="16" y2="7" stroke="currentColor" stroke-width="1.1"/><line x1="2" y1="11" x2="16" y2="11" stroke="currentColor" stroke-width="1.1"/><circle cx="9" cy="9" r="1.5" fill="currentColor"/></svg>
    </button>
  </div>
  <button class="btn btn-lock-center" id="btn-lock" title="Figer le plateau">🔓</button>
  <div class="btns">
    <button class="btn" id="btn-cam">⟳ Auto</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/vendor/three-r128.min.js"></script>
<script>
window.onerror=function(msg,url,line,col,err){
  var ld=document.getElementById('loading');
  if(ld){ld.querySelector('p').textContent='ERREUR JS: '+msg;}
  return false;
};

(function(){
'use strict';

/* ══════════════════════════════════════════
   URL PARAMS & RÉSEAU
══════════════════════════════════════════ */
var P = new URLSearchParams(window.location.search);
var TOKEN_FRAGMENT = new URLSearchParams(window.location.hash.slice(1));
var GAME_AUTH_TOKEN = TOKEN_FRAGMENT.get('token') || P.get('token') || '';
if (TOKEN_FRAGMENT.has('token')) { try { history.replaceState(null, '', location.pathname + location.search); } catch (_) {} }
var IS_SPECTATOR = (P.get('spectate') === '1' || P.get('spectator') === '1');
var P1_AVATAR = P.get('p1Avatar') || '';
var P2_AVATAR = P.get('p2Avatar') || '';
/* Vue depouillee par defaut cote spectateur : l'application la demande par
   ?controls=0 puis, a chaque bascule, par le message spectator:controls. */
var SHOW_CHROME = !(IS_SPECTATOR && (P.get('controls') === '0' || P.get('chrome') === '0'));
var ROOM_ID = P.get('room') || '';
var MY_SLOT = IS_SPECTATOR ? 1 : parseInt(P.get('player') || '1', 10);
var P1_ID = P.get('p1Id') || '';
var P2_ID = P.get('p2Id') || '';
var P1_NAME = P.get('p1Name') || 'Joueur 1';
var P2_NAME = P.get('p2Name') || 'Joueur 2';
var BET_AMOUNT = parseFloat(P.get('bet') || '0');
var CURRENCY = P.get('currency') || 'HTG';
/* Mode spectateur (lecture seule) : activé par ?spectate=1. Le spectateur ne
   rejoint jamais de place de joueur, ne peut jamais jouer et ne fait qu'observer
   le plateau en temps réel. Tout le chemin de code « joueur » reste intact. */

if(!ROOM_ID && P1_ID && P2_ID){
  var _ids = [P1_ID, P2_ID].sort();
  ROOM_ID = 'dames-' + _ids[0].slice(-8) + '-' + _ids[1].slice(-8);
}
if(!ROOM_ID) ROOM_ID = P.get('gameId') || P.get('matchId') || '';
var GAME_ID = P.get('gameId') || P.get('matchId') || '';
var SPECTATOR_TOKEN = '';
var spectatorInitReceived = false;
window.addEventListener('message', function(e){
  if(!e.data || e.source !== window.parent) return;
  if(IS_SPECTATOR && e.data.type === 'spectator:init'){
    if(e.data.gameId && GAME_ID && e.data.gameId !== GAME_ID) return;
    SPECTATOR_TOKEN = typeof e.data.token === 'string' ? e.data.token : '';
    if(typeof e.data.player1Name === 'string' && e.data.player1Name.trim()) P1_NAME = e.data.player1Name.trim().slice(0, 32);
    if(typeof e.data.player2Name === 'string' && e.data.player2Name.trim()) P2_NAME = e.data.player2Name.trim().slice(0, 32);
    if(typeof e.data.player1Avatar === 'string') P1_AVATAR = e.data.player1Avatar;
    if(typeof e.data.player2Avatar === 'string') P2_AVATAR = e.data.player2Avatar;
    if(typeof e.data.showControls === 'boolean') SHOW_CHROME = e.data.showControls;
    MY_NAME = P1_NAME;
    OP_NAME = P2_NAME;
    applyChrome(); updUI();
    spectatorInitReceived = true;
    if(!socket) initSocket();
    return;
  }
  /* Agrandir / reduire ne recharge PAS l'iframe : cela couperait le direct.
     L'application se contente d'annoncer le nouvel etat. */
  if(IS_SPECTATOR && e.data.type === 'spectator:controls'){
    SHOW_CHROME = e.data.show === true;
    applyChrome();
    return;
  }
  if(!IS_SPECTATOR && e.data.type==='client:mutual_quit' && socket && socket.connected){
    socket.emit('game_mutual_quit',{room:ROOM_ID,game:'dames',player:MY_SLOT});
  }
});

var MY_PLAYER = MY_SLOT === 1 ? 0 : 1; // 0=Blanc, 1=Rouge
var MY_SUPABASE_ID = MY_SLOT === 1 ? P1_ID : P2_ID;
var OP_SUPABASE_ID = MY_SLOT === 1 ? P2_ID : P1_ID;
var MY_NAME = MY_SLOT === 1 ? P1_NAME : P2_NAME;
var OP_NAME = MY_SLOT === 1 ? P2_NAME : P1_NAME;

if(IS_SPECTATOR){
  document.body.classList.add('spectator');
  document.getElementById('hint').textContent = 'Glisse = tourner · Pince = zoom';
}

// Affichage de la mise si elle existe
function updateBetBadge(){
  var betBadge = document.getElementById('betBadge');
  if (!betBadge) return;
  if (BET_AMOUNT > 0) {
    betBadge.textContent = 'Mise : ' + BET_AMOUNT + ' ' + CURRENCY;
    betBadge.style.display = 'block';
  } else {
    betBadge.style.display = 'none';
  }
}
updateBetBadge();

// Habillage spectateur : badge « en direct », libellé, et suppression de
// l'astuce « Tap = jouer » (il ne joue pas).
if(IS_SPECTATOR){
  try {
    var mancheLbl = document.querySelector('.manche-lbl');
    if(mancheLbl) mancheLbl.innerHTML = '👁 Spectateur · <span style="color:#f87171">EN DIRECT</span>';
    var hintEl = document.getElementById('hint');
    if(hintEl) hintEl.textContent = '👌 Pince = zoom · Glisse = tourner';
    /* Le nom exact du profil, jamais la couleur du pion : « Blancs » ne dit
       pas qui joue. */
    var nameHuman = document.getElementById('name-human'); if(nameHuman) nameHuman.textContent = P1_NAME;
    var nameAi = document.getElementById('name-ai'); if(nameAi) nameAi.textContent = P2_NAME;
    var loadingP = document.querySelector('#loading p'); if(loadingP) loadingP.textContent = 'CONNEXION AU DIRECT…';
  } catch(e){}
}

var socket = null;
var resultSent = false;
var forfeitTimer = null;
var forfeitCountdown = 0;
var pendingTimerData = null;

/* Re-synchro autoritative : le serveur numérote chaque coup validé (version).
   Si un événement se perd en route, la version révèle le trou et le client
   récupère l'état exact au lieu de rester figé. */
var stateVersion = 0;      // dernière version du plateau confirmée par le serveur
var ackTimer = null;       // coup émis, en attente d'accusé de réception serveur
var syncRequestedAt = 0;   // anti-spam des demandes d'état

var gameOver = false, isProcessing = false, gameReady = false;
var currentPlayer = 0;
var board = [], selectedPiece = null, validMoves = [];
var capturedBy = [0, 0];
var moveSequence = [], isSequenceActive = false;
var currentTurnCaptures = [];
var idleMoves = 0;

var TIMER_DURATION = 30000, CIRC = 2*Math.PI*26;
var timerStart = null, timerRAF = null, timerActive = false;
var graceRAF = null, graceActive = false;

/* ══════════════════════════════════════════
   SOCKET.IO INIT
══════════════════════════════════════════ */
function hideLoading(){
  var ldEl = document.getElementById('loading');
  if(ldEl){ ldEl.style.opacity='0'; setTimeout(function(){ ldEl.style.display='none'; }, 400); }
}

function initSocket(){
  if(socket || (IS_SPECTATOR && !spectatorInitReceived)) return;
  var lt = document.querySelector('#loading p');
  if(lt) lt.textContent = IS_SPECTATOR ? 'CONNEXION AU DIRECT 3D...' : 'ROOM: '+(ROOM_ID||'MANQUANT')+' | SLOT: '+MY_SLOT;

  socket = io({ transports:['websocket','polling'], reconnection:true, auth:{ token:IS_SPECTATOR ? SPECTATOR_TOKEN : GAME_AUTH_TOKEN } });

  socket.on('connect', function(){
    document.getElementById('reconn-bar').classList.remove('show');
    if(IS_SPECTATOR){
      socket.emit('spectator_join', { gameId: GAME_ID });
      return;
    }
    socket.emit('dames_join', {
      room: ROOM_ID, gameId: GAME_ID, player: MY_SLOT, supabaseId: MY_SUPABASE_ID, name: MY_NAME, bet: BET_AMOUNT, currency: CURRENCY
    });
  });

  socket.on('connect_error', function(err){
    var loadingText = document.querySelector('#loading p');
    if(loadingText) loadingText.textContent = 'Connexion refusée par le serveur. Rechargez la page.';
    window.parent.postMessage({
      type: 'game-server:error',
      game: 'dames',
      gameId: GAME_ID,
      message: (err && err.message) || 'Connexion Socket.io refusée.'
    }, '*');
  });

  socket.on('dames_joined', function(data){
    var loadingText = document.querySelector('#loading p');
    if(!loadingText || gameReady) return;
    loadingText.textContent = data && data.waitingForOpponent
      ? "Connexion validée — attente de l'adversaire…"
      : 'Connexion validée — démarrage du plateau…';
  });
  socket.on('disconnect', function(){
    if(!gameOver){
      var bar = document.getElementById('reconn-bar');
      bar.textContent = IS_SPECTATOR ? 'DIRECT INTERROMPU · RECONNEXION...' : 'RECONNEXION EN COURS...';
      bar.classList.add('show');
      if(IS_SPECTATOR) window.parent.postMessage({ type:'spectator:reconnecting', game:'dames', gameId:GAME_ID }, '*');
    }
  });

  socket.on('spectator:joined', function(data){
    spectRetryTries = 0;
    if(spectRetryTimer){ clearTimeout(spectRetryTimer); spectRetryTimer = null; }
    if(!IS_SPECTATOR) return;
    ROOM_ID = data && data.room ? data.room : ROOM_ID;
    var loadingText = document.querySelector('#loading p');
    if(loadingText) loadingText.textContent = 'DIRECT VALIDÉ · CHARGEMENT DU PLATEAU...';
    window.parent.postMessage({ type:'spectator:connected', game:'dames', gameId:GAME_ID }, '*');
  });

  socket.on('spectator_count', function(data){
    if(!IS_SPECTATOR) return;
    window.parent.postMessage({
      type:'spectator:count',
      game:'dames',
      gameId:GAME_ID,
      count:Math.max(0, Number(data && data.count) || 0)
    }, '*');
  });

  /* Un direct qui n'a pas encore commence n'est pas un direct mort.
     Un match de tournoi nait dans la base de donnees ; la salle de ce serveur
     n'apparait qu'une fois les deux joueurs entres sur le plateau. Le
     spectateur arrive donc souvent avant elle. On patiente, on redemande, et
     le plateau s'ouvre tout seul le moment venu. */
  var SPECT_RETRY_MAX_DELAY = 6000;
  var SPECT_RETRY_MAX_TRIES = 10;
  var spectRetryTimer = null;
  var spectRetryTries = 0;
  function spectatorRetryable(code){
    /* « room_not_live » : les joueurs ne sont pas encore la. On attend
       indefiniment — c'est exactement le cas d'un match de tournoi.
       Les deux autres sont des accidents passagers : on borne les essais. */
    if(code === 'room_not_live') return true;
    if(code === 'verification_failed' || code === 'not_live') return spectRetryTries < SPECT_RETRY_MAX_TRIES;
    return false;
  }
  function scheduleSpectatorRejoin(){
    if(spectRetryTimer) return;
    spectRetryTries++;
    var delay = Math.min(SPECT_RETRY_MAX_DELAY, 1200 * spectRetryTries);
    spectRetryTimer = setTimeout(function(){
      spectRetryTimer = null;
      if(socket && socket.connected) socket.emit('spectator_join', { gameId: GAME_ID });
    }, delay);
  }

  socket.on('spectator:error', function(data){
    if(!IS_SPECTATOR) return;
    var code = (data && data.code) || '';
    var retrying = spectatorRetryable(code);
    var message = (data && data.message) || 'Ce direct n\u2019est plus disponible.';
    if(retrying){
      message = code === 'room_not_live'
        ? 'En attente des joueurs sur le plateau\u2026'
        : 'Reconnexion au direct\u2026';
      scheduleSpectatorRejoin();
    }
    var loadingText = document.querySelector('#loading p'); if(loadingText) loadingText.textContent = message;
    try { window.parent.postMessage({ type:'spectator:error', game:'dames', gameId:GAME_ID, code:code, retrying:retrying, message:message }, '*'); } catch(_){}
  });

  socket.on('spectator_state', function(snapshot){
    if(!IS_SPECTATOR || !snapshot || snapshot.gameType !== 'checkers' || !snapshot.state) return;
    ROOM_ID = snapshot.room || ROOM_ID;
    if(snapshot.players){
      if(snapshot.players[1] && snapshot.players[1].name) P1_NAME = snapshot.players[1].name;
      if(snapshot.players[2] && snapshot.players[2].name) P2_NAME = snapshot.players[2].name;
      MY_NAME = P1_NAME;
      OP_NAME = P2_NAME;
    }
    BET_AMOUNT = Number(snapshot.betAmount || 0);
    CURRENCY = snapshot.currency || 'HTG';
    updateBetBadge();
    startSpectatorGame(snapshot.state);
  });

  socket.on('dames_start', function(data){
    hideLoading();
    if(data.reconnected && data.boardState){
      /* Avant, une reconnexion rapide en pleine partie ne restaurait PAS le
         plateau : un coup raté pendant la coupure restait perdu et le jeu
         gelait. Désormais on ne saute la restauration que si le serveur
         confirme (même version d'état) qu'aucun coup n'a été manqué. */
      var nothingMissed = gameReady && !data.paused &&
        typeof data.stateVersion === 'number' && data.stateVersion === stateVersion;
      if(nothingMissed){
        gameOver = false; isProcessing = false; stopForfeitCountdown();
        showToast('📶','Connexion rétablie','La partie reprend !', 2000, updUI);
        return;
      }
      gameOver = false; isProcessing = false; resultSent = false;
      moveSequence = []; isSequenceActive = false; stopForfeitCountdown();
      if(ackTimer){ clearTimeout(ackTimer); ackTimer = null; }
      try {
        board = JSON.parse(data.boardState);
        currentPlayer = data.currentPlayer !== undefined ? data.currentPlayer : 0;
        stateVersion = typeof data.stateVersion === 'number' ? data.stateVersion : 0;
        
        // CORRECTION CAMÉRA: 0 pour Blanc (regarde depuis le bas), Math.PI pour Rouge
        camTheta = MY_PLAYER === 0 ? 0 : Math.PI; 
        camPhi = 0.72; fitBoardToScreen(true);
        
        var wc=0, rc=0;
        for(var r=0;r<BS;r++) for(var c=0;c<BS;c++) if(board[r][c]){ if(board[r][c].player===0) wc++; else rc++; }
        capturedBy = [Math.max(0, 20-rc), Math.max(0, 20-wc)];
        document.getElementById('score-w').textContent = wc; document.getElementById('score-r').textContent = rc;
        
        syncPieces(); clearHighlights(); clearLastMove(); stopTimer(); stopGraceTimer();
        updateCapturedDisplay();
        if(data.lastMove && data.lastMove.from) showLastMoveOrigin(data.lastMove.from.row, data.lastMove.from.col);
        showToast('📶','Partie restaurée','Reprise là où vous étiez !', 2400, function(){
          gameReady = true; updUI(); applyPendingTimer();
        });
      } catch(e) { startMultiGame(); }
    } else if(data.reconnected && gameReady && !data.paused){
      gameOver = false; isProcessing = false; stopForfeitCountdown();
      showToast('📶','Connexion rétablie','La partie reprend !', 2000, updUI);
    } else {
      startMultiGame();
    }
  });

  socket.on('dames_turn_start', function(data){
    if(gameOver) return;
    pendingTimerData = {type:'turn_start', player:data.player, startTime:data.startTime};
    if(!gameReady) return;
    stopGraceTimer();
    var isMyTurn = (data.player === MY_SLOT);
    startTimer(isMyTurn, data.startTime);
  });

  socket.on('dames_turn_warning', function(data){
    if(gameOver) return;
    var isMyTurn = (data.player === MY_SLOT);
    startGraceTimer(isMyTurn, data.startTime, data.duration);
  });

  socket.on('dames_turn_sync', function(data){
    if(gameOver) return;
    pendingTimerData = {type:'sync', serverTime:data.serverTime, turnPlayer:data.turnPlayer, graceStartTime:data.graceStartTime, turnStartTime:data.turnStartTime};
    if(!gameReady) return;
    var offset = Date.now() - data.serverTime;
    var isMyTurn = (data.turnPlayer === MY_SLOT);
    if(data.graceStartTime) startGraceTimer(isMyTurn, data.graceStartTime+offset, 60000);
    else if(data.turnStartTime) startTimer(isMyTurn, data.turnStartTime+offset);
  });

  socket.on('dames_move', function(data){
    if(!IS_SPECTATOR && data.player === MY_SLOT) return;
    if(typeof data.version === 'number'){
      if(data.version <= stateVersion) return;                            // doublon / déjà appliqué
      if(data.version > stateVersion + 1){ requestStateSync(); return; }  // coup manqué : resynchro
      stateVersion = data.version;
    }
    if(data.steps && data.steps.length > 0){
      executeRemoteSequence(data.steps, data.isComplete, data.nextPlayer);
    }
  });

  socket.on('dames_move_ack', function(data){
    if(!data || data.room !== ROOM_ID) return;
    if(ackTimer){ clearTimeout(ackTimer); ackTimer = null; }
    if(typeof data.version === 'number' && data.version > stateVersion) stateVersion = data.version;
  });

  /* Filet de sécurité : le serveur renvoie l'état exact toutes les quelques
     secondes (et sur demande). Si le plateau local a divergé — coup perdu en
     route, événement raté — on se recale dessus au lieu de rester figé. */
  socket.on('dames_state_sync', function(data){
    if(gameOver || !gameReady || !data || data.room !== ROOM_ID) return;
    if(isProcessing || isSequenceActive || ackTimer) return; // animation ou coup en vol : on laisse finir
    var serverBoard;
    try { serverBoard = JSON.parse(data.boardState); } catch(e){ return; }
    if(!serverBoard || serverBoard.length !== BS) return;
    var sameVersion = typeof data.version !== 'number' || data.version === stateVersion;
    if(sameVersion && !boardsDiffer(serverBoard) && currentPlayer === data.currentPlayer){
      // Tout est en phase : on ne recale que le chrono s'il s'est éteint.
      if(!timerActive && !graceActive && data.turnPlayer && data.status === 'playing') applySyncTimers(data);
      return;
    }
    adoptServerState(serverBoard, data);
  });

  socket.on('game:error', function(data){
    if(gameOver) return;
    if(!gameReady){
      var loadingText = document.querySelector('#loading p');
      var message = data && data.message ? data.message : 'La partie a été refusée par le serveur.';
      if(loadingText) loadingText.textContent = message;
      window.parent.postMessage({ type:'game-server:error', game:'dames', gameId:GAME_ID, message:message }, '*');
      return;
    }
    // Coup refusé (ou autre erreur) : l'accusé n'arrivera jamais. On récupère
    // l'état autoritatif immédiatement pour annuler la divergence locale.
    if(ackTimer){ clearTimeout(ackTimer); ackTimer = null; }
    requestStateSync();
  });

  socket.on('game:reconnect_deadline', function(data){
    if(gameOver || !data || !data.reconnectDeadline || !data.serverTime) return;
    startForfeitCountdown(Math.max(0, Math.ceil((data.reconnectDeadline - data.serverTime) / 1000)));
  });

  socket.on('dames_opponent_disconnected', function(){
    if(gameOver) return; startForfeitCountdown(60);
  });

  socket.on('dames_player_status', function(data){
    if(data.slot === MY_SLOT) return;
    document.getElementById('profile-ai').style.opacity = data.connected ? '1' : '0.45';
  });

  socket.on('game:over', function(d){
    if(gameOver) return; hideLoading(); stopForfeitCountdown();
    if(IS_SPECTATOR){
      var spectatorWinner = d && d.winnerSlot === 1 ? 0 : (d && d.winnerSlot === 2 ? 1 : -1);
      handleSpectatorGameEnd(spectatorWinner, (d && d.reason) || 'normal');
      return;
    }
    if(d.result === 'cancel'){
      gameOver=true; stopTimer(); stopGraceTimer();
      showToast('⚠️','Partie annulée','Déconnexion.\nPénalité appliquée.', 4000, function(){ sendResult('cancel', 'both_disconnected'); });
      return;
    }
    var iWon = d.winnerSupabaseId === MY_SUPABASE_ID || (d.winnerSlot && d.winnerSlot === MY_SLOT) || (d.winner === 'player1' && MY_SLOT === 1) || (d.winner === 'player2' && MY_SLOT === 2);
    handleGameEnd(iWon ? MY_PLAYER : 1-MY_PLAYER, 'forfeit');
  });

  socket.on('game:result', function(d){
    if(d.postMessage && !gameOver){
      hideLoading();
      if(IS_SPECTATOR){
        var spectatorWinner = d.postMessage.winnerSlot === 1 ? 0 : (d.postMessage.winnerSlot === 2 ? 1 : -1);
        handleSpectatorGameEnd(spectatorWinner, d.postMessage.reason || 'normal');
        return;
      }
      var iWon = d.postMessage.result === 'win';
      handleGameEnd(iWon ? MY_PLAYER : 1-MY_PLAYER, 'forfeit');
    }
  });
}

function applyPendingTimer(){
  if(!pendingTimerData) return;
  var d = pendingTimerData; pendingTimerData = null;
  if(d.type === 'turn_start'){
    stopGraceTimer(); var isMyTurn = (d.player === MY_SLOT); startTimer(isMyTurn, d.startTime);
  } else if(d.type === 'sync'){
    var offset = Date.now() - d.serverTime;
    var isMyTurn = (d.turnPlayer === MY_SLOT);
    if(d.graceStartTime) startGraceTimer(isMyTurn, d.graceStartTime+offset, 60000);
    else if(d.turnStartTime) startTimer(isMyTurn, d.turnStartTime+offset);
  }
}

/* ══════════════════════════════════════════
   RE-SYNCHRO AUTORITATIVE (anti-gel)
══════════════════════════════════════════ */
function boardsDiffer(serverBoard){
  for(var r=0; r<BS; r++) for(var c=0; c<BS; c++){
    var s = serverBoard[r] ? serverBoard[r][c] : null;
    var l = board[r] ? board[r][c] : null;
    if(!s !== !l) return true;
    if(s && l && (s.player !== l.player || !!s.king !== !!l.king)) return true;
  }
  return false;
}

function applySyncTimers(data){
  var offset = Date.now() - (data.serverTime || Date.now());
  var isMyTurn = (data.turnPlayer === MY_SLOT);
  if(data.graceStartTime) startGraceTimer(isMyTurn, data.graceStartTime + offset, data.graceDuration || 60000);
  else if(data.turnStartTime) startTimer(isMyTurn, data.turnStartTime + offset);
}

/* Adopte l'état exact du serveur : plateau, tour, scores, chrono. C'est ce qui
   « décoince » une partie dont un coup s'est perdu en route. */
function adoptServerState(serverBoard, data){
  board = serverBoard;
  if(typeof data.version === 'number') stateVersion = data.version;
  if(data.currentPlayer !== undefined && data.currentPlayer !== null) currentPlayer = data.currentPlayer;
  selectedPiece = null; validMoves = []; moveSequence = [];
  isSequenceActive = false; currentTurnCaptures = []; isProcessing = false;
  pendingTimerData = null;
  var wc = 0, rc = 0;
  for(var r=0; r<BS; r++) for(var c=0; c<BS; c++) if(board[r][c]){ if(board[r][c].player === 0) wc++; else rc++; }
  capturedBy = [Math.max(0, 20-rc), Math.max(0, 20-wc)];
  document.getElementById('score-w').textContent = wc;
  document.getElementById('score-r').textContent = rc;
  syncPieces(); clearHighlights(); clearLastMove(); updateCapturedDisplay();
  if(data.lastMove && data.lastMove.from) showLastMoveOrigin(data.lastMove.from.row, data.lastMove.from.col);
  stopTimer(); stopGraceTimer();
  if(data.turnPlayer && data.status === 'playing') applySyncTimers(data);
  updUI();
  if(!IS_SPECTATOR) showToast('🔄','Resynchronisé','Le plateau a été recalé sur le serveur.', 1600, null);
}

function requestStateSync(){
  if(gameOver || !socket) return;
  var now = Date.now();
  if(now - syncRequestedAt < 1500) return;
  syncRequestedAt = now;
  if(IS_SPECTATOR) socket.emit('spectator_request_state', { gameId: GAME_ID });
  else socket.emit('dames_request_state', { room: ROOM_ID });
}

function startForfeitCountdown(seconds){
  stopForfeitCountdown(); forfeitCountdown = seconds;
  var bar = document.getElementById('forfeit-bar'); bar.classList.add('show');
  function tick(){
    bar.textContent = '⏳ Adversaire absent — victoire dans ' + forfeitCountdown + 's';
    if(forfeitCountdown <= 0){ stopForfeitCountdown(); return; }
    forfeitCountdown--; forfeitTimer = setTimeout(tick, 1000);
  }
  tick();
}
function stopForfeitCountdown(){
  if(forfeitTimer){ clearTimeout(forfeitTimer); forfeitTimer = null; }
  var bar = document.getElementById('forfeit-bar'); if(bar) bar.classList.remove('show');
  forfeitCountdown = 0;
}

function sendResult(outcome, reason){
  if(IS_SPECTATOR) return;
  if(resultSent) return; resultSent = true;
  var winnerId = outcome === 'win' ? MY_SUPABASE_ID : OP_SUPABASE_ID;
  var loserId  = outcome === 'win' ? OP_SUPABASE_ID : MY_SUPABASE_ID;
  var msg = { type:'game_result', game:'dames', room:ROOM_ID, winner:winnerId, loser:loserId, bet:BET_AMOUNT, currency:CURRENCY, reason:reason||'normal', p1Id:P1_ID, p2Id:P2_ID };
  // Wallet settlement is emitted by the authoritative server, never by this iframe.
  if(socket && socket.connected) socket.emit('dames_result', msg);
}

/* ══════════════════════════════════════════
   GESTION DES TIMERS (UI)
══════════════════════════════════════════ */
function startTimer(isMyTurn, serverStartTime) {
  stopGraceTimer(); stopTimer();
  if(gameOver) return;
  timerActive = true;
  timerStart = serverStartTime || Date.now();
  var arcId = isMyTurn ? 'timer-arc-human' : 'timer-arc-ai';
  var profId = isMyTurn ? 'profile-human' : 'profile-ai';
  var arc = document.getElementById(arcId);
  var prof = document.getElementById(profId);
  
  prof.classList.add('active', isMyTurn ? 'human-active' : 'ai-active');
  
  function tick(){
    if(!timerActive) return;
    var progress = Math.min((Date.now() - timerStart) / TIMER_DURATION, 1);
    arc.style.strokeDashoffset = CIRC * progress;
    if(progress >= 0.67) prof.classList.add('timer-urgent');
    if(progress < 1) { timerRAF = requestAnimationFrame(tick); }
    else { timerActive = false; }
  }
  timerRAF = requestAnimationFrame(tick);
}

function startGraceTimer(isMyTurn, serverStartTime, duration){
  stopTimer(); stopGraceTimer();
  if(gameOver) return;
  graceActive = true;
  var graceStart = serverStartTime || Date.now(), graceDuration = duration || 60000;
  var bar = document.getElementById('forfeit-bar');
  var arcId = isMyTurn ? 'timer-arc-human' : 'timer-arc-ai';
  var profId = isMyTurn ? 'profile-human' : 'profile-ai';
  
  document.getElementById(profId).classList.add('active', isMyTurn ? 'human-active' : 'ai-active', 'timer-urgent');
  
  function tick(){
    if(!graceActive) return;
    var elapsed = Date.now() - graceStart;
    var remaining = Math.max(0, graceDuration - elapsed);
    document.getElementById(arcId).style.strokeDashoffset = CIRC * ((graceDuration - remaining) / graceDuration);
    var secs = Math.ceil(remaining / 1000);
    
    bar.classList.add('show');
    bar.textContent = isMyTurn ? '⚠️ Jouez maintenant — ' + secs + 's avant défaite !' : '⏳ Adversaire doit jouer — ' + secs + 's';
    
    if(remaining > 0) graceRAF = requestAnimationFrame(tick);
    else { graceActive = false; bar.classList.remove('show'); }
  }
  graceRAF = requestAnimationFrame(tick);
}

function stopTimer(){
  timerActive = false; if(timerRAF) cancelAnimationFrame(timerRAF);
  document.getElementById('timer-arc-human').style.strokeDashoffset = CIRC;
  document.getElementById('timer-arc-ai').style.strokeDashoffset = CIRC;
  document.getElementById('profile-human').className = 'profile';
  document.getElementById('profile-ai').className = 'profile';
}
function stopGraceTimer(){
  graceActive = false; if(graceRAF) cancelAnimationFrame(graceRAF);
  var bar = document.getElementById('forfeit-bar'); if(bar) bar.classList.remove('show');
}

/* ══════════════════════════════════════════
   THREE.JS & RENDU
══════════════════════════════════════════ */
var wrap = document.getElementById('wrap');
var scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x1e1b4b, 22, 70);

// CORRECTION CAMÉRA: 0 pour Blanc (regarde depuis le bas), Math.PI pour Rouge
var camD = 22, camPhi = 0.72, camTheta = MY_PLAYER === 0 ? 0 : Math.PI; 
var autoRotate = false;
var camera = new THREE.PerspectiveCamera(42, 1, 0.1, 1000);

function setCam(){
  camera.position.set(camD*Math.sin(camPhi)*Math.sin(camTheta), camD*Math.cos(camPhi), camD*Math.sin(camPhi)*Math.cos(camTheta));
  camera.lookAt(0,0,0);
}
setCam();

var renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
wrap.appendChild(renderer.domElement);

function resize(){
  var w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h); camera.aspect = w/h; camera.updateProjectionMatrix();
  var cc = document.getElementById('confetti-canvas'); if(cc){ cc.width = w; cc.height = h; }
}

/* ══════════════════════════════════════════
   CADRAGE AUTOMATIQUE DU PLATEAU
   ══════════════════════════════════════════
   La distance de la camera etait une constante. Elle ne pouvait donc convenir
   qu'a un seul format d'ecran. Sur un telephone etroit, le champ de vision
   horizontal est bien plus ferme que le vertical : le plateau sortait des deux
   cotes, et le joueur devait pincer pour reculer avant meme de pouvoir jouer.

   On cherche ici, par dichotomie, la plus petite distance a laquelle les huit
   coins du plateau se projettent tous dans le cadre. C'est exact quel que soit
   le format, quel que soit l'angle de vue, et cela reste vrai pendant la
   rotation — puisque le calcul porte sur les coins, pas sur une estimation. */
var fitD = camD;
var userZoomed = false;   /* le pincement du joueur prime sur le recadrage */

function boardFitRadius(){
    /* BO est le demi-ecart entre centres de cases ; on ajoute une demi-case
     puis l'epaisseur du cadre en bois. */
  if(typeof BO !== 'number' || typeof CELL !== 'number') return 0;
  return BO + CELL * 0.5 + 0.45;
}

function fitDistanceFor(phi, theta){
  var R = boardFitRadius();
  if(!R || !camera) return camD;
  var saveD = camD, savePhi = camPhi, saveTheta = camTheta;
  var corners = [];
  for(var sx = -1; sx <= 1; sx += 2)
    for(var sz = -1; sz <= 1; sz += 2)
      for(var sy = 0; sy <= 1; sy++)
        corners.push(new THREE.Vector3(sx * R, sy * 1.1, sz * R));
  var lo = 4, hi = 200;
  for(var i = 0; i < 26; i++){
    var mid = (lo + hi) / 2;
    camD = mid; camPhi = phi; camTheta = theta; setCam();
    camera.updateMatrixWorld(true);
    var fits = true;
    for(var k = 0; k < corners.length; k++){
      var p = corners[k].clone().project(camera);
      /* 0.94 : une marge, pour que le cadre du plateau ne colle pas au bord. */
      if(Math.abs(p.x) > 0.94 || Math.abs(p.y) > 0.94){ fits = false; break; }
    }
    if(fits) hi = mid; else lo = mid;
  }
  camD = saveD; camPhi = savePhi; camTheta = saveTheta; setCam();
  return hi;
}

function fitBoardToScreen(force){
  if(userZoomed && !force) return;
  if(force) userZoomed = false;
  fitD = fitDistanceFor(camPhi, camTheta);
  camD = fitD;
  setCam();
}

resize(); window.addEventListener('resize', resize);
window.addEventListener('resize', function(){ fitBoardToScreen(false); });
/* Trois passes : au chargement, une fois la mise en page stabilisee, puis
   apres l'apparition de la barre d'adresse sur telephone. */
setTimeout(function(){ fitBoardToScreen(true); }, 0);
setTimeout(function(){ fitBoardToScreen(true); }, 300);
setTimeout(function(){ fitBoardToScreen(true); }, 1200);

scene.add(new THREE.AmbientLight(0xffffff, 0.45));
var keyL = new THREE.DirectionalLight(0xfff8f0, 0.90);
keyL.position.set(6, 18, 12); keyL.castShadow = true;
keyL.shadow.mapSize.width = 1024; keyL.shadow.mapSize.height = 1024;
keyL.shadow.camera.near = 0.5; keyL.shadow.camera.far = 45;
keyL.shadow.camera.left = -13; keyL.shadow.camera.right = 13;
keyL.shadow.camera.top = 13; keyL.shadow.camera.bottom = -13;

var shake = {active:false, t0:0, dur:2000, aX:0.20, aZ:0.15, fX:12, fZ:9, aP:0.12, fP:16};

function applyShake(){
  var groups = [boardGroup, piecesGroup, hlGroup, moveHlGroup, lastMoveGroup];
  if(!shake.active){ for(var i=0; i<groups.length; i++){ groups[i].rotation.x=0; groups[i].rotation.z=0; groups[i].position.x=0; } return; }
  var el = (Date.now()-shake.t0)/1000, t = el/(shake.dur/1000);
  if(t>=1){ shake.active=false; return; }
  var d = Math.pow(1-t, 2.2);
  var rx = Math.sin(el*shake.fX)*shake.aX*d, rz = Math.sin(el*shake.fZ+1.1)*shake.aZ*d, px = Math.sin(el*shake.fP+0.5)*shake.aP*d;
  for(var i=0; i<groups.length; i++){ groups[i].rotation.x=rx; groups[i].rotation.z=rz; groups[i].position.x=px; }
}

function animPop(mesh){
  var t0 = Date.now(), DUR = 620;
  function eoe(t){ if(t===0||t===1) return t; var p = 0.38, s = p/(2*Math.PI)*Math.asin(1); return Math.pow(2,-10*t)*Math.sin((t-s)*(2*Math.PI)/p)+1; }
  function loop(){ var p = Math.min((Date.now()-t0)/DUR, 1); var sv = Math.max(0, eoe(p)); mesh.scale.set(sv, sv, sv); if(p<1) requestAnimationFrame(loop); else mesh.scale.set(1,1,1); }
  loop();
}
function animCapture(mesh, onComplete){
  var t0 = Date.now(); createExplosion(mesh.position.x, mesh.position.y, mesh.position.z, mesh.userData.player===0?0xf8f6f0:0xd63020, 22);

}

/* ══════════════════════════════════════════
   LOGIQUE DES DÉPLACEMENTS (RAFLE & PRISE MAJORITAIRE)
══════════════════════════════════════════ */
var ALL_DIRS = [[-1,-1], [-1,1], [1,-1], [1,1]];

function getJumpsFrom(row, col, player, isKing, capturedSoFar, startingPiecePos){
  var jumps = [];
  if(isKing){
    for(var d=0; d<ALL_DIRS.length; d++){
      var dr = ALL_DIRS[d][0], dc = ALL_DIRS[d][1], foundEnemy = false, eR = -1, eC = -1;
      for(var dist=1; dist<BS; dist++){
        var nr = row+dr*dist, nc = col+dc*dist;
        if(nr<0 || nr>=BS || nc<0 || nc>=BS) break;
        var isStartingSquare = (startingPiecePos && nr === startingPiecePos.row && nc === startingPiecePos.col);

        if(!board[nr][nc] || isStartingSquare){
          if(foundEnemy){
            var already = false; for(var i=0; i<capturedSoFar.length; i++) if(capturedSoFar[i].row===eR && capturedSoFar[i].col===eC){ already=true; break; }
            if(!already){ var nc2 = capturedSoFar.slice(); nc2.push({row:eR, col:eC}); jumps.push({row:nr, col:nc, captures:nc2}); }
          }
        }
        else if(board[nr][nc].player !== player && !board[nr][nc].dying && !foundEnemy){ 
          var already2 = false; for(var i=0; i<capturedSoFar.length; i++) if(capturedSoFar[i].row===nr && capturedSoFar[i].col===nc) already2=true;
          if(!already2){ foundEnemy = true; eR = nr; eC = nc; }
          else break;
        }
        else break;
      }
    }
  } else {
    for(var d=0; d<ALL_DIRS.length; d++){
      var dr = ALL_DIRS[d][0], dc = ALL_DIRS[d][1], mr = row+dr, mc = col+dc, jr = row+2*dr, jc = col+2*dc;
      var isStartingSquare = (startingPiecePos && jr === startingPiecePos.row && jc === startingPiecePos.col);

      if(jr>=0 && jr<BS && jc>=0 && jc<BS && board[mr] && board[mr][mc] && board[mr][mc].player !== player && !board[mr][mc].dying && (!board[jr][jc] || isStartingSquare)){
        var already = false; for(var i=0; i<capturedSoFar.length; i++) if(capturedSoFar[i].row===mr && capturedSoFar[i].col===mc){ already=true; break; }
        if(!already){ var nc2 = capturedSoFar.slice(); nc2.push({row:mr, col:mc}); jumps.push({row:jr, col:jc, captures:nc2}); }
      }
    }
  }
  return jumps;
}

function getMaxJumpDepth(row, col, player, isKing, capturedSoFar, startPiece) {
    var jumps = getJumpsFrom(row, col, player, isKing, capturedSoFar, startPiece);
    if(jumps.length === 0) return capturedSoFar.length;
    var maxD = 0;
    for(var i=0; i<jumps.length; i++){
        var d = getMaxJumpDepth(jumps[i].row, jumps[i].col, player, isKing, jumps[i].captures, startPiece);
        if(d > maxD) maxD = d;
    }
    return maxD;
}

function getAllValidMoves(player){
  var allMoves = [], hasJump = false, maxTotalCaptures = 0;
  
  for(var r=0; r<BS; r++){
    for(var c=0; c<BS; c++){
      if(board[r][c] && board[r][c].player === player){
        var jumps = getJumpsFrom(r, c, player, board[r][c].king, [], {row:r, col:c});
        if(jumps.length > 0){
          hasJump = true;
          for(var j=0; j<jumps.length; j++){
            var depth = getMaxJumpDepth(jumps[j].row, jumps[j].col, player, board[r][c].king, jumps[j].captures, {row:r, col:c});
            jumps[j].totalCaptures = depth;
            allMoves.push({from:{row:r, col:c}, to:jumps[j]});
            if(depth > maxTotalCaptures) maxTotalCaptures = depth;
          }
        }
      }
    }
  }
  
  if(hasJump){
    allMoves = allMoves.filter(m => m.to.totalCaptures === maxTotalCaptures);
    return {moves:allMoves, forced:true};
  }
  
  for(var r=0; r<BS; r++){
    for(var c=0; c<BS; c++){
      if(board[r][c] && board[r][c].player === player){
        var fwdDirs = player===0 ? [[-1,-1], [-1,1]] : [[1,-1], [1,1]];
        if(board[r][c].king) fwdDirs = ALL_DIRS;

        for(var d=0; d<fwdDirs.length; d++){
            if(board[r][c].king){
                for(var dist=1; dist<BS; dist++){
                    var nr = r+fwdDirs[d][0]*dist, nc = c+fwdDirs[d][1]*dist;
                    if(nr<0 || nr>=BS || nc<0 || nc>=BS) break;
                    if(!board[nr][nc]) allMoves.push({from:{row:r, col:c}, to:{row:nr, col:nc, captures:[]}});
                    else break;
                }
            } else {
                var nr = r+fwdDirs[d][0], nc = c+fwdDirs[d][1];
                if(nr>=0 && nr<BS && nc>=0 && nc<BS && !board[nr][nc]) allMoves.push({from:{row:r, col:c}, to:{row:nr, col:nc, captures:[]}});
            }
        }
      }
    }
  }
  return {moves:allMoves, forced:false};
}

function checkGameOver(){
  var wc=0, rc=0;
  for(var r=0; r<BS; r++) for(var c=0; c<BS; c++) if(board[r][c]){ if(board[r][c].player===0) wc++; else rc++; }
  document.getElementById('score-w').textContent=wc; document.getElementById('score-r').textContent=rc;
  if(wc===0) return 1; if(rc===0) return 0;
  if(getAllValidMoves(0).moves.length===0) return 1; if(getAllValidMoves(1).moves.length===0) return 0;
  return -1;
}

function updateForcedHint(){
  var hint = document.getElementById('force-jump-hint');
  /* updUI() peut etre appele avant initBoard() — des la reception du jeton
     spectateur, pour peindre les portraits sans attendre le premier coup.
     Sans ce garde-fou, le parcours du plateau vide leve une exception. */
  if(!board || !board.length){ if(hint) hint.classList.remove('show'); return; }
  var result = getAllValidMoves(currentPlayer);
  if(result.forced){ 
      hint.classList.add('show'); 
      hint.textContent = currentPlayer === MY_PLAYER ? '⚡ Prise obligatoire !' : '⚡ L\'adversaire doit prendre !'; 
      
      if(currentPlayer === MY_PLAYER && !isSequenceActive) {
          clearHighlights();
          validMoves = result.moves; 
          selectedPiece = null; 
          
          for(let i=0; i<result.moves.length; i++) {
             let mv = result.moves[i];
             let m = new THREE.Mesh(new THREE.CircleGeometry(0.44, 32), new THREE.MeshBasicMaterial({color:0xff2200, transparent:true, opacity:0.80, side:THREE.DoubleSide}));
             m.rotation.x = -Math.PI/2; m.position.set(mv.to.col*CELL-BO, 0.22, mv.to.row*CELL-BO); moveHlGroup.add(m);
             let ring = new THREE.Mesh(new THREE.RingGeometry(0.46, 0.55, 32), new THREE.MeshBasicMaterial({color:0xff4400, transparent:true, opacity:0.60, side:THREE.DoubleSide})); 
             ring.rotation.x = -Math.PI/2; ring.position.set(mv.to.col*CELL-BO, 0.23, mv.to.row*CELL-BO); moveHlGroup.add(ring);
             let p = new THREE.Mesh(new THREE.CircleGeometry(0.64, 32), new THREE.MeshBasicMaterial({color:0xffaa00, transparent:true, opacity:0.40, side:THREE.DoubleSide}));
             p.rotation.x = -Math.PI/2; p.position.set(mv.from.col*CELL-BO, 0.16, mv.from.row*CELL-BO); hlGroup.add(p);
          }
      }
  }
  else hint.classList.remove('show');
  return result;
}

function onCellClick(row, col){
  if(IS_SPECTATOR) return;
  if(!gameReady || gameOver || isProcessing) return;
  if(currentPlayer !== MY_PLAYER) return;

  var result = getAllValidMoves(currentPlayer);

  if(isSequenceActive && selectedPiece){
    var continuations = getJumpsFrom(selectedPiece.row, selectedPiece.col, currentPlayer, board[selectedPiece.row][selectedPiece.col].king, currentTurnCaptures, moveSequence[0].from);
    if(continuations.length > 0) {
       let maxDepth = 0;
       for(let i=0; i<continuations.length; i++) {
           let d = getMaxJumpDepth(continuations[i].row, continuations[i].col, currentPlayer, board[selectedPiece.row][selectedPiece.col].king, continuations[i].captures, moveSequence[0].from);
           continuations[i].totalCaptures = d;
           if(d > maxDepth) maxDepth = d;
       }
       continuations = continuations.filter(c => c.totalCaptures === maxDepth);
    }
    var validCont = continuations.find(c => c.row === row && c.col === col);
    if(validCont){ executePlayerStep(selectedPiece, validCont); return; }
    return; 
  }

  if(!selectedPiece && result.forced) {
      var matchedMove = validMoves.find(m => m.to.row === row && m.to.col === col);
      if(matchedMove) { executePlayerStep(matchedMove.from, matchedMove.to); return; }
  }

  if(selectedPiece){
      var matchedMove = validMoves.find(m => m.to.row === row && m.to.col === col);
      if(matchedMove){ executePlayerStep(selectedPiece, matchedMove.to); return; }
  }

  if(board[row][col] && board[row][col].player === currentPlayer){
    var movesForPiece = result.moves.filter(m => m.from.row === row && m.from.col === col);
    if(result.forced && movesForPiece.length===0) return; 
    if(movesForPiece.length===0){ selectedPiece = null; if(result.forced) updateForcedHint(); else clearHighlights(); return; }
    
    clearHighlights();
    selectedPiece = {row:row, col:col}; 
    validMoves = movesForPiece; 
    showSelection(row,col); 
    showValidMoves(movesForPiece.map(m => m.to));
    return;
  }

  selectedPiece = null;
  if(result.forced) updateForcedHint(); 
  else clearHighlights();
}

function executePlayerStep(from, to){
  isProcessing = true;
  moveSequence.push({from:{row:from.row, col:from.col}, to:to});

  var originRow = isSequenceActive ? moveSequence[0].from.row : from.row;
  var originCol = isSequenceActive ? moveSequence[0].from.col : from.col;

  if(!isSequenceActive) window.turnWasPawnMove = !board[from.row][from.col].king;

  selectedPiece = null; validMoves = []; clearHighlights();

  var piece = board[from.row][from.col]; 
  board[to.row][to.col] = piece; 
  board[from.row][from.col] = null;
  
  if(to.captures){
      for(var i=0; i<to.captures.length; i++){
          var cap = to.captures[i];
          if(board[cap.row][cap.col] && !board[cap.row][cap.col].dying){
              board[cap.row][cap.col].dying = true;
              currentTurnCaptures.push(cap);
          }
      }
  }

  var mesh = getPieceMesh(from.row, from.col);
  updatePiecePosition(mesh, to.row, to.col);

  setTimeout(function(){ afterPlayerStep(to, mesh, originRow, originCol); }, 420);
}

function afterPlayerStep(to, mesh, originRow, originCol){
  var piece = board[to.row][to.col];
  var moreJumps = getJumpsFrom(to.row, to.col, piece.player, piece.king, currentTurnCaptures, {row:originRow, col:originCol});
  var hasMore = moreJumps.length > 0 && currentTurnCaptures.length > 0;

  if(hasMore){
    let maxDepth = 0;
    for(let i=0; i<moreJumps.length; i++) {
        let d = getMaxJumpDepth(moreJumps[i].row, moreJumps[i].col, piece.player, piece.king, moreJumps[i].captures, {row:originRow, col:originCol});
        moreJumps[i].totalCaptures = d;
        if(d > maxDepth) maxDepth = d;
    }
    moreJumps = moreJumps.filter(c => c.totalCaptures === maxDepth);

    isSequenceActive = true;
    selectedPiece = {row:to.row, col:to.col};
    validMoves = moreJumps.map(to => ({from: selectedPiece, to: to}));
    showSelection(to.row, to.col); showValidMoves(moreJumps);
    isProcessing = false; updateForcedHint();
    return;
  }

  // --- FIN DU TOUR & EMIT ---
  if(currentTurnCaptures.length > 0){
      idleMoves = 0;
      var caps = currentTurnCaptures.slice();
      currentTurnCaptures = [];
      var cc = 0;
      function explodeNext(){
          if(cc < caps.length){
              var cap = caps[cc];
              if(board[cap.row][cap.col]) { capturedBy[piece.player]++; board[cap.row][cap.col] = null; }
              var cm = getPieceMesh(cap.row, cap.col);
              if(cm) animCapture(cm, function(){ cc++; explodeNext(); });
              else { cc++; explodeNext(); }
          } else {
              updateCapturedDisplay(); finishTurnEnd();
          }
      }
      explodeNext();
  } else {
      if(window.turnWasPawnMove) idleMoves = 0; else idleMoves++;
      finishTurnEnd();
  }

  function finishTurnEnd() {
      if(piece && !piece.king){
          if((piece.player === 0 && to.row === 0) || (piece.player === 1 && to.row === BS-1)){
              piece.king = true; if(mesh) promotePiece(mesh);
          }
      }
      isSequenceActive = false;
      var nextPlayer = 1 - currentPlayer;

      if(socket && !IS_SPECTATOR){
        // Émis même hors connexion : Socket.io met le coup en file et
        // l'enverra à la reconnexion, au lieu de le perdre en silence.
        socket.emit('dames_move', {
          room: ROOM_ID, player: MY_SLOT, steps: moveSequence, isComplete: true,
          boardState: JSON.stringify(board), nextPlayer: nextPlayer, from: moveSequence[0].from, to: moveSequence[moveSequence.length-1].to
        });
        // Sans accusé de réception sous 5 s, le coup s'est peut-être perdu :
        // on redemande l'état réel au serveur (qui tranche dans un sens ou l'autre).
        if(ackTimer) clearTimeout(ackTimer);
        ackTimer = setTimeout(function(){ ackTimer = null; requestStateSync(); }, 5000);
      }

      moveSequence = [];
      if(idleMoves >= 50) { handleGameEnd(-1, 'draw'); return; }

      var winner = checkGameOver();
      if(winner >= 0){ handleGameEnd(winner, 'normal'); return; }

      currentPlayer = nextPlayer;
      isProcessing = false; showLastMoveOrigin(originRow, originCol);
      updUI(); stopTimer();
  }
}

/* ═════════════════════════════════════════════════════
   RÉCEPTION SEQUENCE ADVERSAIRE
═════════════════════════════════════════════════════ */
function executeRemoteSequence(steps, isComplete, nextPlayer) {
  if(!steps || steps.length === 0) return;
  isProcessing = true; clearHighlights();
  var stepIdx = 0;
  
  function nextStep() {
    if(stepIdx >= steps.length) {
      var winner = checkGameOver();
      if(winner >= 0){ handleGameEnd(winner, 'normal'); return; }
      if(isComplete) currentPlayer = typeof nextPlayer === 'number' ? nextPlayer : MY_PLAYER;
      isProcessing = false; updUI();
      if(!timerActive && !graceActive) applyPendingTimer();
      return;
    }
    
    var step = steps[stepIdx];
    var piece = board[step.from.row][step.from.col];
    board[step.to.row][step.to.col] = piece;
    board[step.from.row][step.from.col] = null;
    
    var caps = step.to.captures || [];
    for(var i=0; i<caps.length; i++) if(board[caps[i].row][caps[i].col]) board[caps[i].row][caps[i].col].dying = true;
    
    var mesh = getPieceMesh(step.from.row, step.from.col);
    if(mesh) updatePiecePosition(mesh, step.to.row, step.to.col);
    if(stepIdx === 0) showLastMoveOrigin(step.from.row, step.from.col);
    
    setTimeout(function() {
      var cc = 0;
      function expNext() {
        if(cc < caps.length) {
          var cap = caps[cc];
          if(board[cap.row][cap.col]) { capturedBy[piece.player]++; board[cap.row][cap.col] = null; }
          var cm = getPieceMesh(cap.row, cap.col);
          if(cm) animCapture(cm, function(){ cc++; expNext(); });
          else { cc++; expNext(); }
        } else {
          updateCapturedDisplay();
          if(!piece.king) {
            if((piece.player === 0 && step.to.row === 0) || (piece.player === 1 && step.to.row === BS-1)) {
              piece.king = true; if(mesh) promotePiece(mesh);
            }
          }
          stepIdx++; setTimeout(nextStep, 300);
        }
      }
      expNext();
    }, 420);
  }
  nextStep();
}

function handleGameEnd(winner, reason){
  if(IS_SPECTATOR){ handleSpectatorGameEnd(winner, reason); return; }
  if(gameOver) return;
  stopTimer(); stopGraceTimer(); stopForfeitCountdown(); gameOver = true;
  var wc=0, rc=0;
  for(var r=0; r<BS; r++) for(var c=0; c<BS; c++) if(board[r][c]){ if(board[r][c].player===0) wc++; else rc++; }
  var humanWon = (winner === MY_PLAYER);
  var colorStr = MY_PLAYER === 0 ? 'blancs' : 'rouges';
  var winnerEmoji = humanWon ? (MY_PLAYER===0?'⚪':'🔴') : (MY_PLAYER===0?'🔴':'⚪');
  var title = humanWon ? 'Vous avez gagné cette partie !' : 'Vous avez perdu cette partie.';
  var sub;
  if(reason === 'forfeit') sub = humanWon ? 'L\'adversaire a abandonné.' : 'Vous avez abandonné la partie.';
  else if(reason === 'draw') { title = 'Match Nul'; sub = '50 coups joués sans prise.'; winnerEmoji = '🤝'; }
  else sub = humanWon ? ('Félicitations ! Victoire avec les pions '+colorStr+'.\n'+wc+' pions restants contre '+rc+'.') : (OP_NAME+' remporte la partie.\n'+wc+' pions restants contre '+rc+'.');
  
  if(humanWon) createConfetti();
  showToast(winnerEmoji, title, sub, 4000, function(){ sendResult(humanWon?'win':(reason==='draw'?'draw':'loss'), reason||'normal'); });
}

function handleSpectatorGameEnd(winner, reason){
  if(gameOver) return;
  stopTimer(); stopGraceTimer(); stopForfeitCountdown(); gameOver = true;
  var wc=0, rc=0;
  for(var r=0; r<BS; r++) for(var c=0; c<BS; c++) if(board[r][c]){ if(board[r][c].player===0) wc++; else rc++; }
  var draw = winner !== 0 && winner !== 1;
  var title = draw ? 'Match nul' : 'Victoire de ' + (winner === 0 ? P1_NAME : P2_NAME);
  var sub = draw
    ? 'La partie est terminée sans vainqueur.'
    : (reason === 'timeout' ? 'Victoire par expiration du temps.' : reason === 'forfeit' ? 'Victoire par forfait.' : 'La partie est terminée.');
  sub += '\n' + wc + ' pions blancs · ' + rc + ' pions rouges';
  if(!draw) createConfetti();
  showToast(draw ? '🤝' : (winner === 0 ? '⚪' : '🔴'), title, sub, 5000, null);
}

function hasKing(player){
  if(!board || !board.length) return false;
  for(var r=0; r<BS; r++) for(var c=0; c<BS; c++) if(board[r] && board[r][c] && board[r][c].player===player && board[r][c].king) return true;
  return false;
}

/* La pastille blanche ou rouge cede la place a la vraie photo du joueur. La

function setProfilePhoto(hostId, url, fallbackHtml){
  var host = document.getElementById(hostId);
  if(!host) return;
  if(!url){ host.innerHTML = fallbackHtml; return; }
  if(host.getAttribute('data-photo') === url) return;
  host.setAttribute('data-photo', url);
  var img = new Image();
  img.className = 'profile-photo'; img.alt = ''; img.referrerPolicy = 'no-referrer';
  img.onerror = function(){ host.removeAttribute('data-photo'); host.innerHTML = fallbackHtml; };
  img.onload = function(){ host.innerHTML = ''; host.appendChild(img); };
  img.src = url;
}

var confettiCanvas=document.getElementById('confetti-canvas'), confettiCtx=confettiCanvas.getContext('2d'), confettiParts=[], confettiActive=false;
function createConfetti(){
  var colors=['#fbbf24','#f59e0b','#ffffff','#e74c3c','#818cf8','#c084fc','#34d399'], shapes=['circle','square','triangle'];
  for(var i=0; i<180; i++) confettiParts.push({x:confettiCanvas.width/2, y:confettiCanvas.height/2, vx:(Math.random()-.5)*22, vy:(Math.random()-.5)*22-6, color:colors[Math.floor(Math.random()*colors.length)], shape:shapes[Math.floor(Math.random()*shapes.length)], size:Math.random()*10+5, rotation:Math.random()*360, rotSpeed:(Math.random()-.5)*12, gravity:0.32, drag:0.985, life:1.0});

function updateConfetti(){
  if(!confettiActive) return; confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height); var any=false;
  for(var i=confettiParts.length-1; i>=0; i--){
    var p=confettiParts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=p.gravity; p.vx*=p.drag; p.vy*=p.drag; p.rotation+=p.rotSpeed; p.life-=0.004;
    if(p.life>0 && p.y<confettiCanvas.height+60){
      any=true; confettiCtx.save(); confettiCtx.translate(p.x, p.y); confettiCtx.rotate(p.rotation*Math.PI/180); confettiCtx.globalAlpha=p.life; confettiCtx.fillStyle=p.color;
      if(p.shape==='circle'){ confettiCtx.beginPath(); confettiCtx.arc(0,0,p.size/2,0,Math.PI*2); confettiCtx.fill(); }
      else if(p.shape==='square'){ confettiCtx.fillRect(-p.size/2,-p.size/2,p.size,p.size); }
      else { confettiCtx.beginPath(); confettiCtx.moveTo(0,-p.size/2); confettiCtx.lineTo(p.size/2,p.size/2); confettiCtx.lineTo(-p.size/2,p.size/2); confettiCtx.closePath(); confettiCtx.fill(); }
      confettiCtx.restore();
    }
  }
  if(!any){ confettiActive=false; confettiParts=[]; confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height); }
}

var raycaster=new THREE.Raycaster(), mouse=new THREE.Vector2();

var isDragging=false, dragMoved=false, lastTouchDist=0, lastMX=0, lastMY=0;

function getPointerCell(cx,cy){
  var rect=renderer.domElement.getBoundingClientRect();
  mouse.x=((cx-rect.left)/rect.width)*2-1;
  mouse.y=-((cy-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse,camera);
  var plane=new THREE.Plane(new THREE.Vector3(0,1,0),0), pt=new THREE.Vector3();
  raycaster.ray.intersectPlane(plane,pt); if(!pt) return null;
  var col=Math.round((pt.x+BO)/CELL), row=Math.round((pt.z+BO)/CELL);
  if(row>=0 && row<BS && col>=0 && col<BS) return {row:row, col:col}; return null;
}

renderer.domElement.addEventListener('mousedown',function(e){

});
renderer.domElement.addEventListener('mousemove',function(e){
  if(!isDragging) return;
  var dx=e.clientX-lastMX, dy=e.clientY-lastMY;
  if(Math.abs(dx)+Math.abs(dy)>8) dragMoved=true; 
  if(!topViewAnimating && !boardLocked){ camTheta-=dx*0.009; camPhi=Math.max(0.28,Math.min(1.45,camPhi-dy*0.007)); setCam(); }
  lastMX=e.clientX; lastMY=e.clientY;
});

  if(!dragMoved){ var cell=getPointerCell(e.clientX,e.clientY); if(cell) onCellClick(cell.row,cell.col); }
  isDragging=false;
});

renderer.domElement.addEventListener('touchstart',function(e){
  e.preventDefault();
  if(e.touches.length===1){ isDragging=true; dragMoved=false; lastMX=e.touches[0].clientX; lastMY=e.touches[0].clientY; }
  else if(e.touches.length===2){ isDragging=false; var dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY; lastTouchDist=Math.sqrt(dx*dx+dy*dy); }
},{passive:false});
renderer.domElement.addEventListener('touchmove',function(e){
  e.preventDefault();
  if(e.touches.length===1 && isDragging){
    var dx=e.touches[0].clientX-lastMX, dy=e.touches[0].clientY-lastMY;
    if(Math.abs(dx)+Math.abs(dy)>15) dragMoved=true;

    lastMX=e.touches[0].clientX; lastMY=e.touches[0].clientY;

    var dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
    var dist=Math.sqrt(dx*dx+dy*dy);
    if(lastTouchDist>0){ var delta=(lastTouchDist-dist)*0.045; camD=Math.max(fitD*0.45,Math.min(fitD*2.4,camD+delta)); userZoomed=true; setCam(); }
    lastTouchDist=dist;
  }
},{passive:false});

var topViewAnimating=false, camViewIdx=0;
var camViews=[
  {phi:0.72, toff:0, d:22},
  {phi:0.58, toff:Math.PI*0.30, d:22},
  {phi:0.55, toff:Math.PI*0.50, d:22},
  {phi:0.72, toff:Math.PI, d:22},
  {phi:0.55, toff:-Math.PI*0.50, d:22},
  {phi:0.58, toff:-Math.PI*0.30, d:22},
  {phi:0.06, toff:0, d:24}
];
function baseTheta(){return MY_PLAYER===0?0:Math.PI;}
function animCamTo(tD, tPhi, tTheta, dur, onDone){
  var sD=camD, sPhi=camPhi, sTheta=camTheta, t0=Date.now();
  var dTheta=tTheta-sTheta;
  while(dTheta>Math.PI) dTheta-=Math.PI*2; while(dTheta<-Math.PI) dTheta+=Math.PI*2;
  topViewAnimating=true;
  function step(){
    var p=Math.min((Date.now()-t0)/dur, 1); var e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
    camD=sD+(tD-sD)*e; camPhi=sPhi+(tPhi-sPhi)*e; camTheta=sTheta+dTheta*e; setCam();
    if(p<1) requestAnimationFrame(step);
    else { camD=tD; camPhi=tPhi; camTheta=tTheta; setCam(); topViewAnimating=false; if(onDone) onDone(); }
  }
  requestAnimationFrame(step);
}

  fitD = fitDistanceFor(v.phi, baseTheta()+v.toff); userZoomed = false;

  triggerShake(); autoRotate=false;

/* ══════════════════════════════════════════
   BOUCLE DE RENDU

var hlPulseT=0, lastMoveAlpha=0, lastMoveDir=1;
function renderLoop(){
  requestAnimationFrame(renderLoop);
  if(autoRotate && !topViewAnimating && !boardLocked){ camTheta+=0.004; setCam(); }
  hlPulseT+=0.04;
  for(var i=0; i<hlGroup.children.length; i++) hlGroup.children[i].material.opacity=0.30+Math.sin(hlPulseT*2)*0.22;
  for(var i=0; i<moveHlGroup.children.length; i++) moveHlGroup.children[i].material.opacity=0.60+Math.sin(hlPulseT*2.8+i)*0.22;
  lastMoveAlpha+=0.025*lastMoveDir;
  if(lastMoveAlpha>1){ lastMoveAlpha=1; lastMoveDir=-1; }
  if(lastMoveAlpha<0){ lastMoveAlpha=0; lastMoveDir=1; }
  for(var i=0; i<lastMoveGroup.children.length; i++) lastMoveGroup.children[i].material.opacity=0.15+lastMoveAlpha*0.28;
  for(var i=0; i<piecesGroup.children.length; i++){ var p=piecesGroup.children[i]; if(!p.userData.animating) p.rotation.y+=0.006; }
  applyShake(); updateParticles(); updateConfetti();
  renderer.render(scene, camera);
}
renderLoop();

/* BOOT */
applyChrome();
function bootGame(){
  if(IS_SPECTATOR){
    var loadingText = document.querySelector('#loading p');
    if(loadingText) loadingText.textContent = 'PRÉPARATION DU DIRECT 3D...';
    window.parent.postMessage({ type:'spectator:ready', game:'dames', gameId:GAME_ID }, '*');
    return;
  }
  initSocket();
}
try { updUI(); } catch(_) {}
if (document.readyState === 'complete' || document.readyState === 'interactive') { bootGame(); }
else { document.addEventListener('DOMContentLoaded', bootGame); }

})();
</script>
