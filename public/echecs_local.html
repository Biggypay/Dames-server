<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Échecs 3D — Jouer avec un ami | Mindspille</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#1e1b4b 0%,#312e81 50%,#1e1b4b 100%);width:100vw;height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* Barre du haut 100% transparente */
#top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:15px 14px 8px;background:transparent;z-index:20;gap:8px}

.profile{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:72px; opacity:0.5; transition:opacity 0.3s}
.profile.active{opacity:1}
.profile-timer-wrap{position:relative;width:58px;height:58px; transition: filter 0.3s;}

/* Filtre drop-shadow pour mobile */
.profile.active.human-active .profile-timer-wrap { filter: drop-shadow(0 0 10px rgba(255,255,255,0.6)); }
.profile.active.ai-active .profile-timer-wrap { filter: drop-shadow(0 0 10px rgba(231,76,60,0.6)); }

.profile-timer-wrap svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.timer-track{fill:none;stroke:rgba(255,255,255,0.08);stroke-width:4}
.timer-arc{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:163.4;stroke-dashoffset:163.4;transition:stroke 0.3s}
.profile-avatar{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:50%; -webkit-border-radius:50%; background-clip:padding-box; background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.12);transition:border-color 0.3s, background 0.3s}
.profile.active .profile-avatar{border-color:rgba(255,255,255,0.5);background:rgba(255,255,255,0.10)}

.av-white{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#f5f5f5 0%,#ffffff 50%,#e0e0e0 100%);border:3px solid #c0c0c0;box-shadow:0 2px 8px rgba(255,255,255,0.4),inset 0 2px 4px rgba(255,255,255,0.8);position:relative}
.av-white::after{content:'';position:absolute;top:20%;left:20%;width:35%;height:20%;border-radius:50%;background:rgba(255,255,255,0.9);transform:rotate(-45deg)}
.av-red{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#c0392b 0%,#e74c3c 50%,#a93226 100%);border:3px solid #922b21;box-shadow:0 2px 8px rgba(231,76,60,0.4),inset 0 2px 4px rgba(255,150,150,0.3);position:relative}
.av-red::after{content:'';position:absolute;top:20%;left:20%;width:35%;height:20%;border-radius:50%;background:rgba(255,200,200,0.4);transform:rotate(-45deg)}
.av-king::before{content:'♔';position:absolute;top:50%;left:50%;transform:translate(-50%,-55%);font-size:14px;color:#fbbf24;text-shadow:0 1px 2px rgba(0,0,0,0.5)}
.profile-name{font-family:'Cinzel',serif;font-size:9px;letter-spacing:1.5px;color:rgba(255,255,255,0.45);text-transform:uppercase;transition:color 0.3s;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile.active .profile-name{color:rgba(255,255,255,0.9)}
.top-center{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.timer-urgent .timer-arc{animation:urgentPulse 0.5s infinite alternate}
@keyframes urgentPulse{from{opacity:1}to{opacity:0.4}}

/* BADGE MISE */
.bet-badge{font-size:9px;background:rgba(251,191,36,0.15);border:1px solid rgba(251,191,36,0.4);border-radius:99px;padding:2px 8px;color:#fbbf24;font-weight:600;letter-spacing:0.5px;margin-top:2px}

.btns{display:flex;gap:7px}
.btn{background:rgba(255,255,255,0.10);color:#fff;border:1px solid rgba(255,255,255,0.28);border-radius:99px;padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.btn:active{background:rgba(255,255,255,0.25);transform:scale(0.95)}
.btn.active-cam{background:rgba(251,191,36,0.25);border-color:rgba(251,191,36,0.7);color:#fbbf24}
.btn-topview{display:flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;border-radius:50%;flex-shrink:0;color:rgba(255,255,255,0.7);transition:all .2s}
.btn-topview.active-top{background:rgba(251,191,36,0.2);border-color:rgba(251,191,36,0.7);color:#fbbf24;box-shadow:0 0 12px rgba(251,191,36,0.3)}
#wrap{flex:1 1 auto;position:relative;overflow:hidden;touch-action:none}

#loading{position:absolute;inset:0;background:linear-gradient(135deg,#1e1b4b 0%,#312e81 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .6s}
.spin{width:52px;height:52px;border:4px solid rgba(255,255,255,.08);border-top-color:#fbbf24;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#loading p{color:rgba(255,255,255,.55);margin-top:16px;font-size:11px;letter-spacing:4px;font-family:'Cinzel',serif;text-align:center;padding:0 16px}

#toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(135deg,rgba(30,27,75,.97),rgba(49,46,129,.97));border:1.5px solid rgba(251,191,36,.6);border-radius:20px;padding:28px 32px;text-align:center;pointer-events:none;z-index:140;display:none;box-shadow:0 15px 50px rgba(0,0,0,.6);min-width:220px}
#toast-emoji{font-size:48px;margin-bottom:10px;display:flex;align-items:center;justify-content:center}
.sym-white-wrap{position:relative;width:72px;height:72px}
.sym-white{width:66px;height:66px;border-radius:50%;background:linear-gradient(135deg,#f5f5f5 0%,#ffffff 50%,#e0e0e0 100%);border:4px solid #c0c0c0;box-shadow:0 4px 20px rgba(255,255,255,0.5),inset 0 4px 8px rgba(255,255,255,0.9);position:absolute;top:3px;left:3px}
.sym-white::after{content:'';position:absolute;top:18%;left:18%;width:35%;height:18%;border-radius:50%;background:rgba(255,255,255,0.95);transform:rotate(-45deg)}
.sym-red-wrap{position:relative;width:72px;height:72px}
.sym-red{width:66px;height:66px;border-radius:50%;background:linear-gradient(135deg,#c0392b 0%,#e74c3c 50%,#a93226 100%);border:4px solid #922b21;box-shadow:0 4px 20px rgba(231,76,60,0.5),inset 0 4px 8px rgba(255,150,150,0.4);position:absolute;top:3px;left:3px}
.sym-red::after{content:'';position:absolute;top:18%;left:18%;width:35%;height:18%;border-radius:50%;background:rgba(255,200,200,0.5);transform:rotate(-45deg)}
#toast-title{font-family:'Cinzel',serif;color:#fbbf24;font-size:22px;font-weight:700;margin-bottom:6px}
#toast-sub{font-size:12px;color:rgba(255,255,255,.6);letter-spacing:1px;white-space:pre-line}

#confetti-canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:55}
#force-jump-hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(220,40,20,0.22);border:1.5px solid rgba(255,90,60,0.8);border-radius:99px;padding:8px 20px;font-size:12px;color:#ff6060;font-weight:700;display:none;z-index:25;backdrop-filter:blur(8px);box-shadow:0 0 18px rgba(255,60,30,0.3)}
#force-jump-hint.show{display:block;animation:pulse-hint 1s infinite}
@keyframes pulse-hint{0%,100%{opacity:0.85;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.05)}}

#reconn-bar{position:absolute;top:0;left:0;right:0;z-index:150;background:rgba(120,20,20,0.92);color:#fff;font-family:'Cinzel',serif;font-size:11px;letter-spacing:1.5px;text-align:center;padding:8px;display:none}
#reconn-bar.show{display:block}
#forfeit-bar{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);background:rgba(30,27,75,0.95);border:1px solid rgba(251,191,36,0.5);border-radius:99px;padding:8px 20px;font-family:'Cinzel',serif;font-size:12px;color:#fbbf24;display:none;z-index:25;backdrop-filter:blur(8px)}
#forfeit-bar.show{display:block}
#hint{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:10px;color:rgba(255,255,255,.45);white-space:nowrap;pointer-events:none;z-index:5}

#bot{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:rgba(255,255,255,0.08);backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,0.15);z-index:20}
.score-row{display:flex;gap:8px;align-items:center}
.snum{font-family:'Cinzel',serif;font-size:20px;font-weight:700}
.sw{color:#ffffff}.sr{color:#f87171}.ssep{color:rgba(255,255,255,.3);font-size:13px}
.manche-lbl{font-size:9px;color:rgba(255,255,255,.35);letter-spacing:1px}
.captured-row{display:flex;flex-wrap:wrap;align-items:center;gap:2px;justify-content:center;min-height:14px;max-width:80px}
.cap-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.cap-dot-white{background:radial-gradient(circle at 35% 35%,#f0ecdc,#b8b0a0);border:1px solid rgba(255,255,255,0.4)}
.cap-dot-red{background:radial-gradient(circle at 35% 35%,#e04030,#881818);border:1px solid rgba(255,100,80,0.4)}
.cap-count{font-family:'Cinzel',serif;font-size:9px;font-weight:700;color:rgba(255,255,255,0.7);margin-left:2px}

/* Bouton Rejouer (fin de partie) */
#replay-btn{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);z-index:60;display:none;
  background:linear-gradient(135deg,#ec4899,#f472b6);color:#fff;border:none;border-radius:99px;
  padding:12px 28px;font-family:'Cinzel',serif;font-size:14px;font-weight:700;letter-spacing:0.5px;
  cursor:pointer;box-shadow:0 8px 26px rgba(236,72,153,0.5);-webkit-tap-highlight-color:transparent}
#replay-btn.show{display:block;animation:replayUp 0.35s}
@keyframes replayUp{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
#replay-btn:active{transform:translateX(-50%) scale(0.95)}

/* Choix de promotion (pion sur la dernière rangée) */
#promo-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(135deg,rgba(30,27,75,.97),rgba(49,46,129,.97));border:1.5px solid rgba(251,191,36,.6);border-radius:20px;padding:22px 26px;text-align:center;z-index:145;display:none;box-shadow:0 15px 50px rgba(0,0,0,.6)}
#promo-overlay.show{display:block;animation:promoUp 0.3s}
@keyframes promoUp{from{opacity:0;transform:translate(-50%,-42%)}to{opacity:1;transform:translate(-50%,-50%)}}
#promo-title{font-family:'Cinzel',serif;color:#fbbf24;font-size:16px;font-weight:700;margin-bottom:14px;letter-spacing:1px}
.promo-btns{display:flex;gap:10px;justify-content:center}
.promo-btn{width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,0.10);border:1.5px solid rgba(255,255,255,0.30);color:#fff;font-size:32px;line-height:1;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.promo-btn:active{background:rgba(251,191,36,0.30);border-color:#fbbf24;transform:scale(0.94)}
</style>

<script>
window.onerror=function(msg,url,line,col,err){
  var ld=document.getElementById('loading');
  if(ld){ld.querySelector('p').textContent='ERREUR JS: '+msg;}
  return false;
};

(function(){
'use strict';

var Chess = ChessEngineFactory();

/* ══════════════════════════════════════════
   URL PARAMS
══════════════════════════════════════════ */
var P = new URLSearchParams(window.location.search);
// ── MODE ENTRAÎNEMENT vs IA (aucun argent, aucun réseau) ──
// L'humain est TOUJOURS Blanc (joue en premier), l'IA est Rouge.
var DIFFICULTY = (P.get('difficulty') || P.get('level') || 'expert').toLowerCase();
if(DIFFICULTY === 'max' || DIFFICULTY === 'extreme') DIFFICULTY = 'expert';
if(['easy','medium','hard','expert'].indexOf(DIFFICULTY) < 0) DIFFICULTY = 'expert';
var AI_DEBUG = !!P.get('debug');

var MY_PLAYER = 0; // 0=Blanc (humain), 1=Rouge (IA)
var HOTSEAT=true;
var MY_NAME=P.get('name')||P.get('p1Name')||'Joueur 1';
var OP_NAME=P.get('p2Name')||'Joueur 2';

var resultSent = false;
var gameOver = false, isProcessing = false, gameReady = false;
var S = Chess.initialState();
var selectedSquare = null, validMoves = [];
var capturedBy = [0, 0];
var pendingPromotion = null;

var TIMER_DURATION = 30000, CIRC = 2*Math.PI*26;
var timerStart = null, timerRAF = null, timerActive = false;
var graceRAF = null, graceActive = false;

function hideLoading(){
  var ldEl = document.getElementById('loading');
  if(ldEl){ ldEl.style.opacity='0'; setTimeout(function(){ ldEl.style.display='none'; }, 400); }
}

function startAIGame(){
  var rb = document.getElementById('replay-btn'); if(rb) rb.classList.remove('show');
  hideLoading();
  startGame();
}

function sendResult(outcome, reason){
  if(resultSent) return; resultSent = true;
  // Mode entraînement : aucun argent. On informe seulement l'app hôte (Lovable).
  var msg = { type:'mindspille', source:'echecs-local', event:'local_over', game:'echecs', result:outcome, reason:reason||'normal', difficulty:DIFFICULTY };
  try{ window.parent.postMessage(msg, '*'); }catch(e){}
}

/* ══════════════════════════════════════════
   GESTION DES TIMERS (UI, visuel seulement)
══════════════════════════════════════════ */
function startTimer(isMyTurn, serverStartTime) {
  stopGraceTimer(); stopTimer();
  if(gameOver) return;
  timerActive = true;
  timerStart = serverStartTime || Date.now();
  var arcId = isMyTurn ? 'timer-arc-human' : 'timer-arc-ai';
  var profId = isMyTurn ? 'profile-human' : 'profile-ai';
  var arc = document.getElementById(arcId);
  var prof = document.getElementById(profId);

  prof.classList.add('active', isMyTurn ? 'human-active' : 'ai-active');

  function tick(){
    if(!timerActive) return;
    var progress = Math.min((Date.now() - timerStart) / TIMER_DURATION, 1);
    arc.style.strokeDashoffset = CIRC * progress;
    if(progress >= 0.67) prof.classList.add('timer-urgent');
    if(progress < 1) { timerRAF = requestAnimationFrame(tick); }
    else { timerActive = false; }
  }
  timerRAF = requestAnimationFrame(tick);
}

function stopTimer(){
  timerActive = false; if(timerRAF) cancelAnimationFrame(timerRAF);
  document.getElementById('timer-arc-human').style.strokeDashoffset = CIRC;
  document.getElementById('timer-arc-ai').style.strokeDashoffset = CIRC;
  document.getElementById('profile-human').className = 'profile';
  document.getElementById('profile-ai').className = 'profile';
}
function stopGraceTimer(){
  graceActive = false; if(graceRAF) cancelAnimationFrame(graceRAF);
  var bar = document.getElementById('forfeit-bar'); if(bar) bar.classList.remove('show');
}

/* ══════════════════════════════════════════
   THREE.JS & RENDU
══════════════════════════════════════════ */
var wrap = document.getElementById('wrap');
var scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x1e1b4b, 22, 70);

var camD = 20, camPhi = 0.72, camTheta = MY_PLAYER === 0 ? 0 : Math.PI;
var autoRotate = false;
var camera = new THREE.PerspectiveCamera(42, 1, 0.1, 1000);

function setCam(){
  camera.position.set(camD*Math.sin(camPhi)*Math.sin(camTheta), camD*Math.cos(camPhi), camD*Math.sin(camPhi)*Math.cos(camTheta));
  camera.lookAt(0,0,0);
}
setCam();

var renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
wrap.appendChild(renderer.domElement);

function resize(){
  var w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h); camera.aspect = w/h; camera.updateProjectionMatrix();
  var cc = document.getElementById('confetti-canvas'); if(cc){ cc.width = w; cc.height = h; }
}

/* ══════════════════════════════════════════
   CADRAGE AUTOMATIQUE DU PLATEAU
   ══════════════════════════════════════════
   La distance de la camera etait une constante, donc juste pour un seul format
   d'ecran. Sur un telephone etroit, le champ horizontal est bien plus ferme
   que le vertical : le plateau sortait des deux cotes. On cherche ici, par
   dichotomie, la plus petite distance a laquelle les huit coins du plateau se
   projettent tous dans le cadre — exact quel que soit le format et quel que
   soit l'angle de vue. */
var fitD = camD;
var userZoomed = false;   /* le pincement du joueur prime sur le recadrage */

function boardFitRadius(){
    if(typeof BO !== 'number' || typeof CELL !== 'number') return 0;
  return BO + CELL * 0.5 + 0.45;
}

function fitDistanceFor(phi, theta){
  var R = boardFitRadius();
  if(!R || !camera) return camD;
  var saveD = camD, savePhi = camPhi, saveTheta = camTheta;
  var corners = [];
  for(var sx = -1; sx <= 1; sx += 2)
    for(var sz = -1; sz <= 1; sz += 2)
      for(var sy = 0; sy <= 1; sy++)
        corners.push(new THREE.Vector3(sx * R, sy * 1.1, sz * R));
  var lo = 4, hi = 200;
  for(var i = 0; i < 26; i++){
    var mid = (lo + hi) / 2;
    camD = mid; camPhi = phi; camTheta = theta; setCam();
    camera.updateMatrixWorld(true);
    var fits = true;
    for(var k = 0; k < corners.length; k++){
      var p = corners[k].clone().project(camera);
      if(Math.abs(p.x) > 0.94 || Math.abs(p.y) > 0.94){ fits = false; break; }
    }
    if(fits) hi = mid; else lo = mid;
  }
  camD = saveD; camPhi = savePhi; camTheta = saveTheta; setCam();
  return hi;
}

function fitBoardToScreen(force){
  if(userZoomed && !force) return;
  if(force) userZoomed = false;
  fitD = fitDistanceFor(camPhi, camTheta);
  camD = fitD;
  setCam();
}

resize(); window.addEventListener('resize', resize);
window.addEventListener('resize', function(){ fitBoardToScreen(false); });
/* Trois passes : au chargement, une fois la mise en page stabilisee, puis
   apres l'apparition de la barre d'adresse sur telephone. */
setTimeout(function(){ fitBoardToScreen(true); }, 0);
setTimeout(function(){ fitBoardToScreen(true); }, 300);
setTimeout(function(){ fitBoardToScreen(true); }, 1200);

var boardGroup = new THREE.Group(), piecesGroup = new THREE.Group(), hlGroup = new THREE.Group();

var CELL = 1.4, BS = 8, BO = (BS-1)*CELL/2;
var PIECE_Y = 0.10;

var shake = {active:false, t0:0, dur:2000, aX:0.20, aZ:0.15, fX:12, fZ:9, aP:0.12, fP:16};
function triggerShake(){ shake.active=true; shake.t0=Date.now(); }
function applyShake(){
  var groups = [boardGroup, piecesGroup, hlGroup, moveHlGroup, lastMoveGroup, checkGroup];
  if(!shake.active){ for(var i=0; i<groups.length; i++){ groups[i].rotation.x=0; groups[i].rotation.z=0; groups[i].position.x=0; } return; }
  var el = (Date.now()-shake.t0)/1000, t = el/(shake.dur/1000);
  if(t>=1){ shake.active=false; return; }
  var d = Math.pow(1-t, 2.2);
  var rx = Math.sin(el*shake.fX)*shake.aX*d, rz = Math.sin(el*shake.fZ+1.1)*shake.aZ*d, px = Math.sin(el*shake.fP+0.5)*shake.aP*d;
  for(var i=0; i<groups.length; i++){ groups[i].rotation.x=rx; groups[i].rotation.z=rz; groups[i].position.x=px; }
}

function createBoardMesh(){
  var baseMat = new THREE.MeshStandardMaterial({color:0x2a1a10, roughness:0.92});
  var base = new THREE.Mesh(new THREE.BoxGeometry(BS*CELL+0.7, 0.22, BS*CELL+0.7), baseMat);
  base.position.y = -0.11; base.receiveShadow = true; boardGroup.add(base);
  var lM = new THREE.MeshStandardMaterial({color:0xb8936a, roughness:0.80});
  var dM = new THREE.MeshStandardMaterial({color:0x100a28, roughness:0.60, metalness:0.12});
  for(var r=0; r<BS; r++) for(var c=0; c<BS; c++){
    var isDark = (r+c)%2===1;
    var cell = new THREE.Mesh(new THREE.BoxGeometry(CELL, 0.12, CELL), isDark?dM:lM);
    cell.position.set(c*CELL-BO, 0.04, r*CELL-BO); cell.receiveShadow = true;
    cell.userData = {row:r, col:c}; boardGroup.add(cell);
  }
  var bMat = new THREE.MeshStandardMaterial({color:0xfbbf24, roughness:0.18, metalness:0.88, emissive:0xfbbf24, emissiveIntensity:0.10});
  var bk = 0.09, bL = BS*CELL+0.3, bh = 0.22;
  var borders = [
    {g:new THREE.BoxGeometry(bk, bh, bL+bk*2), x:-BO-CELL/2-bk/2, z:0},
    {g:new THREE.BoxGeometry(bk, bh, bL+bk*2), x:BO+CELL/2+bk/2, z:0},
    {g:new THREE.BoxGeometry(bL+bk*2, bh, bk), x:0, z:-BO-CELL/2-bk/2},
    {g:new THREE.BoxGeometry(bL+bk*2, bh, bk), x:0, z:BO+CELL/2+bk/2}
  ];
  for(var i=0; i<borders.length; i++){ var bm = new THREE.Mesh(borders[i].g, bMat); bm.position.set(borders[i].x, 0.11, borders[i].z); boardGroup.add(bm); }
}
createBoardMesh();

var particles = [];
function createExplosion(x,y,z,color,count){
  count = count||25; var geo = new THREE.SphereGeometry(0.08, 6, 6); var mat = new THREE.MeshBasicMaterial({color:color});
  for(var i=0; i<count; i++){
    var m = new THREE.Mesh(geo, mat); m.position.set(x,y,z);
    m.userData = {vel:new THREE.Vector3((Math.random()-.5)*.34, Math.random()*.42+.08, (Math.random()-.5)*.34), life:1.0, decay:0.016+Math.random()*.013};
    particlesGroup.add(m); particles.push(m);
  }
}
function updateParticles(){
  for(var i=particles.length-1; i>=0; i--){
    var p = particles[i]; p.userData.life -= p.userData.decay; p.position.add(p.userData.vel); p.userData.vel.y -= 0.016;
    var s = Math.max(0, p.userData.life); p.scale.set(s, s, s);
    if(p.userData.life<=0){ particlesGroup.remove(p); particles.splice(i,1); }
  }
}

/* ══════════════════════════════════════════
   PIÈCES D'ÉCHECS 3D (mêmes matériaux que les dames)
══════════════════════════════════════════ */
function pieceMaterials(player){
  var mainC = player===0?0xe8e0cc:0xc02818, edgeC = player===0?0x909080:0x781410, emivC = player===0?0x181410:0x380800, emiI = player===0?0.03:0.12;
  return {
    body: new THREE.MeshStandardMaterial({color:mainC, roughness:0.38, metalness:0.18, emissive:emivC, emissiveIntensity:emiI}),
    trim: new THREE.MeshStandardMaterial({color:edgeC, roughness:0.20, metalness:0.75}),
    gold: new THREE.MeshStandardMaterial({color:0xfbbf24, roughness:0.12, metalness:0.96, emissive:0xfbbf24, emissiveIntensity:0.48})
  };
}

function buildPieceMesh(player, type){
  var g = new THREE.Group();
  var m = pieceMaterials(player);
  function add(geo, mat, y, x, z, rx, rz){
    var mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x||0, y||0, z||0);
    if(rx) mesh.rotation.x = rx;
    if(rz) mesh.rotation.z = rz;
    mesh.castShadow = true; mesh.receiveShadow = true;
    g.add(mesh); return mesh;
  }
  add(new THREE.CylinderGeometry(0.27, 0.34, 0.12, 24), m.body, 0.06);
  var ring = add(new THREE.TorusGeometry(0.30, 0.030, 12, 24), m.trim, 0.12);
  ring.rotation.x = Math.PI/2;

  if(type === 1){ // Pion
    add(new THREE.CylinderGeometry(0.10, 0.21, 0.26, 20), m.body, 0.25);
    add(new THREE.SphereGeometry(0.155, 20, 16), m.body, 0.48);
  } else if(type === 4){ // Tour
    add(new THREE.CylinderGeometry(0.21, 0.25, 0.38, 20), m.body, 0.31);
    add(new THREE.CylinderGeometry(0.26, 0.23, 0.10, 20), m.body, 0.55);
    for(var i=0; i<4; i++){
      var a = (i/4)*Math.PI*2 + Math.PI/4;
      add(new THREE.BoxGeometry(0.11, 0.12, 0.11), m.body, 0.66, Math.cos(a)*0.17, Math.sin(a)*0.17);
    }
  } else if(type === 2){ // Cavalier
    add(new THREE.CylinderGeometry(0.16, 0.24, 0.24, 20), m.body, 0.24);
    var head = add(new THREE.BoxGeometry(0.20, 0.40, 0.26), m.body, 0.52, 0, 0.02);
    head.rotation.x = -0.42;
    var muzzle = add(new THREE.BoxGeometry(0.14, 0.15, 0.20), m.body, 0.63, 0, -0.17);
    muzzle.rotation.x = -0.2;
    add(new THREE.ConeGeometry(0.045, 0.13, 8), m.trim, 0.78, -0.06, 0.10);
    add(new THREE.ConeGeometry(0.045, 0.13, 8), m.trim, 0.78, 0.06, 0.10);
    g.rotation.y = player===0 ? Math.PI : 0;
  } else if(type === 3){ // Fou
    add(new THREE.CylinderGeometry(0.09, 0.23, 0.40, 20), m.body, 0.32);
    add(new THREE.SphereGeometry(0.145, 20, 16), m.body, 0.58);
    add(new THREE.SphereGeometry(0.055, 12, 10), m.trim, 0.74);
  } else if(type === 5){ // Dame
    add(new THREE.CylinderGeometry(0.11, 0.26, 0.48, 20), m.body, 0.36);
    var crown = add(new THREE.TorusGeometry(0.15, 0.045, 12, 24), m.gold, 0.64);
    crown.rotation.x = Math.PI/2;
    for(var i=0; i<6; i++){
      var a = (i/6)*Math.PI*2;
      add(new THREE.ConeGeometry(0.04, 0.12, 8), m.gold, 0.72, Math.cos(a)*0.15, Math.sin(a)*0.15);
    }
    add(new THREE.SphereGeometry(0.075, 14, 12), m.gold, 0.76);
  } else { // Roi
    add(new THREE.CylinderGeometry(0.12, 0.27, 0.52, 20), m.body, 0.38);
    var collar = add(new THREE.TorusGeometry(0.14, 0.04, 12, 24), m.gold, 0.66);
    collar.rotation.x = Math.PI/2;
    add(new THREE.BoxGeometry(0.055, 0.24, 0.055), m.gold, 0.83);
    add(new THREE.BoxGeometry(0.17, 0.055, 0.055), m.gold, 0.86);
  }
  return g;
}

function makePiece(player, row, col, type){
  var g = buildPieceMesh(player, type);
  g.position.set(col*CELL-BO, PIECE_Y, row*CELL-BO); g.scale.set(0,0,0);
  g.userData = {type:'piece', player:player, ptype:type, row:row, col:col, targetY:PIECE_Y, animating:false, baseRotY:g.rotation.y};
  piecesGroup.add(g); return g;
}

function animPop(mesh){
  var t0 = Date.now(), DUR = 620;
  function eoe(t){ if(t===0||t===1) return t; var p = 0.38, s = p/(2*Math.PI)*Math.asin(1); return Math.pow(2,-10*t)*Math.sin((t-s)*(2*Math.PI)/p)+1; }
  function loop(){ var p = Math.min((Date.now()-t0)/DUR, 1); var sv = Math.max(0, eoe(p)); mesh.scale.set(sv, sv, sv); if(p<1) requestAnimationFrame(loop); else mesh.scale.set(1,1,1); }
  loop();
}
function animCapture(mesh, onComplete){
  var t0 = Date.now(); createExplosion(mesh.position.x, mesh.position.y+0.3, mesh.position.z, mesh.userData.player===0?0xf8f6f0:0xd63020, 22);
  function animate(){ var p = (Date.now()-t0)/300; if(p<1){ var sc = 1-p; mesh.scale.set(sc, sc, sc); mesh.position.y+=0.04; mesh.rotation.y+=0.25; requestAnimationFrame(animate); } else { piecesGroup.remove(mesh); if(onComplete) onComplete(); } }
  animate();
}

function syncPieces(){
  while(piecesGroup.children.length) piecesGroup.remove(piecesGroup.children[0]);
  for(var i=0; i<64; i++){
    var p = S.b[i];
    if(!p) continue;
    animPop(makePiece(p>0?0:1, Chess.rowOf(i), Chess.colOf(i), p<0?-p:p));
  }
  updateCheckDisplay();
}
function getPieceMesh(row, col){
  for(var i=0; i<piecesGroup.children.length; i++){ var p = piecesGroup.children[i]; if(p.userData.row===row && p.userData.col===col) return p; } return null;
}
function updatePiecePosition(mesh, row, col, onDone){
  mesh.userData.animating = true; mesh.userData.row = row; mesh.userData.col = col;
  var sx = mesh.position.x, sz = mesh.position.z, tx = col*CELL-BO, tz = row*CELL-BO, t0 = Date.now(), DUR = 420;
  function animate(){ var p = Math.min((Date.now()-t0)/DUR, 1); var e = p<.5 ? 2*p*p : 1-Math.pow(-2*p+2, 2)/2; mesh.position.x = sx+(tx-sx)*e; mesh.position.z = sz+(tz-sz)*e; mesh.position.y = mesh.userData.targetY+Math.sin(p*Math.PI)*0.42; if(p<1) requestAnimationFrame(animate); else{ mesh.position.y = mesh.userData.targetY; mesh.userData.animating = false; if(onDone) onDone(); } }
  animate();
}
function morphPiece(mesh, newType){
  var player = mesh.userData.player, row = mesh.userData.row, col = mesh.userData.col;
  piecesGroup.remove(mesh);
  var g = makePiece(player, row, col, newType);
  animPop(g);
  createExplosion(g.position.x, g.position.y+0.5, g.position.z, 0xfbbf24, 45);
  return g;
}

function countPieces(){
  var w=0, r=0;
  for(var i=0;i<64;i++){ if(S.b[i]>0) w++; else if(S.b[i]<0) r++; }
  return {w:w, r:r};
}
function recomputeCaptures(){
  var n = countPieces();
  capturedBy = [16-n.r, 16-n.w];
}
function updateScores(){
  var n = countPieces();
  document.getElementById('score-w').textContent = n.w;
  document.getElementById('score-r').textContent = n.r;
}

function updateCapturedDisplay(){
  var elH = document.getElementById('cap-human'), elA = document.getElementById('cap-ai');
  var hCount = capturedBy[MY_PLAYER], aCount = capturedBy[1 - MY_PLAYER];
  var hColor = MY_PLAYER === 0 ? 'white' : 'red';
  var aColor = MY_PLAYER === 0 ? 'red' : 'white';

  function buildDots(el, count, cls){
    el.innerHTML = ''; if(count===0) return;
    var show = Math.min(count, 10);
    for(var i=0; i<show; i++){ var d = document.createElement('div'); d.className = 'cap-dot cap-dot-'+cls; el.appendChild(d); }
    var span = document.createElement('span'); span.className = 'cap-count'; span.textContent = '×'+count; el.appendChild(span);
  }
  buildDots(elH, hCount, hColor); buildDots(elA, aCount, aColor);
}

function clearHighlights(){ while(hlGroup.children.length) hlGroup.remove(hlGroup.children[0]); while(moveHlGroup.children.length) moveHlGroup.remove(moveHlGroup.children[0]); }
function clearLastMove(){ while(lastMoveGroup.children.length) lastMoveGroup.remove(lastMoveGroup.children[0]); }
function clearCheckDisplay(){ while(checkGroup.children.length) checkGroup.remove(checkGroup.children[0]); }

function showSelection(row, col){
  var m = new THREE.Mesh(new THREE.CircleGeometry(0.64, 32), new THREE.MeshBasicMaterial({color:0xfbbf24, transparent:true, opacity:0.50, side:THREE.DoubleSide}));
  m.rotation.x = -Math.PI/2; m.position.set(col*CELL-BO, 0.17, row*CELL-BO); hlGroup.add(m);
}

function showValidMoves(moves){
  while(moveHlGroup.children.length) moveHlGroup.remove(moveHlGroup.children[0]);
  for(var i=0; i<moves.length; i++){
    var mv = moves[i], isCapture = !!mv.cap;
    var row = Chess.rowOf(mv.t), col = Chess.colOf(mv.t);
    var color = isCapture?0xff2200:0x00dd66, radius = isCapture?0.44:0.36;
    if(mv.castle) { color = 0xfbbf24; radius = 0.44; }
    var m = new THREE.Mesh(new THREE.CircleGeometry(radius, 32), new THREE.MeshBasicMaterial({color:color, transparent:true, opacity:0.80, side:THREE.DoubleSide}));
    m.rotation.x = -Math.PI/2; m.position.set(col*CELL-BO, 0.22, row*CELL-BO); moveHlGroup.add(m);
    if(isCapture){ var ring = new THREE.Mesh(new THREE.RingGeometry(0.46, 0.55, 32), new THREE.MeshBasicMaterial({color:0xff4400, transparent:true, opacity:0.60, side:THREE.DoubleSide})); ring.rotation.x = -Math.PI/2; ring.position.set(col*CELL-BO, 0.23, row*CELL-BO); moveHlGroup.add(ring); }
  }
}

function showLastMoveOrigin(row, col){
  clearLastMove();
  var m = new THREE.Mesh(new THREE.CircleGeometry(0.58, 32), new THREE.MeshBasicMaterial({color:0x88ccff, transparent:true, opacity:0.38, side:THREE.DoubleSide}));
  m.rotation.x = -Math.PI/2; m.position.set(col*CELL-BO, 0.15, row*CELL-BO); lastMoveGroup.add(m);
}

function updateCheckDisplay(){
  clearCheckDisplay();
  var hint = document.getElementById('force-jump-hint');

  if(Chess.inCheck(S, side)){

    }

  } else {

  }
}

/* ═════════════════════════════════════════════════════
   JOUER : SÉLECTION + CIBLE (+ PROMOTION)
═════════════════════════════════════════════════════ */
function onCellClick(row, col){
  if(!gameReady || gameOver || isProcessing || pendingPromotion) return;
  var idx = row*8 + col;
  var clicked = S.b[idx];
  var isMine=clicked!==0&&(S.t===0?clicked>0:clicked<0);

  if(selectedSquare !== null){
    var matches = validMoves.filter(function(m){ return m.t === idx; });
    if(matches.length === 1){ startLocalMove(matches[0]); return; }
    if(matches.length > 1){
      pendingPromotion = { from: selectedSquare, to: idx, moves: matches };
      showPromoOverlay();
      return;
    }
  }

  if(isMine){
    var mine = Chess.legalMoves(S).filter(function(m){ return m.f === idx; });
    if(mine.length === 0){ selectedSquare = null; clearHighlights(); return; }
    clearHighlights();
    selectedSquare = idx;
    validMoves = mine;
    showSelection(row, col);
    showValidMoves(mine);
    return;
  }

  selectedSquare = null; validMoves = [];
  clearHighlights();
}

function showPromoOverlay(){ document.getElementById('promo-overlay').classList.add('show'); }
function hidePromoOverlay(){ document.getElementById('promo-overlay').classList.remove('show'); }

(function(){
  var btns = document.querySelectorAll('.promo-btn');
  for(var i=0; i<btns.length; i++){
    btns[i].addEventListener('click', function(){
      if(!pendingPromotion) return hidePromoOverlay();
      var want = parseInt(this.getAttribute('data-promo'), 10);
      var chosen = null;
      for(var j=0; j<pendingPromotion.moves.length; j++) if(pendingPromotion.moves[j].p === want) chosen = pendingPromotion.moves[j];
      var mv = chosen || pendingPromotion.moves[0];
      pendingPromotion = null; hidePromoOverlay();
      startLocalMove(mv);
    });
  }
})();

function startLocalMove(mv){
  isProcessing = true;
  selectedSquare = null; validMoves = []; clearHighlights();
  var prevState = S;
  S = Chess.applyMove(S, mv);
  animateMove(prevState, mv, function(){
    finishTurn(true);
  });
}

/* Anime un coup déjà appliqué à S (prevState = état AVANT le coup). */
function animateMove(prevState, mv, onDone){
  var fr = Chess.rowOf(mv.f), fc = Chess.colOf(mv.f);
  var tr = Chess.rowOf(mv.t), tc = Chess.colOf(mv.t);
  var moverPlayer = prevState.t;
  var mesh = getPieceMesh(fr, fc);
  showLastMoveOrigin(fr, fc);

  var victimMesh = null;
  if(mv.cap){
    var capSq = mv.ep ? (mv.t + (moverPlayer===0?8:-8)) : mv.t;
    victimMesh = getPieceMesh(Chess.rowOf(capSq), Chess.colOf(capSq));
    if(victimMesh === mesh) victimMesh = null;
  }
  if(victimMesh){
    var vm = victimMesh;
    setTimeout(function(){ animCapture(vm, null); }, mv.ep ? 0 : 220);
  }

  function afterMain(){
    var stepsDone = 0, want = 1;
    function done(){ if(++stepsDone >= want && onDone) onDone(); }
    if(mv.castle){
      var rookFromC = mv.castle===1 ? 7 : 0;
      var rookToC = mv.castle===1 ? tc-1 : tc+1;
      var rookMesh = getPieceMesh(tr, rookFromC);
      if(rookMesh){ want++; updatePiecePosition(rookMesh, tr, rookToC, done); }
    }
    if(mv.p && mesh){ mesh = morphPiece(mesh, mv.p); }
    done();
  }

  if(mesh){ updatePiecePosition(mesh, tr, tc, afterMain); }
  else { syncPieces(); if(onDone) onDone(); }
}

function finishTurn(humanJustMoved){
  recomputeCaptures();
  updateScores(); updateCapturedDisplay(); updateCheckDisplay();
  isProcessing = false;
  var st = Chess.gameStatus(S);
  if(st.over){
    if(st.reason === 'checkmate') handleGameEnd(st.winner, 'checkmate');
    else handleGameEnd(-1, st.reason);
    return;
  }
  updUI(); stopTimer();
  startTimer(S.t===MY_PLAYER,Date.now());
}

/* ═════════════════════════════════════════════════════
   FIN DE PARTIE ET UI
═════════════════════════════════════════════════════ */
function drawLabel(reason){
  if(reason === 'stalemate') return 'Pat — aucun coup légal.';
  if(reason === 'fifty') return 'Règle des 50 coups.';
  if(reason === 'repetition') return 'Triple répétition de la position.';
  if(reason === 'insufficient') return 'Matériel insuffisant pour mater.';
  return 'Match nul.';
}

function handleGameEnd(winner, reason){
  if(gameOver) return;
  stopTimer(); stopGraceTimer(); gameOver = true;
  hidePromoOverlay(); pendingPromotion = null;
  updateCheckDisplay();
  var humanWon = (winner === MY_PLAYER);
  var winnerEmoji = humanWon ? '⚪' : '🔴';
  var title, sub;
  var showReplay = function(){
    var rb = document.getElementById('replay-btn'); if(rb) rb.classList.add('show');
  };
  if(winner === -1 || winner === null){
    title = 'Match Nul'; winnerEmoji = '🤝'; sub = drawLabel(reason);
    showToast(winnerEmoji, title, sub, 4000, function(){ sendResult('draw', reason||'draw'); showReplay(); });
    return;
  }
  title=(winner===0?MY_NAME:OP_NAME)+' gagne !';
  if(reason==='checkmate')sub='Échec et mat !';else sub='Victoire !';

  if(humanWon) createConfetti();
  showToast(winnerEmoji, title, sub, 4000, function(){ sendResult(humanWon?'win':'loss', reason||'normal'); showReplay(); });
}

function updUI(){
  var ahEl=document.getElementById('avatar-human'), aaEl=document.getElementById('avatar-ai');
  ahEl.innerHTML='<div class="av-white av-king"></div>';
  aaEl.innerHTML='<div class="av-red av-king"></div>';
  document.getElementById('timer-arc-human').setAttribute('stroke', '#ffffff');
  document.getElementById('timer-arc-ai').setAttribute('stroke', '#e74c3c');
  document.getElementById('profile-human').querySelector('.profile-name').textContent = MY_NAME;
  document.getElementById('profile-ai').querySelector('.profile-name').textContent = OP_NAME;
  updateScores();
  updateCheckDisplay();
}

function startGame(){
  gameReady=false; gameOver=false; isProcessing=false; resultSent=false;
  selectedSquare=null; validMoves=[];
  pendingPromotion=null; hidePromoOverlay();
  aiReqId++; aiPending=null; aiMoveCount=0;
  camTheta=0; camPhi=0.72; fitBoardToScreen(true);
  capturedBy=[0,0];
  S = Chess.initialState();
  syncPieces(); clearHighlights(); clearLastMove(); stopTimer(); stopGraceTimer();
  updateCapturedDisplay();

  showToast('🎲','Jouer avec un ami',MY_NAME+' commence (Blancs)',2400,function(){
    gameReady=true;updUI();startTimer(true,Date.now());
  });
}

function showToast(emoji, title, sub, delay, cb){
  var el = document.getElementById('toast');
  document.getElementById('toast-emoji').innerHTML = symHtml(emoji);
  document.getElementById('toast-title').textContent = title;
  document.getElementById('toast-sub').textContent = sub;
  el.style.cssText = 'display:block;opacity:0;transform:translate(-50%,-50%) scale(0.8);transition:none;';
  setTimeout(function(){ el.style.transition='all 0.35s cubic-bezier(0.175,0.885,0.32,1.275)'; el.style.opacity='1'; el.style.transform='translate(-50%,-50%) scale(1)'; }, 20);
  setTimeout(function(){ el.style.opacity='0'; el.style.transform='translate(-50%,-50%) scale(0.85)'; setTimeout(function(){ el.style.display='none'; if(cb) cb(); }, 300); }, delay);
}
function symHtml(sym){
  if(sym==='⚪') return '<div class="sym-white-wrap"><div class="sym-white"></div></div>';
  if(sym==='🔴') return '<div class="sym-red-wrap"><div class="sym-red"></div></div>';
  return sym;
}

var confettiCanvas=document.getElementById('confetti-canvas'), confettiCtx=confettiCanvas.getContext('2d'), confettiParts=[], confettiActive=false;
function createConfetti(){
  var colors=['#fbbf24','#f59e0b','#ffffff','#e74c3c','#818cf8','#c084fc','#34d399'], shapes=['circle','square','triangle'];
  for(var i=0; i<180; i++) confettiParts.push({x:confettiCanvas.width/2, y:confettiCanvas.height/2, vx:(Math.random()-.5)*22, vy:(Math.random()-.5)*22-6, color:colors[Math.floor(Math.random()*colors.length)], shape:shapes[Math.floor(Math.random()*shapes.length)], size:Math.random()*10+5, rotation:Math.random()*360, rotSpeed:(Math.random()-.5)*12, gravity:0.32, drag:0.985, life:1.0});
  confettiActive=true;
}
function updateConfetti(){
  if(!confettiActive) return; confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height); var any=false;
  for(var i=confettiParts.length-1; i>=0; i--){
    var p=confettiParts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=p.gravity; p.vx*=p.drag; p.vy*=p.drag; p.rotation+=p.rotSpeed; p.life-=0.004;
    if(p.life>0 && p.y<confettiCanvas.height+60){
      any=true; confettiCtx.save(); confettiCtx.translate(p.x, p.y); confettiCtx.rotate(p.rotation*Math.PI/180); confettiCtx.globalAlpha=p.life; confettiCtx.fillStyle=p.color;
      if(p.shape==='circle'){ confettiCtx.beginPath(); confettiCtx.arc(0,0,p.size/2,0,Math.PI*2); confettiCtx.fill(); }
      else if(p.shape==='square'){ confettiCtx.fillRect(-p.size/2,-p.size/2,p.size,p.size); }
      else { confettiCtx.beginPath(); confettiCtx.moveTo(0,-p.size/2); confettiCtx.lineTo(p.size/2,p.size/2); confettiCtx.lineTo(-p.size/2,p.size/2); confettiCtx.closePath(); confettiCtx.fill(); }
      confettiCtx.restore();
    }
  }
  if(!any){ confettiActive=false; confettiParts=[]; confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height); }
}

/* ══════════════════════════════════════════
   CONTRÔLES SOURIS / TOUCH
══════════════════════════════════════════ */
var raycaster=new THREE.Raycaster(), mouse=new THREE.Vector2();
var boardLocked=false;
var isDragging=false, dragMoved=false, lastTouchDist=0, lastMX=0, lastMY=0;

function getPointerCell(cx,cy){
  var rect=renderer.domElement.getBoundingClientRect();
  mouse.x=((cx-rect.left)/rect.width)*2-1;
  mouse.y=-((cy-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse,camera);
  var plane=new THREE.Plane(new THREE.Vector3(0,1,0),0), pt=new THREE.Vector3();
  raycaster.ray.intersectPlane(plane,pt); if(!pt) return null;
  var col=Math.round((pt.x+BO)/CELL), row=Math.round((pt.z+BO)/CELL);
  if(row>=0 && row<BS && col>=0 && col<BS) return {row:row, col:col}; return null;
}

renderer.domElement.addEventListener('mousedown',function(e){
  isDragging=true; dragMoved=false; lastMX=e.clientX; lastMY=e.clientY;
});
renderer.domElement.addEventListener('mousemove',function(e){
  if(!isDragging) return;
  var dx=e.clientX-lastMX, dy=e.clientY-lastMY;
  if(Math.abs(dx)+Math.abs(dy)>8) dragMoved=true;
  if(!topViewAnimating && !boardLocked){ camTheta-=dx*0.009; camPhi=Math.max(0.28,Math.min(1.45,camPhi-dy*0.007)); setCam(); }
  lastMX=e.clientX; lastMY=e.clientY;
});
renderer.domElement.addEventListener('mouseup',function(e){
  if(!dragMoved){ var cell=getPointerCell(e.clientX,e.clientY); if(cell) onCellClick(cell.row,cell.col); }
  isDragging=false;
});

renderer.domElement.addEventListener('touchstart',function(e){
  e.preventDefault();
  if(e.touches.length===1){ isDragging=true; dragMoved=false; lastMX=e.touches[0].clientX; lastMY=e.touches[0].clientY; }
  else if(e.touches.length===2){ isDragging=false; var dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY; lastTouchDist=Math.sqrt(dx*dx+dy*dy); }
},{passive:false});
renderer.domElement.addEventListener('touchmove',function(e){
  e.preventDefault();
  if(e.touches.length===1 && isDragging){
    var dx=e.touches[0].clientX-lastMX, dy=e.touches[0].clientY-lastMY;
    if(Math.abs(dx)+Math.abs(dy)>15) dragMoved=true;
    if(!topViewAnimating && !boardLocked){ camTheta-=dx*0.010; camPhi=Math.max(0.28,Math.min(1.45,camPhi-dy*0.008)); setCam(); }
    lastMX=e.touches[0].clientX; lastMY=e.touches[0].clientY;
  }else if(e.touches.length===2){
    var dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
    var dist=Math.sqrt(dx*dx+dy*dy);
    if(lastTouchDist>0){ var delta=(lastTouchDist-dist)*0.045; camD=Math.max(fitD*0.45,Math.min(fitD*2.4,camD+delta)); userZoomed=true; setCam(); }
    lastTouchDist=dist;
  }
},{passive:false});
renderer.domElement.addEventListener('touchend',function(e){
  e.preventDefault();
  if(!dragMoved && e.changedTouches.length>0){
    var t=e.changedTouches[0];
    var cell=getPointerCell(t.clientX,t.clientY);
    if(cell) onCellClick(cell.row,cell.col);
  }
  isDragging=false; lastTouchDist=0;
},{passive:false});

/* ══════════════════════════════════════════
   BOUTONS UI & CAM
══════════════════════════════════════════ */
var topViewAnimating=false, camViewIdx=0;
var camViews=[
  {phi:0.72, toff:0, d:20},
  {phi:0.58, toff:Math.PI*0.30, d:20},
  {phi:0.55, toff:Math.PI*0.50, d:20},
  {phi:0.72, toff:Math.PI, d:20},
  {phi:0.55, toff:-Math.PI*0.50, d:20},
  {phi:0.58, toff:-Math.PI*0.30, d:20},
  {phi:0.06, toff:0, d:22}
];
function baseTheta(){return MY_PLAYER===0?0:Math.PI;}
function animCamTo(tD, tPhi, tTheta, dur, onDone){
  var sD=camD, sPhi=camPhi, sTheta=camTheta, t0=Date.now();
  var dTheta=tTheta-sTheta;
  while(dTheta>Math.PI) dTheta-=Math.PI*2; while(dTheta<-Math.PI) dTheta+=Math.PI*2;
  topViewAnimating=true;
  function step(){
    var p=Math.min((Date.now()-t0)/dur, 1); var e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
    camD=sD+(tD-sD)*e; camPhi=sPhi+(tPhi-sPhi)*e; camTheta=sTheta+dTheta*e; setCam();
    if(p<1) requestAnimationFrame(step);
    else { camD=tD; camPhi=tPhi; camTheta=tTheta; setCam(); topViewAnimating=false; if(onDone) onDone(); }
  }
  requestAnimationFrame(step);
}
document.getElementById('btn-topview').addEventListener('click',function(){
  if(topViewAnimating) return;
  camViewIdx=(camViewIdx+1)%camViews.length;
  var v=camViews[camViewIdx];
  animCamTo(camD, v.phi, baseTheta()+v.toff, 720, null);
  triggerShake(); autoRotate=false;
  document.getElementById('btn-cam').classList.remove('active-cam');
  document.getElementById('btn-topview').classList.toggle('active-top', camViewIdx!==0);
});
document.getElementById('btn-lock').addEventListener('click',function(){
  boardLocked=!boardLocked;
  if(boardLocked){ autoRotate=false; document.getElementById('btn-cam').classList.remove('active-cam'); }
  this.classList[boardLocked?'add':'remove']('active-cam');
  this.textContent=boardLocked?'🔒':'🔓';
});
document.getElementById('btn-cam').addEventListener('click',function(){
  autoRotate=!autoRotate;
  document.getElementById('btn-cam').classList[autoRotate?'add':'remove']('active-cam');
});

/* ══════════════════════════════════════════
   BOUCLE DE RENDU
══════════════════════════════════════════ */
var hlPulseT=0, lastMoveAlpha=0, lastMoveDir=1;
function renderLoop(){
  requestAnimationFrame(renderLoop);
  if(autoRotate && !topViewAnimating && !boardLocked){ camTheta+=0.004; setCam(); }
  hlPulseT+=0.04;
  for(var i=0; i<hlGroup.children.length; i++) hlGroup.children[i].material.opacity=0.30+Math.sin(hlPulseT*2)*0.22;
  for(var i=0; i<moveHlGroup.children.length; i++) moveHlGroup.children[i].material.opacity=0.60+Math.sin(hlPulseT*2.8+i)*0.22;
  for(var i=0; i<checkGroup.children.length; i++) checkGroup.children[i].material.opacity=0.45+Math.sin(hlPulseT*3.2)*0.30;
  lastMoveAlpha+=0.025*lastMoveDir;
  if(lastMoveAlpha>1){ lastMoveAlpha=1; lastMoveDir=-1; }
  if(lastMoveAlpha<0){ lastMoveAlpha=0; lastMoveDir=1; }
  for(var i=0; i<lastMoveGroup.children.length; i++) lastMoveGroup.children[i].material.opacity=0.15+lastMoveAlpha*0.28;
  applyShake(); updateParticles(); updateConfetti();
  renderer.render(scene, camera);
}
renderLoop();

/* ══════════════════════════════════════════
   INTELLIGENCE ARTIFICIELLE
   ─ Les coups JOUABLES sont générés par le MÊME moteur FIDE
     que le jeu (Chess.legalMoves) : l'IA ne peut jamais jouer
     un coup illégal.
   ─ Le CHOIX du coup est fait par la recherche du moteur
     (negamax alpha-bêta + approfondissement itératif + table
     de transposition + quiescence). Il tourne dans un Web
     Worker pour ne pas bloquer le rendu 3D (repli synchrone
     si les Workers sont indisponibles).
══════════════════════════════════════════ */

/* Niveaux : budget de réflexion (ms), profondeur max, marge de variété (points),
   proportion de coups volontairement aléatoires, budget du repli synchrone. */
var AI_LEVELS={
  easy:  { budget:150,  maxDepth:2,  margin:120, openMargin:120, rnd:0.25, syncBudget:120 },
  medium:{ budget:600,  maxDepth:10, margin:30,  openMargin:40,  rnd:0,    syncBudget:400 },
  hard:  { budget:1800, maxDepth:20, margin:0,   openMargin:12,  rnd:0,    syncBudget:800 },
  expert:{ budget:4000, maxDepth:32, margin:0,   openMargin:6,   rnd:0,    syncBudget:1500 }
};

var aiReqId=0, aiPending=null, aiMoveCount=0;
var _syncEngine=null;
function getSyncEngine(){ if(!_syncEngine) _syncEngine=ChessEngineFactory(); return _syncEngine; }

function buildAIWorker(){
  try{
    var src='var __FACTORY=('+ChessEngineFactory.toString()+');var __ENGINE=__FACTORY();\n'+
      'onmessage=function(ev){var d=ev.data;try{var r=__ENGINE.rankRoot(d.state,d.budget,d.maxDepth);'+
      'postMessage({id:d.id,idx:r.idx,depth:r.depth,nodes:r.nodes,scores:r.scores});}'+
      'catch(err){postMessage({id:d.id,error:String(err)});}};';
    return new Worker(URL.createObjectURL(new Blob([src],{type:'application/javascript'})));
  }catch(e){ return null; }
}
function wireAIWorker(w){
  if(!w) return;
  w.onmessage=function(ev){
    var d=ev.data||{};
    if(aiPending&&d.id===aiPending.id){ var cb=aiPending.cb; aiPending=null; cb(d.error?null:d); }
  };
  w.onerror=function(){
    try{ w.terminate(); }catch(e){}
    if(AI_WORKER===w) AI_WORKER=null;
    if(aiPending){ var cb=aiPending.cb; aiPending=null; cb(null); }
  };
}
var AI_WORKER=buildAIWorker(); wireAIWorker(AI_WORKER);

// Variété contrôlée : parmi les coups à `margin` points du meilleur.
// (jamais quand un mat forcé est trouvé ; marge nulle = choix déterministe)
function chooseIdxFromScores(res,lvl){
  var idx=(typeof res.idx==='number')?res.idx:0;
  var margin=(aiMoveCount<4)?Math.max(lvl.margin,lvl.openMargin||0):lvl.margin;
  var sc=res.scores;
  if(!sc||!sc.length||margin<=0) return idx;
  var best=-Infinity,i;
  for(i=0;i<sc.length;i++) if(typeof sc[i]==='number'&&sc[i]>best) best=sc[i];
  if(best===-Infinity||best>=99000) return idx;
  var pool=[];
  for(i=0;i<sc.length;i++) if(typeof sc[i]==='number'&&best-sc[i]<=margin) pool.push(i);
  if(pool.indexOf(idx)<0) pool.push(idx);
  return pool[(Math.random()*pool.length)|0];
}

function aiTurn(){
  if(gameOver || S.t !== 1) return;
  var rootMoves = Chess.legalMoves(S);
  if(!rootMoves.length){ finishTurn(false); return; }   // mat/pat déjà géré par gameStatus
  var lvl=AI_LEVELS[DIFFICULTY]||AI_LEVELS.hard;
  function playIdx(i){
    if(gameOver) return;
    var mi=(typeof i==='number'&&i>=0&&i<rootMoves.length)?i:0;
    aiMoveCount++;
    executeAIMove(rootMoves[mi]);
  }
  if(rootMoves.length===1){ playIdx(0); return; }
  if(lvl.rnd>0&&Math.random()<lvl.rnd){ playIdx((Math.random()*rootMoves.length)|0); return; }

  var req=++aiReqId, settled=false, watchdog=null;
  var stateExport = Chess.exportState(S);
  function finish(res){
    if(settled) return; settled=true;
    if(watchdog){ clearTimeout(watchdog); watchdog=null; }
    if(gameOver||req!==aiReqId) return;
    if(!res){ try{ res=getSyncEngine().rankRoot(stateExport,lvl.syncBudget,lvl.maxDepth); }catch(e){ res=null; } }
    if(!res||typeof res.idx!=='number'||res.idx<0){ playIdx(0); return; }
    if(AI_DEBUG) try{ console.log('[IA échecs] niveau='+DIFFICULTY+' profondeur='+res.depth+' nœuds='+res.nodes); }catch(e){}
    playIdx(chooseIdxFromScores(res,lvl));
  }

  if(!AI_WORKER){ AI_WORKER=buildAIWorker(); wireAIWorker(AI_WORKER); }
  if(AI_WORKER){
    watchdog=setTimeout(function(){
      aiPending=null;
      try{ AI_WORKER.terminate(); }catch(e){}
      AI_WORKER=null;
      finish(null);
    },lvl.budget+6000);
    aiPending={ id:req, cb:function(res){ if(watchdog){ clearTimeout(watchdog); watchdog=null; } finish(res); } };
    try{ AI_WORKER.postMessage({ id:req, state:stateExport, budget:lvl.budget, maxDepth:lvl.maxDepth }); }
    catch(e){ aiPending=null; if(watchdog){ clearTimeout(watchdog); watchdog=null; } finish(null); }
  } else {
    setTimeout(function(){ finish(null); },20);
  }
}

function executeAIMove(mv){
  if(gameOver) return;
  isProcessing = true; clearHighlights();
  var prevState = S;
  S = Chess.applyMove(S, mv);
  animateMove(prevState, mv, function(){
    finishTurn(false);
  });
}

/* Bouton Rejouer (affiché seulement en fin de partie) */
var _rb = document.getElementById('replay-btn');
if(_rb) _rb.addEventListener('click', function(){ this.classList.remove('show'); startAIGame(); });

/* BOOT */
if (document.readyState === 'complete' || document.readyState === 'interactive') { startAIGame(); }
else { document.addEventListener('DOMContentLoaded', startAIGame); }

})();
</script>
