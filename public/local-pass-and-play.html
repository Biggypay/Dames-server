<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>MindSpille · Jouer avec un ami</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(135deg,#17143e,#302b79 55%,#17143e);color:#fff;font-family:Inter,system-ui,sans-serif}body{min-height:100dvh;display:flex;flex-direction:column;overflow:hidden}.top{padding:12px 14px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}.player{min-width:86px;text-align:center;opacity:.45;transition:.2s}.player.active{opacity:1}.disc{width:44px;height:44px;border-radius:50%;margin:auto;display:grid;place-items:center;font-weight:900;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08)}.p1 .disc{box-shadow:0 0 18px rgba(226,232,240,.25)}.p2 .disc{color:#fecaca;box-shadow:0 0 18px rgba(248,113,113,.25)}.name{font-size:10px;letter-spacing:.12em;margin-top:5px;text-transform:uppercase}.center{text-align:center;flex:1}.title{font-family:Georgia,serif;color:#fbbf24;font-weight:800;letter-spacing:.12em;font-size:17px}.sub{font-size:9px;opacity:.5;letter-spacing:.16em;margin-top:2px}.rounds{display:flex;justify-content:center;gap:5px;margin-top:6px}.rd{width:24px;height:5px;border-radius:99px;background:rgba(255,255,255,.12)}.rd.p1{background:#22c55e}.rd.p2{background:#ef4444}.rd.draw{background:#fbbf24}.rd.now{background:rgba(255,255,255,.55)}.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;position:relative}.board{width:min(94vw,620px);height:min(94vw,620px);max-height:calc(100dvh - 190px);display:grid;touch-action:none}.cell{border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.055);display:grid;place-items:center;position:relative;user-select:none;-webkit-user-select:none}.cell.light{background:rgba(255,255,255,.13)}.cell.dark{background:rgba(0,0,0,.16)}.cell.sel{outline:3px solid #fbbf24;outline-offset:-3px}.cell.move:after{content:'';width:22%;height:22%;border-radius:50%;background:#fbbf24;opacity:.75}.piece{font-size:clamp(16px,5vw,38px);line-height:1;filter:drop-shadow(0 2px 3px #0008)}.stone{width:70%;height:70%;border-radius:50%;box-shadow:inset 0 2px 5px #fff5,0 3px 8px #0008}.stone.one{background:#e2e8f0}.stone.two{background:#ef4444}.footer{min-height:64px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(255,255,255,.06);border-top:1px solid rgba(255,255,255,.1)}button{border:1px solid rgba(251,191,36,.35);background:rgba(255,255,255,.07);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700}button.primary{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#211b52;border:0}button:disabled{opacity:.35}.status{text-align:center;font-size:12px;min-width:110px}.overlay{position:fixed;inset:0;background:rgba(10,8,32,.94);z-index:50;display:none;align-items:center;justify-content:center;padding:24px;text-align:center}.overlay.show{display:flex}.card{max-width:360px;width:100%;padding:24px;border:1px solid rgba(251,191,36,.35);border-radius:22px;background:linear-gradient(135deg,#211d58,#353083);box-shadow:0 20px 60px #0008}.card h2{margin:0 0 10px;color:#fbbf24}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.choice{font-size:30px;padding:18px 8px}.small{font-size:11px;opacity:.62}.quori{position:relative}.qcell.goal1{background:rgba(226,232,240,.2)}.qcell.goal2{background:rgba(248,113,113,.25)}.qpawn{width:62%;height:62%;border-radius:50%;box-shadow:0 2px 6px #000a,inset 0 2px 4px #fff7}.qpawn.one{background:#e2e8f0;border:2px solid #94a3b8}.qpawn.two{background:#ef4444;border:2px solid #991b1b}.arrow{position:absolute;color:#fbbf24;font-size:34px;filter:drop-shadow(0 0 7px #fbbf24);pointer-events:none}.domino{display:flex;align-items:center;gap:2px;background:#f8fafc;color:#111827;border-radius:7px;padding:7px 9px;font-weight:800;border:2px solid #cbd5e1}.hand{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:96vw}.track{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;width:min(96vw,680px)}.track .cell{aspect-ratio:1}.token{width:18px;height:18px;border-radius:50%;display:inline-block;margin:1px}.token.one{background:#e2e8f0}.token.two{background:#ef4444}
</style></head><body>
<div class="top"><div class="player p1 active" id="p1"><div class="disc" id="p1disc">1</div><div class="name">Joueur 1</div></div><div class="center"><div class="title" id="title">JEU LOCAL</div><div class="sub">JOUER AVEC UN AMI · MÊME APPAREIL</div><div class="rounds" id="rounds"></div></div><div class="player p2" id="p2"><div class="disc" id="p2disc">2</div><div class="name">Joueur 2</div></div></div>
<div class="stage" id="stage"></div><div class="footer" id="footer"><button id="newBtn">↻ Recommencer</button><div class="status" id="status">Joueur 1</div></div>
<div class="overlay" id="pass"><div class="card"><h2 id="passTitle">Passez le téléphone</h2><p id="passText">Au joueur suivant.</p><button class="primary" id="passBtn">Je suis prêt</button></div></div>
<div class="overlay" id="modal"><div class="card"><h2 id="modalTitle">Partie terminée</h2><p id="modalText"></p><button class="primary" id="again">Rejouer</button></div></div>
<script src="/echecs-engine.js"></script><script>
'use strict';
const P=new URLSearchParams(location.search),GAME=(P.get('game')||'tictactoe').toLowerCase();
const stage=document.getElementById('stage'),footer=document.getElementById('footer'),statusEl=document.getElementById('status'),roundsEl=document.getElementById('rounds');
let turn=1,restart=()=>{}; const names={tictactoe:'TIC-TAC-TOE',gomoku:'MORPION À 5',quoridor:'QUORIDOR',chess:'ÉCHECS',checkers:'DAMES',rock_paper_scissors:'CHIFOUMI',penalty_shootout:'PENALTY',penalty:'PENALTY',dominos:'DOMINOS',ludo:'LUDO'};document.getElementById('title').textContent=names[GAME]||'JEU LOCAL';
function setTurn(t,label){turn=t;document.getElementById('p1').classList.toggle('active',t===1);document.getElementById('p2').classList.toggle('active',t===2);statusEl.textContent=label||('Joueur '+t);}
function clear(){stage.innerHTML='';footer.querySelectorAll('.temp').forEach(x=>x.remove());roundsEl.innerHTML='';}
function passTo(t,text,cb){const o=document.getElementById('pass');document.getElementById('passTitle').textContent='Passez le téléphone';document.getElementById('passText').textContent=text||('Au joueur '+t);o.classList.add('show');document.getElementById('passBtn').onclick=()=>{o.classList.remove('show');setTurn(t);cb&&cb();};}
function end(title,text,onAgain){document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').textContent=text||'';document.getElementById('modal').classList.add('show');document.getElementById('again').onclick=()=>{document.getElementById('modal').classList.remove('show');(onAgain||restart)();};}
function btn(txt,fn,cls=''){const b=document.createElement('button');b.textContent=txt;b.className='temp '+cls;b.onclick=fn;footer.appendChild(b);return b;}
document.getElementById('newBtn').onclick=()=>restart();
function seriesUI(s){roundsEl.innerHTML='';for(let i=0;i<6;i++){let d=document.createElement('i');d.className='rd';if(i<s.hist.length)d.classList.add(s.hist[i]===1?'p1':s.hist[i]===2?'p2':'draw');else if(i===s.hist.length)d.classList.add('now');roundsEl.appendChild(d);}}
function seriesState(){return{wins:{1:0,2:0},hist:[],starter:1};}
function recordSeries(s,w,nextRound){s.hist.push(w||0);if(w)s.wins[w]++;seriesUI(s);let n=s.hist.length,left=6-n,a=s.wins[1],b=s.wins[2];let decided=n>=6&&a!==b;if(Math.abs(a-b)>left)decided=true;if(decided)return end('Série terminée',`Joueur ${a>b?1:2} gagne ${Math.max(a,b)}–${Math.min(a,b)}.`,restart);if(n>=6&&a===b)return nextRound(true);s.starter=s.starter===1?2:1;setTimeout(()=>nextRound(false),700);}
function grid(n,click){const b=document.createElement('div');b.className='board';b.style.gridTemplateColumns=`repeat(${n},1fr)`;for(let i=0;i<n*n;i++){let c=document.createElement('div');c.className='cell';c.dataset.i=i;c.onclick=()=>click(i,c);b.appendChild(c);}stage.appendChild(b);return b;}

function tic(){clear();let s=seriesState();function round(sudden=false){stage.innerHTML='';let b=Array(9).fill(0),done=false;setTurn(s.starter);seriesUI(s);let g=grid(3,(i,c)=>{if(done||b[i])return;b[i]=turn;c.innerHTML=turn===1?'<span class="piece">✕</span>':'<span class="piece" style="color:#ef4444">◯</span>';const W=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],win=W.some(x=>x.every(k=>b[k]===turn));if(win){done=true;let w=turn;if(sudden){s.wins[w]++;return end('Manche décisive',`Joueur ${w} gagne la série.`,restart);}return recordSeries(s,w,round);}if(b.every(Boolean)){done=true;if(sudden)return setTimeout(()=>round(true),700);return recordSeries(s,0,round);}setTurn(turn===1?2:1);});}
 restart=()=>{s=seriesState();round(false)};restart();}

function gomoku(){clear();let s=seriesState(),N=15;function round(sudden=false){stage.innerHTML='';let b=Array(N*N).fill(0),done=false;setTurn(s.starter);seriesUI(s);grid(N,(i,c)=>{if(done||b[i])return;b[i]=turn;c.innerHTML=`<span class="stone ${turn===1?'one':'two'}"></span>`;let r=Math.floor(i/N),cc=i%N,win=[[1,0],[0,1],[1,1],[1,-1]].some(([dr,dc])=>{let n=1;for(let sg of[-1,1]){let rr=r+dr*sg,x=cc+dc*sg;while(rr>=0&&rr<N&&x>=0&&x<N&&b[rr*N+x]===turn){n++;rr+=dr*sg;x+=dc*sg;}}return n>=5});if(win){done=true;let w=turn;if(sudden){s.wins[w]++;return end('Manche décisive',`Joueur ${w} gagne la série.`,restart);}return recordSeries(s,w,round);}if(b.every(Boolean)){done=true;return sudden?setTimeout(()=>round(true),600):recordSeries(s,0,round);}setTurn(turn===1?2:1);});}
 restart=()=>{s=seriesState();round(false)};restart();}

function chess(){clear();const E=self.ChessEngineFactory&&self.ChessEngineFactory();if(!E)return end('Erreur','Moteur d’échecs indisponible.');let st,sel=-1;const chars={1:'♙',2:'♘',3:'♗',4:'♖',5:'♕',6:'♔','-1':'♟','-2':'♞','-3':'♝','-4':'♜','-5':'♛','-6':'♚'};function draw(){stage.innerHTML='';setTurn(st.t+1,st.t===0?'Blancs — Joueur 1':'Noirs — Joueur 2');let g=grid(8,(i,c)=>tap(i));[...g.children].forEach((c,i)=>{let r=Math.floor(i/8),x=i%8;c.classList.add((r+x)%2?'dark':'light');if(i===sel)c.classList.add('sel');let p=st.b[i];if(p)c.innerHTML=`<span class="piece">${chars[p]}</span>`;});if(sel>=0){let legal=E.legalMoves(st).filter(m=>m.f===sel);legal.forEach(m=>g.children[m.t].classList.add('move'));}}
 function tap(i){let p=st.b[i],side=st.t===0?1:-1;if(sel<0){if(p&&Math.sign(p)===side){sel=i;draw();}return;}let moves=E.legalMoves(st).filter(m=>m.f===sel&&m.t===i);if(!moves.length){sel=-1;draw();return;}let m=moves.find(x=>x.p===5)||moves[0];st=E.applyMove(st,m);sel=-1;let gs=E.gameStatus(st);draw();if(gs.over){let text=gs.reason==='checkmate'?`Joueur ${gs.winner+1} gagne par échec et mat.`:'Partie nulle.';setTimeout(()=>end('Échecs terminés',text,restart),250);}}
 restart=()=>{st=E.initialState();sel=-1;draw()};restart();}

function checkers(){clear();const N=10;let b,forced=null;function init(){b=Array(N*N).fill(null);for(let r=0;r<4;r++)for(let c=0;c<N;c++)if((r+c)%2)b[r*N+c]={p:2,k:false};for(let r=6;r<N;r++)for(let c=0;c<N;c++)if((r+c)%2)b[r*N+c]={p:1,k:false};setTurn(1);forced=null;draw();}function dirs(pc){return pc.k?[[-1,-1],[-1,1],[1,-1],[1,1]]:pc.p===1?[[-1,-1],[-1,1]]:[[1,-1],[1,1]];}function jumps(i){let pc=b[i],r=Math.floor(i/N),c=i%N,out=[];if(!pc)return out;for(let[d1,d2]of dirs({...pc,k:true})){let r1=r+d1,c1=c+d2,r2=r+2*d1,c2=c+2*d2;if(r2>=0&&r2<N&&c2>=0&&c2<N&&r1>=0&&r1<N&&c1>=0&&c1<N){let mid=b[r1*N+c1];if(mid&&mid.p!==pc.p&&!b[r2*N+c2])out.push({to:r2*N+c2,cap:r1*N+c1});}}return out;}function moves(i){let pc=b[i],r=Math.floor(i/N),c=i%N,out=[];for(let[dr,dc]of dirs(pc)){let rr=r+dr,cc=c+dc;if(rr>=0&&rr<N&&cc>=0&&cc<N&&!b[rr*N+cc])out.push({to:rr*N+cc});}return out;}function allJ(){let a=[];for(let i=0;i<b.length;i++)if(b[i]?.p===turn&&jumps(i).length)a.push(i);return a;}let sel=-1;function draw(){stage.innerHTML='';let g=grid(N,i=>tap(i));[...g.children].forEach((c,i)=>{let r=Math.floor(i/N),x=i%N;c.classList.add((r+x)%2?'dark':'light');let pc=b[i];if(pc)c.innerHTML=`<span class="piece" style="color:${pc.p===1?'#e2e8f0':'#ef4444'}">${pc.k?'♛':'●'}</span>`;if(i===sel)c.classList.add('sel');});if(sel>=0){let js=jumps(sel),ls=js.length?js:moves(sel);ls.forEach(m=>g.children[m.to].classList.add('move'));}setTurn(turn);}
 function tap(i){if(forced!==null)sel=forced;let mandatory=allJ();if(sel<0){if(b[i]?.p===turn&&(mandatory.length===0||mandatory.includes(i))){sel=i;draw();}return;}let js=jumps(sel),opts=js.length?js:moves(sel),mv=opts.find(x=>x.to===i);if(!mv){sel=-1;draw();return;}let pc=b[sel];b[i]=pc;b[sel]=null;if(mv.cap!==undefined)b[mv.cap]=null;let rr=Math.floor(i/N);if(!pc.k&&((pc.p===1&&rr===0)||(pc.p===2&&rr===N-1)))pc.k=true;if(mv.cap!==undefined&&jumps(i).length){forced=i;sel=i;draw();return;}forced=null;sel=-1;turn=turn===1?2:1;if(!b.some(x=>x?.p===turn)||!hasMove(turn)){return end('Dames terminées',`Joueur ${turn===1?2:1} gagne.`,restart);}draw();}function hasMove(p){let old=turn;turn=p;let ok=allJ().length||b.some((x,i)=>x?.p===p&&moves(i).length);turn=old;return!!ok;}restart=init;restart();}

function quoridor(){clear();const N=9;let pos,walls,hW,vW,mode='move';function init(){pos={1:{r:8,c:4},2:{r:0,c:4}};walls={1:10,2:10};hW=Array.from({length:8},()=>Array(8).fill(false));vW=Array.from({length:8},()=>Array(8).fill(false));setTurn(1);draw();}function blocked(a,b){let dr=b.r-a.r,dc=b.c-a.c;if(dr===-1)return(a.c<8&&a.r>0&&hW[a.r-1][a.c])||(a.c>0&&a.r>0&&hW[a.r-1][a.c-1]);if(dr===1)return(a.c<8&&a.r<8&&hW[a.r][a.c])||(a.c>0&&a.r<8&&hW[a.r][a.c-1]);if(dc===-1)return(a.c>0&&a.r<8&&vW[a.r][a.c-1])||(a.c>0&&a.r>0&&vW[a.r-1][a.c-1]);if(dc===1)return(a.c<8&&a.r<8&&vW[a.r][a.c])||(a.c<8&&a.r>0&&vW[a.r-1][a.c]);return false;}function pmoves(p){let me=pos[p],op=pos[p===1?2:1],out=[];for(let[dr,dc]of[[-1,0],[1,0],[0,-1],[0,1]]){let n={r:me.r+dr,c:me.c+dc};if(n.r<0||n.r>=N||n.c<0||n.c>=N||blocked(me,n))continue;if(n.r===op.r&&n.c===op.c){let j={r:n.r+dr,c:n.c+dc};if(j.r>=0&&j.r<N&&j.c>=0&&j.c<N&&!blocked(n,j))out.push(j);else for(let[pdr,pdc]of[[dc,dr],[-dc,-dr]]){let d={r:n.r+pdr,c:n.c+pdc};if(d.r>=0&&d.r<N&&d.c>=0&&d.c<N&&!blocked(n,d))out.push(d);}}else out.push(n);}return out;}function path(p){let goal=p===1?0:8,q=[pos[p]],seen=new Set([pos[p].r+','+pos[p].c]);while(q.length){let a=q.shift();if(a.r===goal)return true;for(let[dr,dc]of[[-1,0],[1,0],[0,-1],[0,1]]){let n={r:a.r+dr,c:a.c+dc},k=n.r+','+n.c;if(n.r<0||n.r>=N||n.c<0||n.c>=N||seen.has(k)||blocked(a,n))continue;seen.add(k);q.push(n);}}return false;}function canWall(r,c,type){if(r<0||r>7||c<0||c>7)return false;if(type==='h'){if(hW[r][c]||(c>0&&hW[r][c-1])||(c<7&&hW[r][c+1])||vW[r][c])return false;hW[r][c]=true;let ok=path(1)&&path(2);hW[r][c]=false;return ok;}if(vW[r][c]||(r>0&&vW[r-1][c])||(r<7&&vW[r+1][c])||hW[r][c])return false;vW[r][c]=true;let ok=path(1)&&path(2);vW[r][c]=false;return ok;}function draw(){stage.innerHTML='';let wrap=document.createElement('div');wrap.className='board quori';wrap.style.gridTemplateColumns='repeat(9,1fr)';if(turn===2)wrap.style.transform='rotate(180deg)';let valid=pmoves(turn);for(let r=0;r<N;r++)for(let c=0;c<N;c++){let el=document.createElement('div');el.className='cell qcell '+(r===0?'goal1':r===8?'goal2':'');el.onclick=()=>tap(r,c);if(valid.some(x=>x.r===r&&x.c===c)&&mode==='move')el.classList.add('move');for(let p of[1,2])if(pos[p].r===r&&pos[p].c===c){let q=document.createElement('i');q.className='qpawn '+(p===1?'one':'two');if(turn===2)q.style.transform='rotate(180deg)';el.appendChild(q);}wrap.appendChild(el);}stage.appendChild(wrap);let a=document.createElement('div');a.className='arrow';a.textContent='↑';a.style.left='50%';a.style.top='6%';a.style.transform='translateX(-50%)';stage.appendChild(a);statusEl.textContent=`J${turn} · ${walls[turn]} murs · ${mode==='move'?'Déplacer':mode==='h'?'Mur H':'Mur V'}`;}
 function tap(r,c){if(mode==='move'){let m=pmoves(turn).find(x=>x.r===r&&x.c===c);if(!m)return;pos[turn]={r,c};if((turn===1&&r===0)||(turn===2&&r===8))return end('Quoridor terminé',`Joueur ${turn} atteint la ligne adverse.`,restart);turn=turn===1?2:1;mode='move';draw();return;}if(!walls[turn])return;let rr=Math.min(7,r),cc=Math.min(7,c);if(!canWall(rr,cc,mode))return;if(mode==='h')hW[rr][cc]=true;else vW[rr][cc]=true;walls[turn]--;turn=turn===1?2:1;mode='move';draw();}
 btn('♟ Déplacer',()=>{mode='move';draw()});btn('━ Mur H',()=>{mode='h';draw()});btn('┃ Mur V',()=>{mode='v';draw()});restart=init;restart();}

function rps(){clear();let score={1:0,2:0},round=1,choices={};function choose(p,v){choices[p]=v;if(p===1)return passTo(2,'Joueur 2 : faites votre choix sans regarder celui du joueur 1.',()=>show());let a=choices[1],b=choices[2],w=a===b?0:((a==='rock'&&b==='scissors')||(a==='paper'&&b==='rock')||(a==='scissors'&&b==='paper'))?1:2;if(w)score[w]++;let em={rock:'✊',paper:'✋',scissors:'✌️'};end(`Manche ${round}`,`${em[a]} contre ${em[b]} — ${w?'Joueur '+w+' gagne':'égalité'}. Score ${score[1]}–${score[2]}.`,()=>{if(round>=6)return end('Match terminé',score[1]===score[2]?'Égalité.':`Joueur ${score[1]>score[2]?1:2} gagne.`,restart);round++;choices={};setTurn(1);show();});}function show(){stage.innerHTML='<div class="card"><h2>Choisissez</h2><div class="choices" id="c"></div></div>';for(let[v,e]of[['rock','✊'],['paper','✋'],['scissors','✌️']]){let b=document.createElement('button');b.className='choice';b.textContent=e;b.onclick=()=>choose(turn,v);document.getElementById('c').appendChild(b);}statusEl.textContent=`Manche ${round} · ${score[1]}–${score[2]}`;}restart=()=>{score={1:0,2:0};round=1;choices={};setTurn(1);show()};restart();}

function penalty(){clear();let r=1,score={1:0,2:0},shots={};function show(){stage.innerHTML='<div class="card"><h2>Choisissez une zone</h2><div class="choices" id="z"></div><p class="small">Le tireur marque si le gardien ne choisit pas la même zone.</p></div>';for(let i=0;i<9;i++){let b=document.createElement('button');b.textContent=i+1;b.className='choice';b.onclick=()=>pick(i);document.getElementById('z').appendChild(b);}statusEl.textContent=`Tir ${r} · ${score[1]}–${score[2]}`;}function pick(z){shots[turn]=z;if(turn===1)return passTo(2,'Joueur 2 : choisissez votre zone de gardien.',show);let goal=shots[1]!==shots[2];if(goal)score[1]++;end(goal?'⚽ BUT !':'🧤 ARRÊT !',`Score ${score[1]}–${score[2]}.`,()=>{r++;shots={};if(r>5)return end('Série terminée',`Joueur 1 : ${score[1]} buts · Joueur 2 gardien : ${5-score[1]} arrêts.`,restart);setTurn(1);show();});}restart=()=>{r=1;score={1:0,2:0};shots={};setTurn(1);show()};restart();}

function dominos(){clear();let players,chain,ends,boneyard,passes;const tiles=()=>{let a=[];for(let i=0;i<=6;i++)for(let j=i;j<=6;j++)a.push({a:i,b:j,id:i+'-'+j});return a.sort(()=>Math.random()-.5)};function init(){let all=tiles();players=[all.splice(0,7),all.splice(0,7)];boneyard=all;chain=[];ends=[null,null];passes=0;setTurn(1);passTo(1,'Joueur 1 : prenez le téléphone pour voir votre main.',draw);}function valid(t){return ends[0]===null||t.a===ends[0]||t.b===ends[0]||t.a===ends[1]||t.b===ends[1];}function play(t){if(!valid(t))return;let hand=players[turn-1],i=hand.findIndex(x=>x.id===t.id);if(i<0)return;hand.splice(i,1);if(ends[0]===null){chain=[t];ends=[t.a,t.b];}else if(t.b===ends[0]){chain.unshift(t);ends[0]=t.a;}else if(t.a===ends[0]){chain.unshift({a:t.b,b:t.a,id:t.id});ends[0]=t.b;}else if(t.a===ends[1]){chain.push(t);ends[1]=t.b;}else{chain.push({a:t.b,b:t.a,id:t.id});ends[1]=t.a;}passes=0;if(!hand.length)return end('Dominos terminés',`Joueur ${turn} n'a plus de domino.`,restart);next();}function next(){turn=turn===1?2:1;passTo(turn,`Joueur ${turn} : prenez le téléphone pour afficher votre main.`,draw);}function drawTile(){while(boneyard.length&&!players[turn-1].some(valid))players[turn-1].push(boneyard.pop());if(!players[turn-1].some(valid)){passes++;if(passes>=2){let sums=players.map(h=>h.reduce((s,t)=>s+t.a+t.b,0));return end('Partie bloquée',sums[0]===sums[1]?'Égalité.':`Joueur ${sums[0]<sums[1]?1:2} gagne avec le moins de points.`,restart);}next();}else draw();}function draw(){stage.innerHTML='';let c=document.createElement('div');c.className='card';c.innerHTML='<h2>Chaîne</h2>';let row=document.createElement('div');row.className='hand';for(let t of chain){let d=document.createElement('span');d.className='domino';d.textContent=t.a+'│'+t.b;row.appendChild(d);}c.appendChild(row);c.appendChild(document.createElement('hr'));let h=document.createElement('div');h.className='hand';for(let t of players[turn-1]){let d=document.createElement('button');d.className='domino';d.textContent=t.a+'│'+t.b;d.disabled=!valid(t);d.onclick=()=>play(t);h.appendChild(d);}c.appendChild(h);stage.appendChild(c);statusEl.textContent=`Joueur ${turn} · Pioche ${boneyard.length}`;}btn('Piocher / passer',drawTile);restart=init;restart();}

function ludo(){clear();const FIN=57;let pos,dice=null;function init(){pos={1:[-1,-1,-1,-1],2:[-1,-1,-1,-1]};setTurn(1);draw();}function roll(){dice=1+Math.floor(Math.random()*6);draw();}function legal(p,i){let x=pos[p][i];if(x===FIN)return false;if(x<0)return dice===6;return x+dice<=FIN;}function move(i){if(dice===null||!legal(turn,i))return;let x=pos[turn][i];pos[turn][i]=x<0?0:x+dice;let moved=pos[turn][i];if(moved>0&&moved<52){let other=turn===1?2:1;for(let j=0;j<4;j++)if(pos[other][j]===moved)pos[other][j]=-1;}if(pos[turn].every(x=>x===FIN))return end('Ludo terminé',`Joueur ${turn} a rentré ses 4 pions.`,restart);let extra=dice===6;dice=null;if(!extra)turn=turn===1?2:1;draw();}function draw(){stage.innerHTML='';let t=document.createElement('div');t.className='track';for(let i=0;i<52;i++){let c=document.createElement('div');c.className='cell';let html='';for(let p of[1,2])for(let k=0;k<4;k++)if(pos[p][k]===i)html+=`<i class="token ${p===1?'one':'two'}"></i>`;c.innerHTML=html;t.appendChild(c);}stage.appendChild(t);let c=document.createElement('div');c.className='card';c.innerHTML=`<h2>Joueur ${turn}</h2><p>Dé : <b>${dice===null?'—':dice}</b></p><div class="hand" id="tokens"></div><p class="small">Un 6 permet de sortir un pion et donne un tour supplémentaire. Arrivée exacte requise.</p>`;stage.appendChild(c);for(let i=0;i<4;i++){let b=document.createElement('button');let x=pos[turn][i];b.textContent=x<0?'Maison':x===FIN?'Arrivé':'Pion '+(i+1)+' · '+x;b.disabled=dice===null||!legal(turn,i);b.onclick=()=>move(i);c.querySelector('#tokens').appendChild(b);}statusEl.textContent=`Joueur ${turn}`;}btn('🎲 Lancer le dé',()=>{if(dice===null)roll()});restart=init;restart();}

const handlers={tictactoe:tic,gomoku,quoridor,chess,checkers,rock_paper_scissors:rps,penalty_shootout:penalty,penalty,dominos,ludo};(handlers[GAME]||tic)();
</script></body></html>
