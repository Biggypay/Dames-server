<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TIKAN</title>
<style>
:root{--cyan:#00f5ff;--rose:#ff0066;--gold:#ffd700;--green:#00ff88;--bg:#050810;--field:#0a1a0a;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);touch-action:none;
  font-family:'Helvetica Neue',Arial,sans-serif;-webkit-user-select:none;user-select:none;}
body{display:flex;flex-direction:column;}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9998;
  background:repeating-linear-gradient(180deg,transparent 0px,transparent 3px,rgba(0,0,0,.06) 3px,rgba(0,0,0,.06) 4px);}

/* ─── HUD ─── */
#top,#bot{height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;position:relative;z-index:5;}
#top{background:rgba(5,8,16,.96);border-bottom:1px solid rgba(255,0,102,.3);}
#bot{background:rgba(5,8,16,.96);border-top:1px solid rgba(0,245,255,.3);}
.hud-who{display:flex;flex-direction:column;gap:2px;min-width:0;max-width:34%;}
.hud-team{font-size:9px;letter-spacing:2px;color:#7a869a;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hud-card{font-size:13px;min-height:15px;}
.hud-score{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;min-width:34px;text-align:center;}
.hud-score.pop{animation:spop .4s cubic-bezier(.36,.07,.19,.97);}
@keyframes spop{0%{transform:scale(1);}40%{transform:scale(1.9);}70%{transform:scale(.92);}100%{transform:scale(1);}}
.dots{display:flex;gap:5px;align-items:center;}
.dots span{width:9px;height:9px;border-radius:50%;display:inline-block;}

/* ─── ARÈNE ─── */
#arena{position:relative;flex:1;overflow:hidden;background:#071207;min-height:0;}
#gc{position:absolute;inset:0;width:100%;height:100%;}

#goal-screen{position:absolute;inset:0;z-index:60;pointer-events:none;display:flex;align-items:center;justify-content:center;opacity:0;}
.gs-inner{text-align:center;transform:scale(.4);}
.gs-word{font-size:clamp(60px,17vw,112px);font-weight:900;letter-spacing:-2px;color:transparent;-webkit-text-stroke:4px #fff;line-height:1;}
.gs-sub{font-size:10px;letter-spacing:8px;color:rgba(255,255,255,.55);margin-top:6px;}

#count{position:absolute;inset:0;z-index:55;display:none;align-items:center;justify-content:center;pointer-events:none;
  font-size:clamp(80px,26vw,150px);font-weight:900;color:var(--green);text-shadow:0 0 40px rgba(0,255,136,.7);}
#count.small{font-size:clamp(22px,7vw,40px);letter-spacing:8px;color:rgba(255,255,255,.85);text-shadow:none;}

.flash{position:absolute;inset:0;z-index:65;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.flash > div{text-align:center;padding:16px 26px;background:rgba(0,0,0,.82);border-radius:6px;max-width:88%;}
.flash b{display:block;font-size:clamp(16px,4.6vw,26px);font-weight:900;letter-spacing:2px;}
.flash i{display:block;font-style:normal;font-size:11px;letter-spacing:1px;color:rgba(255,255,255,.55);margin-top:6px;}

#wait{position:absolute;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  background:rgba(5,8,16,.96);}
#wait.hidden{display:none;}
.spinner{width:52px;height:52px;border:4px solid rgba(0,255,136,.2);border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#wait-txt{font-size:11px;letter-spacing:2px;color:rgba(255,255,255,.7);text-align:center;padding:0 20px;}

#reconn{position:absolute;top:0;left:0;right:0;z-index:80;display:none;padding:8px;text-align:center;font-size:11px;font-weight:700;letter-spacing:2px;
  background:rgba(239,68,68,.92);color:#fff;}
#reconn.show{display:block;}
#opp-away{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:70;display:none;padding:7px 16px;border-radius:99px;
  background:rgba(30,27,75,.95);border:1px solid rgba(255,215,0,.5);font-size:11px;font-weight:700;letter-spacing:1px;color:var(--gold);white-space:nowrap;}
#opp-away.show{display:block;}

/* ─── JOYSTICK ─── */
#joy{position:absolute;bottom:14px;left:12px;width:132px;height:132px;border-radius:50%;z-index:30;touch-action:none;}
#joy-ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(0,245,255,.18);background:rgba(0,245,255,.04);}
#joy-ring::before,#joy-ring::after{content:'';position:absolute;top:50%;left:50%;background:rgba(0,245,255,.12);}
#joy-ring::before{width:1px;height:70%;transform:translate(-50%,-50%);}
#joy-ring::after{width:70%;height:1px;transform:translate(-50%,-50%);}
#joy-knob{position:absolute;width:52px;height:52px;top:40px;left:40px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 38% 34%,rgba(0,245,255,.8),rgba(0,80,160,.5));border:2px solid rgba(0,245,255,.55);
  box-shadow:0 0 12px rgba(0,245,255,.25),inset 0 1px 0 rgba(255,255,255,.2);}
#joy-knob.active{box-shadow:0 0 22px rgba(0,245,255,.65),inset 0 1px 0 rgba(255,255,255,.2);}

/* ─── BOUTONS ─── */
#btns{position:absolute;bottom:14px;right:12px;display:flex;flex-direction:column;align-items:flex-end;gap:10px;z-index:30;}
#row2{display:flex;gap:10px;align-items:center;}
.bw{position:relative;width:84px;height:84px;display:flex;align-items:center;justify-content:center;}
.bb{position:absolute;width:70px;height:70px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;letter-spacing:1.5px;transition:transform .1s,background .15s,box-shadow .15s;}
.bb:active{transform:scale(.94);}
#btir{background:rgba(0,245,255,.09);border:2px solid rgba(0,245,255,.42);color:var(--cyan);}
#btir.on{background:rgba(0,245,255,.30);box-shadow:0 0 26px rgba(0,245,255,.65);}
#bdeg{background:rgba(255,90,0,.09);border:2px solid rgba(255,90,0,.44);color:#ff6a00;}
#bdeg.on{background:rgba(255,90,0,.32);box-shadow:0 0 26px rgba(255,90,0,.6);}
#bspr{background:rgba(255,215,0,.07);border:2px solid rgba(255,215,0,.20);color:var(--gold);}
#bspr.on{background:rgba(255,215,0,.28);box-shadow:0 0 20px rgba(255,215,0,.55);}
#bspr.locked{background:rgba(255,0,80,.07);border-color:rgba(255,0,80,.25);color:rgba(255,80,80,.7);}
.ring{position:absolute;top:-3px;left:-3px;pointer-events:none;}
#spr-arc{transition:stroke-dashoffset .08s linear,stroke .2s;}
body.spectator #joy,body.spectator #btns{display:none;}

/* ─── FIN ─── */
#modal{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(5,8,16,.97);}
#modal.show{display:flex;}
.m-tag{font-size:8px;letter-spacing:6px;color:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.1);padding:5px 12px;}
.m-title{font-size:clamp(32px,9vw,62px);font-weight:900;text-align:center;line-height:1;}
.m-score{font-size:clamp(52px,14vw,80px);font-weight:900;letter-spacing:10px;line-height:1;margin:4px 0;}
.m-msg{font-size:12px;color:rgba(255,255,255,.6);text-align:center;padding:0 24px;}
.m-prize{font-size:15px;font-weight:800;display:none;}
.m-stats{font-size:9px;color:#667;letter-spacing:1px;text-align:center;line-height:2.2;}
.m-stats b{color:#9aa4b8;}
#closeBtn{padding:14px 36px;font-size:11px;font-weight:700;letter-spacing:5px;background:transparent;border:1px solid rgba(0,255,136,.4);
  color:var(--green);border-radius:3px;cursor:pointer;-webkit-appearance:none;margin-top:8px;}
#closeBtn:active{background:var(--green);color:#000;}
body.chrome-hidden #top,body.chrome-hidden #bot{display:none;}
</style>
<script defer src="/mindspille-i18n.js"></script>
</head>
<body>

<div id="top">
  <div class="hud-who"><div class="hud-team" id="op-name">ADVERSAIRE</div><div class="hud-card" id="op-card"></div></div>
  <div class="dots" id="op-dots"></div>
  <div class="hud-score" id="op-score" style="color:var(--rose)">0</div>
</div>

<div id="arena">
  <canvas id="gc"></canvas>
  <div id="reconn">RECONNEXION…</div>
  <div id="opp-away"></div>
  <div id="count"></div>
  <div id="goal-screen"><div class="gs-inner" id="gs-inner"><div class="gs-word" id="gs-word">GOAL</div><div class="gs-sub" id="gs-sub"></div></div></div>

  <div id="joy"><div id="joy-ring"></div><div id="joy-knob"></div></div>
  <div id="btns">
    <div class="bw">
      <svg class="ring" viewBox="0 0 100 100" width="90" height="90" style="filter:drop-shadow(0 0 5px rgba(0,245,255,.5))">
        <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(0,245,255,.12)" stroke-width="7"/>
        <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(0,245,255,.70)" stroke-width="7" stroke-dasharray="276.46" stroke-dashoffset="0" transform="rotate(-90 50 50)"/>
      </svg>
      <div class="bb" id="btir">TIR</div>
    </div>
    <div id="row2">
      <div class="bw">
        <svg class="ring" viewBox="0 0 100 100" width="90" height="90" style="filter:drop-shadow(0 0 5px rgba(255,106,0,.5))">
          <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,106,0,.12)" stroke-width="7"/>
          <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,106,0,.70)" stroke-width="7" stroke-dasharray="276.46" stroke-dashoffset="0" transform="rotate(-90 50 50)"/>
        </svg>
        <div class="bb" id="bdeg">DÉG.</div>
      </div>
      <div class="bw">
        <svg class="ring" id="spr-ring" viewBox="0 0 100 100" width="84" height="84" style="top:0;left:0">
          <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,215,0,.10)" stroke-width="5"/>
          <circle id="spr-arc" cx="50" cy="50" r="44" fill="none" stroke="#ffd700" stroke-width="5" stroke-linecap="round" stroke-dasharray="276.46" stroke-dashoffset="0" transform="rotate(-90 50 50)"/>
        </svg>
        <div class="bb" id="bspr">SPR.</div>
      </div>
    </div>
  </div>

  <div id="wait"><div class="spinner"></div><div id="wait-txt">CONNEXION…</div></div>
</div>

<div id="bot">
  <div class="hud-who"><div class="hud-team" id="me-name">TOI</div><div class="hud-card" id="me-card"></div></div>
  <div class="hud-score" id="me-score" style="color:var(--cyan)">0</div>
  <div class="dots" id="me-dots"></div>
</div>

<div id="modal">
  <div class="m-tag" id="m-tag">TIKAN</div>
  <div class="m-title" id="m-title"></div>
  <div class="m-score" id="m-score"></div>
  <div class="m-msg" id="m-msg"></div>
  <div class="m-prize" id="m-prize"></div>
  <div class="m-stats" id="m-stats"></div>
  <button id="closeBtn">FERMER</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
(function () {
'use strict';
/* ══════════════════════════════════════════════════════════
   TIKAN en ligne — client.
   Le serveur décide de TOUT (positions, balle, buts, cartons).
   Cette page n'envoie que des entrées (joystick, tir, dégagement,
   sprint) et dessine ce que le serveur lui dit.
══════════════════════════════════════════════════════════ */
var $ = function (id) { return document.getElementById(id); };
var P = new URLSearchParams(location.search);

/* Le jeton arrive dans le fragment : jamais envoyé au serveur HTTP. */
var GAME_AUTH_TOKEN = '';
try {
  var H = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  GAME_AUTH_TOKEN = H.get('token') || '';
  if (GAME_AUTH_TOKEN) history.replaceState(null, '', location.pathname + location.search);
} catch (e) {}

var IS_SPECTATOR = P.get('spectate') === '1' || P.get('spectator') === '1';
var SHOW_CHROME = !(IS_SPECTATOR && (P.get('controls') === '0' || P.get('chrome') === '0'));
var SPECTATOR_TOKEN = '', spectatorInit = false;
var ROOM_ID = P.get('room') || '';
var MY_SLOT = IS_SPECTATOR ? 1 : (parseInt(P.get('player') || '1', 10) === 2 ? 2 : 1);
var P1_ID = P.get('p1Id') || '', P2_ID = P.get('p2Id') || '';
var P1_NAME = P.get('p1Name') || 'Joueur 1', P2_NAME = P.get('p2Name') || 'Joueur 2';
var BET_AMOUNT = parseFloat(P.get('bet') || '0') || 0;
var CURRENCY = P.get('currency') || 'HTG';
var GAME_ID = P.get('gameId') || P.get('matchId') || '';
if (!ROOM_ID && P1_ID && P2_ID) { var ids = [P1_ID, P2_ID].sort(); ROOM_ID = 'tkn-' + ids[0].slice(-8) + '-' + ids[1].slice(-8); }
if (!ROOM_ID) ROOM_ID = GAME_ID;
var MY_NAME = MY_SLOT === 1 ? P1_NAME : P2_NAME;
var OP_NAME = MY_SLOT === 1 ? P2_NAME : P1_NAME;
var MY_SUPABASE_ID = MY_SLOT === 1 ? P1_ID : P2_ID;
var OP_SUPABASE_ID = MY_SLOT === 1 ? P2_ID : P1_ID;
var FLIP = MY_SLOT === 2;            /* le joueur 2 voit le terrain retourné de 180° : il attaque toujours vers le haut */
var ME = MY_SLOT - 1, OP = MY_SLOT === 1 ? 1 : 0;

/* Terrain (remplacé par celui du serveur au démarrage). */
var F = { W: 360, H: 640, FX: 20, FY: 24, FW: 320, FH: 592, GW: 86, GH: 37, PR: 14, BR: 9 };
var MAX_GOALS = 5, PSPD = 192, SPRINT_MULT = 1.45;

document.body.classList.toggle('spectator', IS_SPECTATOR);
document.body.classList.toggle('chrome-hidden', !SHOW_CHROME);

/* ─── AUDIO ─── */
var AC = null;
try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
function rac() { if (AC && AC.state === 'suspended') AC.resume(); }
function bip(f, d, v, t) {
  if (!AC) return;
  try {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = t || 'sine'; o.frequency.setValueAtTime(f, AC.currentTime);
    g.gain.setValueAtTime(v || .14, AC.currentTime); g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + d);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + d);
  } catch (e) {}
}

/* ─── ÉTAT ─── */
var socket = null, started = false, over = false, overShown = false;
var buf = [];                    /* instantanés reçus : { at, s } */
var snap = null;                 /* le plus récent */
var lastFb = 0, lastGoalAt = 0;
var pred = { x: 0, y: 0, dir: 0, ok: false };   /* prédiction de MON joueur */
var parts = [], rings = [], trail = [], dust = [[], []];
var INTERP_MS = 100;

/* ─── CANVAS ─── */
var arena = $('arena'), gc = $('gc'), ctx = gc.getContext('2d');
var cw = 0, ch = 0, dpr = 1, scale = 1, offX = 0, offY = 0;
function resize() {
  cw = arena.clientWidth || window.innerWidth; ch = arena.clientHeight || 300;
  dpr = Math.min(2, window.devicePixelRatio || 1);
  gc.width = Math.round(cw * dpr); gc.height = Math.round(ch * dpr);
  scale = Math.min(cw / F.W, ch / F.H);
  offX = (cw - F.W * scale) / 2; offY = (ch - F.H * scale) / 2;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function () { setTimeout(resize, 150); });

/* ─── ENTRÉES ─── */
var JR = 66, KR = 26, DEAD = .11;
var jDX = 0, jDY = 0, jOn = false, jID = -1;
var jZ = $('joy'), jK = $('joy-knob');
var T = { kick: false, deg: false, spr: false }, K = {};
function jOrig() { var r = jZ.getBoundingClientRect(); return { x: r.left + JR, y: r.top + JR }; }
function jPos(nx, ny) { var m = JR - KR; jK.style.left = (JR - KR + nx * m) + 'px'; jK.style.top = (JR - KR + ny * m) + 'px'; jK.classList.toggle('active', jOn); }
function jReset() { jDX = 0; jDY = 0; jOn = false; jID = -1; jPos(0, 0); pushInput(); }
function jUpd(t) {
  var o = jOrig(), dx = t.clientX - o.x, dy = t.clientY - o.y, d = Math.sqrt(dx * dx + dy * dy), m = JR - KR;
  if (d > m) { dx = dx / d * m; dy = dy / d * m; }
  jDX = dx / m; jDY = dy / m; jPos(jDX, jDY); pushInput();
}
jZ.addEventListener('touchstart', function (e) { e.preventDefault(); var t = e.changedTouches[0]; jID = t.identifier; jOn = true; jUpd(t); rac(); }, { passive: false });
jZ.addEventListener('touchmove', function (e) { e.preventDefault(); for (var i = 0; i < e.changedTouches.length; i++) if (e.changedTouches[i].identifier === jID) jUpd(e.changedTouches[i]); }, { passive: false });
jZ.addEventListener('touchend', function (e) { e.preventDefault(); jReset(); }, { passive: false });
jZ.addEventListener('touchcancel', function (e) { e.preventDefault(); jReset(); }, { passive: false });

function bindB(id, key) {
  var el = $(id);
  function on(e) { e.preventDefault(); T[key] = true; el.classList.add('on'); rac(); pushInput(); }
  function off(e) { e.preventDefault(); T[key] = false; el.classList.remove('on'); pushInput(); }
  el.addEventListener('touchstart', on, { passive: false });
  el.addEventListener('touchend', off, { passive: false });
  el.addEventListener('touchcancel', off, { passive: false });
  el.addEventListener('mousedown', on); el.addEventListener('mouseup', off); el.addEventListener('mouseleave', function (e) { if (T[key]) off(e); });
}
bindB('btir', 'kick'); bindB('bdeg', 'deg'); bindB('bspr', 'spr');

document.addEventListener('keydown', function (e) {
  K[e.code] = true; rac();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.code) > -1) e.preventDefault();
  pushInput();
});
document.addEventListener('keyup', function (e) { K[e.code] = false; pushInput(); });

/* Entrée courante, en coordonnées ÉCRAN (le joystick), puis MONDE (retournée pour le joueur 2). */
function readInput() {
  var dx = jDX, dy = jDY, kx = 0, ky = 0;
  if (K.KeyW || K.ArrowUp) ky -= 1; if (K.KeyS || K.ArrowDown) ky += 1;
  if (K.KeyA || K.ArrowLeft) kx -= 1; if (K.KeyD || K.ArrowRight) kx += 1;
  if (kx || ky) { var d = Math.sqrt(kx * kx + ky * ky) || 1; dx = kx / d; dy = ky / d; }
  var mg = Math.sqrt(dx * dx + dy * dy); if (mg < DEAD) { dx = 0; dy = 0; mg = 0; }
  if (FLIP) { dx = -dx; dy = -dy; }
  return { dx: dx, dy: dy, mg: mg, kick: !!(K.Space || T.kick), deg: !!(K.KeyE || T.deg), spr: !!(K.ShiftLeft || K.ShiftRight || T.spr) };
}
var lastSent = '', lastSentAt = 0;
function pushInput(force) {
  if (IS_SPECTATOR || !socket || !socket.connected || !started || over) return;
  var i = readInput(), key = [i.dx.toFixed(2), i.dy.toFixed(2), i.kick, i.deg, i.spr].join('|'), now = Date.now();
  /* Un changement part tout de suite (au plus toutes les 16 ms) ; sans changement, un battement toutes les 100 ms
     garde l'entrée vivante : le serveur lâche une entrée qui n'est plus rafraîchie. */
  if (key === lastSent && !force && now - lastSentAt < 100) return;
  if (key !== lastSent && now - lastSentAt < 16 && !force) return;
  lastSent = key; lastSentAt = now;
  socket.emit('tikan_input', { room: ROOM_ID, player: MY_SLOT, input: { dx: +i.dx.toFixed(3), dy: +i.dy.toFixed(3), kick: i.kick, deg: i.deg, spr: i.spr } });
}
setInterval(function () { pushInput(true); }, 50);

/* ─── MESSAGES (affichage) ─── */
function flashMsg(title, sub, col, dur) {
  var d = document.createElement('div'); d.className = 'flash';
  d.innerHTML = '<div style="border:1px solid ' + col + '44"><b style="color:' + col + ';text-shadow:0 0 16px ' + col + '"></b><i></i></div>';
  d.querySelector('b').textContent = title; d.querySelector('i').textContent = sub || '';
  arena.appendChild(d);
  setTimeout(function () { d.style.transition = 'opacity .3s'; d.style.opacity = '0'; setTimeout(function () { d.remove(); }, 320); }, dur || 1800);
}
function dotsHTML(n, col) {
  var s = '';
  for (var i = 0; i < MAX_GOALS; i++) s += '<span style="background:' + (i < n ? col : 'rgba(255,255,255,.12)') + ';box-shadow:' + (i < n ? '0 0 6px ' + col : 'none') + '"></span>';
  return s;
}
var shown = { sc: [-1, -1], cd: [-1, -1] };
function updHUD(s) {
  if (!s) return;
  if (shown.sc[0] !== s.sc[0] || shown.sc[1] !== s.sc[1]) {
    var meSc = s.sc[ME], opSc = s.sc[OP];
    var changedMe = shown.sc[ME] !== -1 && shown.sc[ME] !== meSc, changedOp = shown.sc[OP] !== -1 && shown.sc[OP] !== opSc;
    $('me-score').textContent = meSc; $('op-score').textContent = opSc;
    $('me-dots').innerHTML = dotsHTML(meSc, '#00f5ff'); $('op-dots').innerHTML = dotsHTML(opSc, '#ff0066');
    function pop(el) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
    if (changedMe) pop($('me-score')); if (changedOp) pop($('op-score'));
    shown.sc = s.sc.slice();
  }
  if (shown.cd[0] !== s.cd[0] || shown.cd[1] !== s.cd[1]) {

  drawParticles(dt);
  if (v.s) { drawCorner(v.p[0], v.s.cn[0], '#ffd700'); drawCorner(v.p[1], v.s.cn[1], '#ffd700');
    if (!IS_SPECTATOR && v.s.cn[ME] > 0) label('SORT DU COIN!', v.p[ME].x, v.p[ME].y - F.PR - 28, 'bold ' + Math.round(F.PR * .55) + 'px Helvetica,sans-serif', '#ff3344', 'center', '#ff0033'); }
  requestAnimationFrame(draw);
}

/* ─── FIN DE PARTIE ─── */
function showOver(d) {
  if (overShown) return; overShown = true;
  var draw0 = d.winnerSlot === 0 || d.winner === 'draw';
  var iWon = !draw0 && (d.winnerSupabaseId === MY_SUPABASE_ID || d.winnerSlot === MY_SLOT);
  var sc = d.scores || (snap && snap.sc) || [0, 0], reason = d.reason || 'normal';
  var title, col, msg;
  if (draw0) { title = 'MATCH NUL'; col = '#ffd700'; msg = reason === 'both_disconnected' ? 'Les deux joueurs étaient absents.' : reason === 'mutual_quit' ? 'Partie arrêtée d’un commun accord.' : 'Personne n’a pu départager les deux équipes.'; }
  else if (iWon) { title = 'VICTOIRE !'; col = '#00f5ff'; msg = reason === 'forfeit' ? OP_NAME + ' a quitté la partie.' : reason === 'timeout' ? OP_NAME + ' a dépassé le temps.' : MAX_GOALS + ' buts ou meilleur score au temps : bien joué !'; }
  else { title = 'DÉFAITE'; col = '#ff0066'; msg = reason === 'forfeit' ? 'Tu as quitté la partie.' : reason === 'timeout' ? 'Tu as dépassé le temps.' : OP_NAME + ' remporte le match.'; }
  if (IS_SPECTATOR) { title = 'MATCH TERMINÉ'; col = '#00ff88'; msg = draw0 ? 'Match nul.' : (d.winnerSlot === 1 ? P1_NAME : P2_NAME) + ' gagne.'; }
  $('m-title').textContent = title; $('m-title').style.color = col; $('m-title').style.textShadow = '0 0 30px ' + col;
  $('m-score').innerHTML = '<span style="color:#00f5ff">' + sc[ME] + '</span><span style="color:#222"> — </span><span style="color:#ff0066">' + sc[OP] + '</span>';
  $('m-msg').textContent = msg;
  var bet = d.betAmount || BET_AMOUNT;
  if (!IS_SPECTATOR && bet > 0 && !draw0) {
    var pz = $('m-prize'); pz.style.display = 'block'; pz.style.color = iWon ? '#00ff88' : '#ff6677';
    pz.textContent = iWon ? '+' + (d.netGain != null ? Number(d.netGain).toFixed(0) : (bet * .9).toFixed(0)) + ' ' + CURRENCY + ' (net)' : '-' + bet + ' ' + CURRENCY;
  }
  var st = d.stats;
  if (st) {
    var tot = (st.poss[0] + st.poss[1]) || 1;
    $('m-stats').innerHTML = 'POSSESSION <b>TOI ' + Math.round(st.poss[ME] / tot * 100) + '%</b> · <b>ADV ' + Math.round(st.poss[OP] / tot * 100) + '%</b><br>TIRS TOI <b>' + st.shots[ME] + '</b> (cadrés <b>' + st.onTarget[ME] + '</b>) · ADV <b>' + st.shots[OP] + '</b> (cadrés <b>' + st.onTarget[OP] + '</b>)';
  }
  $('modal').classList.add('show');
  if (iWon) bip(660, .15, .25), setTimeout(function () { bip(880, .3, .25); }, 160);
}
function handleOver(d) {
  if (over) return; over = true;
  jReset();
  /* Après un but, on laisse d'abord le « GOAL » vivre ; un forfait s'affiche tout de suite. */
  var instant = d.reason === 'forfeit' || d.reason === 'timeout' || d.reason === 'both_disconnected' || d.reason === 'mutual_quit';
  var wait = instant ? 0 : Math.max(0, 1700 - (Date.now() - lastGoalAt));
  setTimeout(function () { showOver(d); }, wait);
}
function closeGame() { try { window.parent.postMessage({ type: 'close_game' }, '*'); } catch (e) {} $('modal').classList.remove('show'); }
$('closeBtn').addEventListener('click', closeGame);
$('closeBtn').addEventListener('touchend', function (e) { e.preventDefault(); closeGame(); });

/* ─── RÉSEAU ─── */
var awayTimer = null;
function showAway(deadline) {
  var el = $('opp-away'); el.classList.add('show');
  clearInterval(awayTimer);
  function tick() { var s = Math.max(0, Math.round((deadline - Date.now()) / 1000)); el.textContent = '⏸ ADVERSAIRE ABSENT — ' + s + ' s'; if (s <= 0) clearInterval(awayTimer); }
  tick(); awayTimer = setInterval(tick, 500);
}
function hideAway() { clearInterval(awayTimer); $('opp-away').classList.remove('show'); }

function begin(d) {
  if (d.field) { F = d.field; }
  if (d.maxGoals) MAX_GOALS = d.maxGoals;
  if (d.opponentName && !IS_SPECTATOR) OP_NAME = d.opponentName;
  applyNames();
  started = true; pred.ok = false; resize();
  $('wait').classList.add('hidden');
  if (d.snap) { buf = []; pushSnap(d.snap); }
  if (d.paused) { $('opp-away').classList.add('show'); $('opp-away').textContent = '⏸ PARTIE EN PAUSE'; }
}

function initSocket() {
  if (IS_SPECTATOR && !spectatorInit) return;
  $('wait-txt').textContent = IS_SPECTATOR ? 'CONNEXION AU DIRECT…' : 'ROOM: ' + (ROOM_ID || 'MANQUANT') + ' | SLOT: ' + MY_SLOT;
  socket = io({ transports: ['websocket', 'polling'], auth: { token: IS_SPECTATOR ? SPECTATOR_TOKEN : GAME_AUTH_TOKEN },
    reconnection: true, reconnectionAttempts: Infinity, reconnectionDelay: 1000, reconnectionDelayMax: 5000, timeout: 20000 });
  window.mindspilleSocket = socket;
  try { window.dispatchEvent(new Event('mindspille:socket')); } catch (e) {}

  socket.on('connect', function () {
    $('reconn').classList.remove('show');
    if (IS_SPECTATOR) { socket.emit('spectator_join', { gameId: GAME_ID }); return; }
    socket.emit('tikan_join', { room: ROOM_ID, gameId: GAME_ID, player: MY_SLOT, supabaseId: MY_SUPABASE_ID, name: MY_NAME, bet: BET_AMOUNT, currency: CURRENCY });
    setTimeout(function () { if (!started && !over) $('wait-txt').textContent = 'EN ATTENTE DE VOTRE ADVERSAIRE…'; }, 6000);
  });
  socket.on('disconnect', function () { $('reconn').classList.add('show'); });

  socket.on('tikan_start', begin);
  socket.on('tikan_state', function (s) { if (started || IS_SPECTATOR) { if (!started) { started = true; $('wait').classList.add('hidden'); resize(); applyNames(); } pushSnap(s); } });
  socket.on('tikan_event', onEvent);
  socket.on('tikan_opponent_disconnected', function () { jReset(); showAway(Date.now() + 60000); });
  socket.on('game:reconnect_deadline', function (d) { if (d && d.reconnectDeadline) showAway(d.reconnectDeadline); });
  socket.on('tikan_game_resumed', hideAway);
  socket.on('player:reconnected', hideAway);
  socket.on('tikan_player_status', function (d) { if (d && d.connected) hideAway(); });
  socket.on('game:over', handleOver);
  socket.on('game:result', function (d) { var m = d && d.postMessage; if (m && !over) handleOver(m); });
  socket.on('game:error', function (d) { if (d && d.message) flashMsg('⚠️ ' + d.message, '', '#ff6677', 2600); });

  /* Spectateur : un premier cliché, puis le flux d'instantanés. */
  socket.on('spectator:joined', function () { try { window.parent.postMessage({ type: 'spectator:connected', game: 'tikan', gameId: GAME_ID }, '*'); } catch (e) {} });
  socket.on('spectator_state', function (sn) {
    var st = sn && sn.state; if (!st) return;
    if (st.field) F = st.field; if (st.maxGoals) MAX_GOALS = st.maxGoals;
    if (sn.players) { P1_NAME = (sn.players[1] && sn.players[1].name) || P1_NAME; P2_NAME = (sn.players[2] && sn.players[2].name) || P2_NAME; }
    applyNames(); started = true; $('wait').classList.add('hidden'); resize();
    if (st.snap) pushSnap(st.snap);
  });
  socket.on('spectator:error', function (d) {
    var code = d && d.code;
    $('wait-txt').textContent = (d && d.message) || 'Direct indisponible.';
    try { window.parent.postMessage({ type: 'spectator:error', game: 'tikan', gameId: GAME_ID, code: code, retrying: code === 'room_not_live', message: (d && d.message) || '' }, '*'); } catch (e) {}
    if (code === 'room_not_live') setTimeout(function () { if (socket && socket.connected) socket.emit('spectator_join', { gameId: GAME_ID }); }, 2500);
  });
}

window.addEventListener('message', function (e) {
  if (!e.data) return;
  if (IS_SPECTATOR && e.data.type === 'spectator:init') {
    if (e.data.gameId && GAME_ID && e.data.gameId !== GAME_ID) return;
    SPECTATOR_TOKEN = typeof e.data.token === 'string' ? e.data.token : '';
    if (typeof e.data.player1Name === 'string' && e.data.player1Name.trim()) P1_NAME = e.data.player1Name.trim().slice(0, 24);
    if (typeof e.data.player2Name === 'string' && e.data.player2Name.trim()) P2_NAME = e.data.player2Name.trim().slice(0, 24);
    if (typeof e.data.showControls === 'boolean') { SHOW_CHROME = e.data.showControls; document.body.classList.toggle('chrome-hidden', !SHOW_CHROME); resize(); }
    applyNames(); spectatorInit = true; if (!socket) initSocket(); return;
  }
  if (IS_SPECTATOR && e.data.type === 'spectator:controls') { SHOW_CHROME = e.data.show === true; document.body.classList.toggle('chrome-hidden', !SHOW_CHROME); resize(); return; }
  if (!IS_SPECTATOR && e.data.type === 'client:mutual_quit' && socket && socket.connected) socket.emit('game_mutual_quit', { room: ROOM_ID, game: 'tikan', player: MY_SLOT });
});

/* Le navigateur peut mettre la page en veille : on relâche tout pour ne pas courir dans le vide. */
document.addEventListener('visibilitychange', function () { if (document.hidden) { jReset(); T.kick = T.deg = T.spr = false; pushInput(true); } });

applyNames(); updHUD({ sc: [0, 0], cd: [0, 0] }); shown = { sc: [0, 0], cd: [0, 0] };
resize();
requestAnimationFrame(draw);
try { window.parent.postMessage({ type: 'spectator:ready', game: 'tikan', gameId: GAME_ID }, '*'); } catch (e) {}
if (!IS_SPECTATOR) initSocket();
})();
</script>
<script src="/mindspille-split.js"></script>
